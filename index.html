<script>
const prologuePages = [
`チャンネル登録者数、わずか302人。
オカルト系底辺配信者である私のチャンネルは、完全に限界を迎えていた。

「一発逆転するなら、ガチでヤバい場所に行くしかない」

ネットの裏掲示板で見つけた『首吊りニュータウン』。
全ての家が全く同じ形をしており、住んだ者が全員1ヶ月以内に不可解な自殺を遂げたという……。
今は地図からも、行政の記録からも完全に消された、狂気の新興住宅街。

誰も訪れないその街は、今夜、私が最初で最後の配信者となる。`,
`深夜2時。私はスマホ1台を片手に、この街へ生配信をしながら足を踏み入れた。

街に一歩入った瞬間、空気が変わった。
月明かりすら届かない闇の中、全く同じ形の家が、整然と、不気味なほど静かに並んでいる。
窓には光ひとつない。草木も風も音もない。
ただ、遠くから微かに……何かが軋むような音が聞こえた気がした。

視聴者のコメントだけが、この暗闇の中の唯一の救いだ。
「ガチじゃん」「やめろよマジで」「主、後ろ見て」

……嘘だよな？　釣りだよな？`,
`だが、この時の私はまだ知らなかった。

配信のコメント欄が、この後「本当の絶望」で埋め尽くされることを。
そして、この街には私以外にも──
先に来た者がいたことを。

前の配信者が、遺した何かが、この街のどこかにある。
それを見つければ、真実に近づける。
あるいは……取り返しのつかない何かに、近づいてしまうのかもしれない。

「……行くぞ。みんな、ついてきてくれ」

▶ 画面をタップして、生配信を開始する`
];
let prologuePageIdx = 0;
let prologueTyping = false;
let prologueTypingTimer = null;
let prologueDone = false;
const prologueEl = document.getElementById('prologue');
const prologueTextEl = document.getElementById('prologue-text');
const prologueHintEl = document.getElementById('prologue-hint');
const pageIndicatorEl = document.getElementById('page-indicator');
const loadingEl = document.getElementById('loading');

function showProloguePage(idx) {
  prologuePageIdx = idx;
  prologueTextEl.textContent = '';
  prologueHintEl.textContent = '';
  pageIndicatorEl.textContent = `— ${idx + 1} / ${prologuePages.length} —`;
  typePage(prologuePages[idx], () => {
    prologueHintEl.textContent = (idx < prologuePages.length - 1)
      ? '▶ タップして続ける'
      : '▶ 画面をタップして、生配信を開始する';
  });
}
function typePage(text, onDone) {
  prologueTyping = true;
  prologueDone = false;
  let i = 0;
  clearInterval(prologueTypingTimer);
  prologueTypingTimer = setInterval(() => {
    if (i < text.length) prologueTextEl.textContent += text[i++];
    else {
      clearInterval(prologueTypingTimer);
      prologueTyping = false;
      prologueDone = true;
      if (onDone) onDone();
    }
  }, 28);
}
prologueEl.addEventListener('click', handlePrologueTap);
prologueEl.addEventListener('touchstart', (e) => { e.preventDefault(); handlePrologueTap(); }, { passive:false });
function handlePrologueTap() {
  if (prologueTyping) {
    clearInterval(prologueTypingTimer);
    prologueTyping = false;
    prologueDone = true;
    prologueTextEl.textContent = prologuePages[prologuePageIdx];
    prologueHintEl.textContent = (prologuePageIdx < prologuePages.length - 1) ? '▶ タップして続ける' : '▶ 画面をタップして、生配信を開始する';
    return;
  }
  if (!prologueDone) return;
  if (prologuePageIdx < prologuePages.length - 1) showProloguePage(prologuePageIdx + 1);
  else {
    prologueEl.style.transition = 'opacity 1.2s';
    prologueEl.style.opacity = '0';
    setTimeout(() => { prologueEl.style.display = 'none'; startGame(); }, 1200);
  }
}
showProloguePage(0);

let audioCtx = null;
let bgmStarted = false;
function startBGM() {
  if (bgmStarted) return;
  bgmStarted = true;
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;
  audioCtx = new AudioContextClass();
  const master = audioCtx.createGain();
  master.gain.value = 0.03;
  master.connect(audioCtx.destination);

  const lowpass = audioCtx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 420;
  lowpass.Q.value = 1.2;
  lowpass.connect(master);

  const osc1 = audioCtx.createOscillator(); osc1.type = 'sine'; osc1.frequency.value = 48;
  const osc2 = audioCtx.createOscillator(); osc2.type = 'triangle'; osc2.frequency.value = 65.4;
  const osc3 = audioCtx.createOscillator(); osc3.type = 'sine'; osc3.frequency.value = 98.0;

  const gain1 = audioCtx.createGain(); const gain2 = audioCtx.createGain(); const gain3 = audioCtx.createGain();
  gain1.gain.value = 0.8; gain2.gain.value = 0.22; gain3.gain.value = 0.12;
  osc1.connect(gain1).connect(lowpass); osc2.connect(gain2).connect(lowpass); osc3.connect(gain3).connect(lowpass);

  const lfo = audioCtx.createOscillator(); const lfoGain = audioCtx.createGain(); lfo.frequency.value = 0.08; lfoGain.gain.value = 18; lfo.connect(lfoGain).connect(osc2.frequency);
  const lfo2 = audioCtx.createOscillator(); const lfo2Gain = audioCtx.createGain(); lfo2.frequency.value = 0.11; lfo2Gain.gain.value = 8; lfo2.connect(lfo2Gain).connect(osc3.frequency);

  osc1.start(); osc2.start(); osc3.start(); lfo.start(); lfo2.start();
}
window.addEventListener('pointerdown', startBGM, { passive:true });
window.addEventListener('touchstart', startBGM, { passive:true });

setInterval(() => {

  baseViewers = Math.max(280, Math.min(380, baseViewers + delta));

  {name:'匿名F', msg:'そこの家怪しくない？', color:'#ffcc88'},
  {name:'幽霊部員', msg:'スマホの電池大丈夫？', color:'#cccccc'},
  {name:'ガチ勢', msg:'地図にない場所とかマジ？', color:'#aaaaff'},
  {name:'都市伝説マニア', msg:'首吊りニュータウンって実在するの？', color:'#ffaaaa'},
  {name:'深夜ランナー', msg:'一人で行くのやばすぎw', color:'#cccccc'},
  {name:'匿名B', msg:'前の配信者どうなったの？', color:'#ff8888'},
  {name:'観測者α', msg:'あそこの窓…', color:'#ffaaaa'},
  {name:'名無し999', msg:'骨の音みたいなの聞こえた？', color:'#ff6666'},
  {name:'深淵', msg:'四つん這いの影映った', color:'#ff4444'},
  {name:'幽体離脱', msg:'早く赤いスマホ探して', color:'#ffcc88'},
  {name:'真相追求', msg:'その家の前で足止まったぞ', color:'#aaccff'},
  {name:'匿名Z', msg:'主、本当に帰れるの？', color:'#ff8888'},
];
const chatInner = document.getElementById('chat-inner');
function addChatMessage(custom) {
  const msg = custom || chatMessages[Math.floor(Math.random() * chatMessages.length)];
  const div = document.createElement('div');
  div.className = 'chat-msg';
  div.innerHTML = `<span class="chat-name" style="color:${msg.color}">${msg.name}</span>${msg.msg}`;
  chatInner.appendChild(div);
  while (chatInner.children.length > 20) chatInner.removeChild(chatInner.firstChild);
}
let chatInterval = null;
function startChat() {
  for (let i = 0; i < 5; i++) setTimeout(addChatMessage, i * 300);
  chatInterval = setInterval(addChatMessage, 1800 + Math.random() * 1200);
  setInterval(() => {
    clearInterval(chatInterval);
    chatInterval = setInterval(addChatMessage, 1200 + Math.random() * 1400);
  }, 15000);
}

const storyPages = [
`あ、あったわ！みんな見て、机の上に前の配信者のものらしきスマホが落ちてる。
画面バキバキだけど、電源が入るな……どれどれ、保存されてる動画データを見てみよう……`,
`動画内の前の配信者
「ハァハァ……おい嘘だろ、出口が見つからない！
どの角を曲がっても同じ家ばかりだ！
それに……後ろからアイツが追ってくる！
関節をパキパキ鳴らしながら、四つん這いで、あり得ないスピードで這いつくばって……！」`,
`動画内の前の配信者
「いやだ、来ないでくれ！
ストーカーみたいにずっと私の後ろを……ッ！
窓から覗いてる！
ポ、ポ、ポ、って声が頭から離れないんだよおぉぉぉ！」

……ここで動画が途切れてる。
これ、ガチのやつじゃん……`,
`（コメント欄：「おい主、後ろ」「ガチでヤバいって」「窓の外に誰かいる」「四つん這いの女映ったぞ！！」）

……え？みんな何言って……。

その時、遠くの道路から
『パキッ、パキパキ……』と、骨が折れるような音が響き渡った。`
];
let storyPageIdx = 0;
let storyActive = false;
const storyPanel = document.getElementById('story-panel');
const storyText = document.getElementById('story-text');
const storyPageNum = document.getElementById('story-page-num');
let phonePickedUp = false;
let chapter1Done = false;
function openStory() {
  if (storyActive || phonePickedUp) return;
  storyActive = true;
  storyPageIdx = 0;
  storyPanel.classList.add('active');
  showStoryPage(0);
  lockMovement = true;
}
function showStoryPage(idx) {
  storyText.innerHTML = '';
  storyPageNum.textContent = `${idx + 1} / ${storyPages.length}`;
  let text = storyPages[idx];
  if (idx === 3) {
    text = text.replace('（コメント欄：', '<span class="story-yellow">（コメント欄：');
    text = text.replace('）', '）</span>');
  }
  if (idx === 1 || idx === 2) {
    text = text.replace('動画内の前の配信者', '<span class="story-red">動画内の前の配信者</span>');
  }
  storyText.innerHTML = text;
}
function advanceStory() {
  if (!storyActive) return;
  storyPageIdx++;
  if (storyPageIdx < storyPages.length) {
    showStoryPage(storyPageIdx);
  } else {
    storyPanel.classList.remove('active');
    storyActive = false;
    phonePickedUp = true;
    lockMovement = false;
    chapter1Done = true;
    document.getElementById('objective-text').textContent = '何かが来る。家や柵の裏に隠れて視線を切り、お地蔵様の結界へ逃げろ！';
    const flash = document.getElementById('chapter-flash');
    flash.style.display = 'block';
    flash.style.opacity = '0.6';
    setTimeout(() => { flash.style.opacity = '0'; setTimeout(() => { flash.style.display = 'none'; }, 500); }, 300);
    const specialMsgs = ['おい主、後ろ！！', '窓から顔見えた', '四つん這いの影！！', 'ガチだこれ逃げろ！', '骨の音やばすぎ', '早く逃げて！！'];
    specialMsgs.forEach((m, i) => setTimeout(() => addChatMessage({ name:'警告', msg:m, color:'#ff6666' }), i * 180));
  }
}
storyPanel.addEventListener('click', advanceStory);
storyPanel.addEventListener('touchstart', (e) => { e.preventDefault(); advanceStory(); }, { passive:false });

let gameStarted = false;
let lockMovement = false;

function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  loadingEl.classList.add('active');
  startChat();
  initThree();
}

function loadGLTF(url) {
  return new Promise((resolve, reject) => {
    const loader = new THREE.GLTFLoader();
    loader.load(url, resolve, undefined, reject);
  });
}

function normalizeModel(root, targetHeight = 5) {
  root.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(root);
  const size = box.getSize(new THREE.Vector3());
  const scale = targetHeight / Math.max(size.y, 0.0001);
  root.scale.setScalar(scale);
  root.updateMatrixWorld(true);
  const box2 = new THREE.Box3().setFromObject(root);
  const center = box2.getCenter(new THREE.Vector3());
  const min = box2.min.clone();
  root.position.x -= center.x;
  root.position.z -= center.z;
  root.position.y -= min.y;
  root.updateMatrixWorld(true);
  return root;
}
function groundToSurface(obj) {
  obj.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  // If the model pivot is centered, this lifts it by half-height;
  // if it already has a bottom pivot, the extra lift is zeroed by min.y.
  obj.position.y += (size.y / 2) - box.min.y;
  obj.updateMatrixWorld(true);
  return obj;
}
function clonePreparedModel(template) {
  const cloned = template.clone(true);
  cloned.traverse(obj => {
    if (obj.isMesh) {
      obj.castShadow = false;
      obj.receiveShadow = false;
      if (obj.material) obj.material = obj.material.clone();
    }
  });
  return cloned;
}
function makeFallbackHouse() {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(6, 3.5, 5), new THREE.MeshLambertMaterial({ color:0x0c0c0e }));
  body.position.y = 1.75; group.add(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(4.5, 2.5, 4), new THREE.MeshLambertMaterial({ color:0x090909 }));
  roof.rotation.y = Math.PI / 4; roof.position.y = 4.75; group.add(roof);
  return group;
}
function makeFallbackLamp() {
  const group = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 5, 6), new THREE.MeshLambertMaterial({ color:0x0a0a0c }));
  pole.position.y = 2.5; group.add(pole);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.25, 0.6), new THREE.MeshLambertMaterial({ color:0x151520 }));
  head.position.y = 5.1; group.add(head);
  return group;
}

async function initThree() {
  const canvas = document.getElementById('canvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:false });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = false;
  renderer.setClearColor(0x000000);

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x000000, 5, 50);
  scene.background = new THREE.Color(0x000204);

  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1200);
  camera.position.set(0, 1.65, 0);
  scene.add(camera);

  const ambLight = new THREE.AmbientLight(0x111827, 0.2); scene.add(ambLight);
  const ptLight = new THREE.PointLight(0x223344, 3.6, 45, 1); ptLight.position.set(0, 6, 0); scene.add(ptLight);
  const ptLight2 = new THREE.PointLight(0x112233, 2.4, 40, 1); ptLight2.position.set(12, 5, -30); scene.add(ptLight2);

  const flashlight = new THREE.SpotLight(0xfff6dd, 10.8, 70, Math.PI / 6.5, 0.45, 1);
  flashlight.position.set(0, 0.8, 0);
  flashlight.target.position.set(0, 0.45, -18);
  camera.add(flashlight);
  camera.add(flashlight.target);

  let flickerTimer = 0;

  const groundGeo = new THREE.PlaneGeometry(300, 300);
  const groundMat = new THREE.MeshLambertMaterial({ color:0x0a0a0c });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  const roadGeo = new THREE.PlaneGeometry(8, 300);
  const roadMat = new THREE.MeshLambertMaterial({ color:0x0d0d10 });
  const road = new THREE.Mesh(roadGeo, roadMat);
  road.rotation.x = -Math.PI / 2;
  road.position.set(0, 0.01, 0);
  scene.add(road);

  for (let z = -140; z < 140; z += 8) {
    const lineGeo = new THREE.PlaneGeometry(0.15, 4);
    const lineMat = new THREE.MeshBasicMaterial({ color:0x222222 });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.rotation.x = -Math.PI / 2;
    line.position.set(0, 0.02, z);
    scene.add(line);
  }

  [-4.5, 4.5].forEach(x => {
    const swGeo = new THREE.PlaneGeometry(1.5, 300);
    const swMat = new THREE.MeshLambertMaterial({ color:0x0e0e12 });
    const sw = new THREE.Mesh(swGeo, swMat);
    sw.rotation.x = -Math.PI / 2;
    sw.position.set(x, 0.01, 0);
    scene.add(sw);
  });

  const starGeo = new THREE.BufferGeometry();
  const starVerts = [];
  for (let i = 0; i < 600; i++) starVerts.push((Math.random() - 0.5) * 200, 30 + Math.random() * 50, (Math.random() - 0.5) * 200);
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
  const starMat = new THREE.PointsMaterial({ color:0x445566, size:0.15 });
  scene.add(new THREE.Points(starGeo, starMat));

  const playerBox = new THREE.Box3();
  const playerHalfSize = new THREE.Vector3(0.3, 0.9, 0.3);
  let stamina = 100;
  const staminaBarEl = document.getElementById('stamina-bar');
  let isDashing = false;

  let joystickActive = false;
  let joystickOrigin = { x:0, y:0 };
  let joystickDelta = { x:0, y:0 };
  let joystickTouchId = null;
  let lookPrevPos = { x:0, y:0 };
  let lookTouchId = null;
  let dashTouchId = null;

  const joystickZone = document.getElementById('joystick-zone');
  const joystickBase = document.getElementById('joystick-base');
  const joystickThumb = document.getElementById('joystick-thumb');
  const dashBtn = document.getElementById('dash-btn');
  const JOYSTICK_RADIUS = 40;
  const WALK_SPEED = 0.045;
  const DASH_SPEED = 0.09;
  let yaw = 0;
  let pitch = 0;

  joystickZone.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (joystickTouchId === null) {
      const t = e.changedTouches[0];
      joystickTouchId = t.identifier;
      const r = joystickBase.getBoundingClientRect();
      joystickOrigin = { x: r.left + r.width / 2, y: r.top + r.height / 2 };
      joystickActive = true;
    }
  }, { passive:false });

  document.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joystickTouchId) {
        let dx = t.clientX - joystickOrigin.x;
        let dy = t.clientY - joystickOrigin.y;
        const len = Math.sqrt(dx*dx + dy*dy);
        if (len > JOYSTICK_RADIUS) { dx *= JOYSTICK_RADIUS / len; dy *= JOYSTICK_RADIUS / len; }
        joystickDelta = { x: dx / JOYSTICK_RADIUS, y: dy / JOYSTICK_RADIUS };
        joystickThumb.style.left = (65 + dx) + 'px';
        joystickThumb.style.top = (65 + dy) + 'px';
        joystickThumb.style.transform = '';
      }
      if (t.identifier === lookTouchId) {
        const dx = t.clientX - lookPrevPos.x;
        const dy = t.clientY - lookPrevPos.y;
        yaw -= dx * 0.003;
        pitch -= dy * 0.003;
        pitch = Math.max(-0.6, Math.min(0.6, pitch));
        lookPrevPos = { x: t.clientX, y: t.clientY };
      }
    }
  }, { passive:false });

  document.addEventListener('touchend', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === joystickTouchId) {
        joystickTouchId = null;
        joystickActive = false;
        joystickDelta = { x:0, y:0 };
        joystickThumb.style.left = '';
        joystickThumb.style.top = '';
        joystickThumb.style.transform = 'translate(-50%,-50%)';
      }
      if (t.identifier === lookTouchId) lookTouchId = null;
      if (t.identifier === dashTouchId) {
        dashTouchId = null;
        isDashing = false;
        dashBtn.classList.remove('active');
      }
    }
  }, { passive:false });

  document.addEventListener('touchstart', (e) => {
    for (const t of e.changedTouches) {
      const inJoyZone = joystickZone.contains(e.target);
      const inDash = dashBtn.contains(e.target);
      const inStory = storyPanel.contains(e.target);
      if (inStory) return;
      if (inDash) {
        if (dashTouchId === null) {
          dashTouchId = t.identifier;
          isDashing = true;
          dashBtn.classList.add('active');
        }
        continue;
      }
      if (!inJoyZone && lookTouchId === null) {
        lookTouchId = t.identifier;
        lookPrevPos = { x: t.clientX, y: t.clientY };
        checkPhoneInteraction();
      }
    }
  }, { passive:false });

  let mouseDown = false;
  let lastMousePos = { x:0, y:0 };
  canvas.addEventListener('mousedown', (e) => { mouseDown = true; lastMousePos = { x:e.clientX, y:e.clientY }; checkPhoneInteraction(); });
  canvas.addEventListener('mousemove', (e) => {
    if (mouseDown) {
      yaw -= (e.clientX - lastMousePos.x) * 0.003;
      pitch -= (e.clientY - lastMousePos.y) * 0.003;
      pitch = Math.max(-0.6, Math.min(0.6, pitch));
      lastMousePos = { x:e.clientX, y:e.clientY };
    }
  });
  canvas.addEventListener('mouseup', () => { mouseDown = false; });
  document.addEventListener('keydown', (e) => { if (e.key === 'Shift') isDashing = true; });
  document.addEventListener('keyup', (e) => { if (e.key === 'Shift') isDashing = false; });

  const keys = {};
  document.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
  document.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

  const interactPrompt = document.getElementById('interact-prompt');
  const collisionBoxes = [];
  let phoneMesh = null;
  let phoneGlow = null;
  let targetPin = null;
  let targetPinGlow = null;
  const phoneInteractDist = 3.5;
  const phoneHouseIndex = 3;
  const houseSpacing = 9;
  const numHouses = 18;
  const HOUSE_TARGET_HEIGHT = 5.0;
  const LAMP_TARGET_HEIGHT = 5.5;

  function buildPhone() {
    const phoneGeo = new THREE.BoxGeometry(0.12, 0.24, 0.015);
    const phoneMat = new THREE.MeshLambertMaterial({ color:0xff1111, emissive:0x880000, emissiveIntensity:0.5 });
    phoneMesh = new THREE.Mesh(phoneGeo, phoneMat);
    phoneMesh.position.set(-10.7, 0.85, -80 + phoneHouseIndex * houseSpacing + 0.4);
    phoneMesh.rotation.z = 0.15;
    scene.add(phoneMesh);
    phoneGlow = new THREE.PointLight(0xff2222, 0.8, 3);
    phoneGlow.position.copy(phoneMesh.position);
    scene.add(phoneGlow);
  }

  function buildTargetPin(x, z, y) {
    if (targetPin) scene.remove(targetPin);
    if (targetPinGlow) scene.remove(targetPinGlow);
    targetPin = new THREE.Group();
    const pinMat = new THREE.MeshBasicMaterial({ color:0xffdd33 });
    const shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 1.8, 10), pinMat);
    shaft.position.y = 1.1;
    targetPin.add(shaft);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 14), pinMat);
    head.position.y = 2.15;
    targetPin.add(head);
    const tip = new THREE.Mesh(new THREE.ConeGeometry(0.28, 0.85, 12), pinMat);
    tip.position.y = 0.35;
    tip.rotation.x = Math.PI;
    targetPin.add(tip);
    targetPin.position.set(x, y, z);
    scene.add(targetPin);
    targetPinGlow = new THREE.PointLight(0xffdd55, 3.0, 18, 1);
    targetPinGlow.position.set(x, y + 1.2, z);
    scene.add(targetPinGlow);
  }

  function placeHouse(modelTemplate, x, z, side) {
    const obj = clonePreparedModel(modelTemplate);
    obj.position.set(x, 0, z);
    obj.rotation.y = (side === 'left') ? Math.PI / 2 : -Math.PI / 2;
    groundToSurface(obj);
    scene.add(obj);
    collisionBoxes.push(new THREE.Box3().setFromObject(obj));
  }
  function placeLamp(modelTemplate, x, z) {
    const obj = clonePreparedModel(modelTemplate);
    obj.position.set(x, 0, z);
    groundToSurface(obj);
    scene.add(obj);
  }
  function placeFallbackHouseAt(x, z, side) {
    const obj = makeFallbackHouse();
    obj.position.set(x, 0, z);
    obj.rotation.y = (side === 'left') ? Math.PI / 2 : -Math.PI / 2;
    groundToSurface(obj);
    scene.add(obj);
    collisionBoxes.push(new THREE.Box3().setFromObject(obj));
  }
  function placeFallbackLampAt(x, z) {
    const obj = makeFallbackLamp();
    obj.position.set(x, 0, z);
    groundToSurface(obj);
    scene.add(obj);
  }

  async function buildWorld() {
    loadingEl.classList.add('active');
    const houseResult = await loadGLTF('./ie.glb').then(gltf => ({ ok:true, scene: normalizeModel(gltf.scene, HOUSE_TARGET_HEIGHT) }), err => ({ ok:false, err }));
    const lampResult = await loadGLTF('./gaitou.glb').then(gltf => ({ ok:true, scene: normalizeModel(gltf.scene, LAMP_TARGET_HEIGHT) }), err => ({ ok:false, err }));
    const houseTemplate = houseResult.ok ? houseResult.scene : null;
    const lampTemplate = lampResult.ok ? lampResult.scene : null;

    for (let i = 0; i < numHouses; i++) {
      const z = -80 + i * houseSpacing;
      if (houseTemplate) { placeHouse(houseTemplate, -10, z, 'left'); placeHouse(houseTemplate, 10, z, 'right'); }
      else { placeFallbackHouseAt(-10, z, 'left'); placeFallbackHouseAt(10, z, 'right'); }

      if (i % 2 === 0) {
        if (lampTemplate) { placeLamp(lampTemplate, -5.5, z); placeLamp(lampTemplate, 5.5, z); }
        else { placeFallbackLampAt(-5.5, z); placeFallbackLampAt(5.5, z); }
      }
    }

    const targetZ = -80 + phoneHouseIndex * houseSpacing;
    buildTargetPin(-10, targetZ, HOUSE_TARGET_HEIGHT + 1.0);
    buildPhone();
    loadingEl.classList.remove('active');
  }
  const buildPromise = buildWorld();

  function checkPhoneInteraction() {
    if (!phoneMesh || phonePickedUp || storyActive) return;
    const dist = camera.position.distanceTo(phoneMesh.position);
    if (dist <= phoneInteractDist + 1.0) openStory();
  }

  window.addEventListener('resize', () => {
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
  });

  const clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const dt = clock.getDelta();
    const elapsed = clock.getElapsedTime();

    flickerTimer += dt;
    if (flickerTimer > 0.1) {
      flickerTimer = 0;
      if (Math.random() < 0.04) ptLight.intensity = 0.2 + Math.random() * 0.3;
      else ptLight.intensity = 1.4 + Math.sin(elapsed * 1.5) * 0.1;
    }

    if (phoneGlow && phoneMesh && !phonePickedUp) {
      phoneGlow.intensity = 0.6 + Math.sin(elapsed * 2.5) * 0.3;
      phoneMesh.rotation.y = elapsed * 0.5;
      phoneGlow.position.copy(phoneMesh.position);
    } else if (phoneMesh && phonePickedUp) {
      phoneMesh.visible = false;
      phoneGlow.visible = false;
    }

    if (!lockMovement && !storyActive) {
      const speed = (isDashing && stamina > 0) ? DASH_SPEED : WALK_SPEED;
      if (isDashing && (joystickActive || keys['w'] || keys['arrowup'])) stamina = Math.max(0, stamina - 35 * dt);
      else stamina = Math.min(100, stamina + 18 * dt);
      staminaBarEl.style.width = stamina + '%';

      let moveX = joystickDelta.x;
      let moveZ = joystickDelta.y;
      if (keys['w'] || keys['arrowup']) moveZ = -1;
      if (keys['s'] || keys['arrowdown']) moveZ = 1;
      if (keys['a'] || keys['arrowleft']) moveX = -1;
      if (keys['d'] || keys['arrowright']) moveX = 1;

      const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
      const worldX = (cosY * moveX - sinY * moveZ) * speed;
      const worldZ = (sinY * moveX + cosY * moveZ) * speed;

      const tryX = camera.position.clone(); tryX.x += worldX;
      playerBox.setFromCenterAndSize(new THREE.Vector3(tryX.x, tryX.y - 0.75, tryX.z), playerHalfSize.clone().multiplyScalar(2));
      let blockedX = false;
      for (const bb of collisionBoxes) { if (playerBox.intersectsBox(bb)) { blockedX = true; break; } }
      if (!blockedX) camera.position.x = tryX.x;

      const tryZ = camera.position.clone(); tryZ.z += worldZ;
      playerBox.setFromCenterAndSize(new THREE.Vector3(tryZ.x, tryZ.y - 0.75, tryZ.z), playerHalfSize.clone().multiplyScalar(2));
      let blockedZ = false;
      for (const bb of collisionBoxes) { if (playerBox.intersectsBox(bb)) { blockedZ = true; break; } }
      if (!blockedZ) camera.position.z = tryZ.z;

      camera.position.x = Math.max(-60, Math.min(60, camera.position.x));
      camera.position.z = Math.max(-100, Math.min(30, camera.position.z));
      camera.position.y = 1.65;
    }

    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    flashlight.target.position.set(0, 0.6, -12);
    if (targetPin) {
      targetPin.position.y = (HOUSE_TARGET_HEIGHT + 1.2) + Math.sin(elapsed * 2) * 0.12;
      targetPin.rotation.y = elapsed * 0.6;
      if (targetPinGlow) targetPinGlow.intensity = 2.0 + Math.sin(elapsed * 3.5) * 0.6;
    }

    if (!phonePickedUp && !storyActive && phoneMesh) {
      const dist = camera.position.distanceTo(phoneMesh.position);
      interactPrompt.style.display = (dist <= phoneInteractDist) ? 'block' : 'none';
    } else {
      interactPrompt.style.display = 'none';
    }

    renderer.render(scene, camera);
  }
  animate();
}
</script>
</body>
</html>
