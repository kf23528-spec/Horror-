<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>3D FPS Horror Village Base</title>
  <style>
    :root {
      --ui-text: rgba(255, 255, 255, 0.96);
      --panel: rgba(0, 0, 0, 0.34);
      --panel-border: rgba(255, 255, 255, 0.12);
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Yu Gothic", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      overflow: hidden;
      touch-action: none;
      background: #000;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      touch-action: none;
    }

    #candleUI {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 16px;
      border-radius: 16px;
      font-size: clamp(18px, 2.4vw, 28px);
      font-weight: 700;
      letter-spacing: 0.03em;
      color: var(--ui-text);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(6px);
    }

    #joystickBase {
      position: absolute;
      left: max(20px, env(safe-area-inset-left));
      bottom: max(22px, env(safe-area-inset-bottom));
      width: min(28vw, 150px);
      height: min(28vw, 150px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(255, 255, 255, 0.14);
      box-shadow: inset 0 0 22px rgba(255,255,255,0.06);
      backdrop-filter: blur(4px);
    }

    #joystickKnob {
      position: absolute;
      left: calc(max(20px, env(safe-area-inset-left)) + (min(28vw, 150px) / 2) - min(13vw, 64px));
      bottom: calc(max(22px, env(safe-area-inset-bottom)) + (min(28vw, 150px) / 2) - min(13vw, 64px));
      width: min(13vw, 64px);
      height: min(13vw, 64px);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.17);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 0 20px rgba(255,255,255,0.08);
      transform: translate(0, 0);
      transition: transform 0.04s linear;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      opacity: 0.38;
    }

    #crosshair::before, #crosshair::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: rgba(255,255,255,0.85);
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px rgba(255,255,255,0.45);
    }

    #crosshair::before { width: 10px; height: 1px; }
    #crosshair::after  { width: 1px; height: 10px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div id="candleUI">蝋燭の残り火：100%</div>
    <div id="crosshair"></div>
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    import { GLTFLoader } from 'https://unpkg.com/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';

    const app = document.getElementById('app');
    const candleUI = document.getElementById('candleUI');
    const joystickBase = document.getElementById('joystickBase');
    const joystickKnob = document.getElementById('joystickKnob');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 10, 72);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 260);
    camera.position.set(0, 1.65, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.95;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    app.appendChild(renderer.domElement);

    // ===== Lighting =====
    const ambient = new THREE.AmbientLight(0x1b1b1b, 0.18);
    scene.add(ambient);

    const moon = new THREE.DirectionalLight(0x404060, 0.18);
    moon.position.set(-10, 30, 10);
    moon.castShadow = true;
    moon.shadow.mapSize.set(1024, 1024);
    moon.shadow.camera.near = 1;
    moon.shadow.camera.far = 100;
    moon.shadow.camera.left = -35;
    moon.shadow.camera.right = 35;
    moon.shadow.camera.top = 35;
    moon.shadow.camera.bottom = -35;
    scene.add(moon);

    const candleLight = new THREE.SpotLight(0xffe2b0, 55, 48, Math.PI / 7, 0.55, 1.15);
    candleLight.castShadow = true;
    candleLight.shadow.mapSize.set(1024, 1024);
    candleLight.shadow.camera.near = 0.5;
    candleLight.shadow.camera.far = 40;
    candleLight.position.set(0, 1.65, 8);
    candleLight.target.position.set(0, 1.5, 0);
    scene.add(candleLight);
    scene.add(candleLight.target);

    // ===== Ground =====
    const worldSize = 220;
    const floorGeo = new THREE.PlaneGeometry(worldSize, worldSize, 1, 1);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 1.0, metalness: 0.0 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.receiveShadow = true;
    scene.add(floor);

    // ===== Road network =====
    const roadGroup = new THREE.Group();
    scene.add(roadGroup);

    const roadColor = 0x4a4a4a;
    const roadMat = new THREE.MeshStandardMaterial({ color: roadColor, roughness: 1.0, metalness: 0.0 });
    const roadMat2 = new THREE.MeshStandardMaterial({ color: 0x515151, roughness: 1.0, metalness: 0.0 });

    function addRoadSegment(x, z, w, d, mat = roadMat) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, d), mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(x, 0.015, z);
      mesh.receiveShadow = true;
      roadGroup.add(mesh);
    }

    // Main cross roads and a loose village grid.
    const roadWidth = 7.2;
    const grid = 18;
    const half = worldSize / 2 - 10;

    // Central cross
    addRoadSegment(0, 0, worldSize - 20, roadWidth, roadMat2);
    addRoadSegment(0, 0, roadWidth, worldSize - 20, roadMat2);

    // Secondary roads, slightly irregular so it feels like an old village.
    for (let i = -3; i <= 3; i++) {
      const offset = i * grid;
      if (Math.abs(offset) < 1) continue;
      addRoadSegment(offset, THREE.MathUtils.randFloatSpread(2), worldSize - 28, 4.6, i % 2 ? roadMat : roadMat2);
      addRoadSegment(THREE.MathUtils.randFloatSpread(2), offset, 4.6, worldSize - 28, i % 2 ? roadMat : roadMat2);
    }

    // A rough ring road around the center.
    const ringPositions = [
      { x: 0, z: 34, w: 52, d: 4.8 },
      { x: 0, z: -34, w: 52, d: 4.8 },
      { x: 34, z: 0, w: 4.8, d: 52 },
      { x: -34, z: 0, w: 4.8, d: 52 },
    ];
    ringPositions.forEach(p => addRoadSegment(p.x, p.z, p.w, p.d, roadMat));

    function isOnRoad(x, z) {
      const central = Math.abs(x) < roadWidth * 0.5 + 1.7 || Math.abs(z) < roadWidth * 0.5 + 1.7;
      const gridRoad = Array.from({ length: 7 }, (_, idx) => (idx - 3) * grid)
        .some(v => Math.abs(x - v) < 2.6 || Math.abs(z - v) < 2.6);
      const ring = (Math.abs(Math.abs(x) - 34) < 3.1 && Math.abs(z) < 26) || (Math.abs(Math.abs(z) - 34) < 3.1 && Math.abs(x) < 26);
      return central || gridRoad || ring;
    }

    // ===== Houses from ie.glb =====
    const loader = new GLTFLoader();
    const houses = [];
    const houseColliders = [];
    const houseGroup = new THREE.Group();
    scene.add(houseGroup);

    const spawnSafeZone = { x: 0, z: 0, r: 16 };

    function rand(min, max) {
      return min + Math.random() * (max - min);
    }

    function farFromSpawn(x, z) {
      const dx = x - spawnSafeZone.x;
      const dz = z - spawnSafeZone.z;
      return Math.hypot(dx, dz) > spawnSafeZone.r;
    }

    function makeFallbackHouse() {
      const g = new THREE.Group();
      const base = new THREE.Mesh(
        new THREE.BoxGeometry(2.6, 1.7, 2.6),
        new THREE.MeshStandardMaterial({ color: 0x7a6f63, roughness: 1, metalness: 0 })
      );
      base.position.y = 0.85;
      base.castShadow = true;
      base.receiveShadow = true;
      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(2.0, 1.3, 4),
        new THREE.MeshStandardMaterial({ color: 0x3b2f2a, roughness: 1, metalness: 0 })
      );
      roof.position.y = 2.15;
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      g.add(base, roof);
      return g;
    }

    function computeHouseCollider(object3d, scaleValue) {
      const box = new THREE.Box3().setFromObject(object3d);
      const size = new THREE.Vector3();
      box.getSize(size);
      const center = new THREE.Vector3();
      box.getCenter(center);
      const radius = Math.max(size.x, size.z) * 0.44;
      return {
        center,
        radius,
        height: Math.max(2.5, size.y * 0.9),
        scaleValue
      };
    }

    function placeHousePrototype(proto, x, z, rotY, scaleValue) {
      const house = proto.clone(true);
      house.position.set(x, 0, z);
      house.rotation.y = rotY;
      house.scale.setScalar(scaleValue);
      house.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = true;
          o.receiveShadow = true;
        }
      });
      houseGroup.add(house);
      const collider = computeHouseCollider(house, scaleValue);
      const colliderWorld = {
        x,
        z,
        rotY,
        radius: Math.max(1.5, collider.radius),
        height: collider.height * scaleValue
      };
      houses.push(house);
      houseColliders.push(colliderWorld);
    }

    function chooseHouseSpawnPoints(count) {
      const points = [];
      const bands = [8, 12, 16, 22, 28, 36, 44, 52, 62, 72];
      const preferredXs = [-60, -42, -24, 24, 42, 60];
      const preferredZs = [-60, -42, -24, 24, 42, 60];

      while (points.length < count) {
        let x = 0;
        let z = 0;
        const chooseHorizontal = Math.random() > 0.5;
        const lane = bands[Math.floor(Math.random() * bands.length)];
        const offset = rand(-2.5, 2.5);

        if (chooseHorizontal) {
          x = preferredXs[Math.floor(Math.random() * preferredXs.length)] + offset;
          z = lane * (Math.random() > 0.5 ? 1 : -1);
        } else {
          x = lane * (Math.random() > 0.5 ? 1 : -1);
          z = preferredZs[Math.floor(Math.random() * preferredZs.length)] + offset;
        }

        x += rand(-2.2, 2.2);
        z += rand(-2.2, 2.2);

        if (Math.abs(x) > half || Math.abs(z) > half) continue;
        if (!farFromSpawn(x, z)) continue;
        if (isOnRoad(x, z) && Math.random() < 0.65) continue;
        points.push({ x, z });
      }
      return points;
    }

    const houseCount = 42;
    const spawnPoints = chooseHouseSpawnPoints(houseCount);

    loader.load(
      './ie.glb',
      (gltf) => {
        const proto = gltf.scene || gltf.scenes[0];
        proto.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;
            if (o.material && o.material.color) {
              o.material = o.material.clone();
            }
          }
        });

        for (let i = 0; i < spawnPoints.length; i++) {
          const p = spawnPoints[i];
          const rotY = rand(0, Math.PI * 2);
          const scaleValue = rand(0.9, 1.35);
          placeHousePrototype(proto, p.x, p.z, rotY, scaleValue);
        }
      },
      undefined,
      () => {
        // Fallback if ie.glb is missing in the same folder.
        const fallback = makeFallbackHouse();
        for (let i = 0; i < spawnPoints.length; i++) {
          const p = spawnPoints[i];
          const clone = fallback.clone(true);
          clone.position.set(p.x, 0, p.z);
          clone.rotation.y = rand(0, Math.PI * 2);
          clone.scale.setScalar(rand(0.9, 1.35));
          clone.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
            }
          });
          houseGroup.add(clone);
          houseColliders.push({ x: p.x, z: p.z, rotY: clone.rotation.y, radius: 2.1 * clone.scale.x, height: 3.5 * clone.scale.x });
        }
      }
    );

    // ===== Extra village clutter to strengthen the atmosphere =====
    const clutterGroup = new THREE.Group();
    scene.add(clutterGroup);

    function addDeadTree(x, z, h = 3.5) {
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15, 0.22, h, 5),
        new THREE.MeshStandardMaterial({ color: 0x2b1f1a, roughness: 1 })
      );
      trunk.position.set(x, h / 2, z);
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      clutterGroup.add(trunk);
      const top = new THREE.Mesh(
        new THREE.SphereGeometry(0.45, 5, 4),
        new THREE.MeshStandardMaterial({ color: 0x1c1c1c, roughness: 1 })
      );
      top.position.set(x, h, z);
      top.scale.set(1.8, 0.7, 1.4);
      top.castShadow = true;
      clutterGroup.add(top);
    }

    for (let i = 0; i < 18; i++) {
      const x = rand(-82, 82);
      const z = rand(-82, 82);
      if (farFromSpawn(x, z) && !isOnRoad(x, z)) addDeadTree(x, z, rand(2.8, 5.1));
    }

    // ===== Player / movement =====
    let yaw = 0;
    let pitch = 0;
    const pitchLimit = THREE.MathUtils.degToRad(82);
    const keys = { forward: 0, backward: 0, left: 0, right: 0 };
    const moveVelocity = new THREE.Vector3();
    const tmpForward = new THREE.Vector3();
    const tmpRight = new THREE.Vector3();
    const upVec = new THREE.Vector3(0, 1, 0);

    // ===== Touch controls =====
    let joystickPointerId = null;
    let joystickStart = { x: 0, y: 0 };
    let joystickRadius = 72;

    let lookPointerId = null;
    let lastLook = { x: 0, y: 0 };
    const lookSensitivity = 0.0042;

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
    function isLeftSide(x) { return x <= window.innerWidth * 0.5; }

    function updateJoystickVisual(dx, dy) {
      joystickKnob.style.transform = `translate(${clamp(dx, -joystickRadius, joystickRadius)}px, ${clamp(dy, -joystickRadius, joystickRadius)}px)`;
    }
    function resetJoystickVisual() { joystickKnob.style.transform = 'translate(0px, 0px)'; }

    function inJoystickArea(x, y) {
      const rect = joystickBase.getBoundingClientRect();
      const pad = 28;
      return x >= rect.left - pad && x <= rect.right + pad && y >= rect.top - pad && y <= rect.bottom + pad;
    }

    function onPointerDown(e) {
      e.preventDefault();
      const x = e.clientX, y = e.clientY;
      if ((e.pointerType === 'touch' || e.pointerType === 'pen' || e.pointerType === 'mouse')) {
        if (isLeftSide(x) && joystickPointerId === null && inJoystickArea(x, y)) {
          joystickPointerId = e.pointerId;
          joystickStart.x = x; joystickStart.y = y;
          updateJoystickVisual(0, 0);
          try { e.target.setPointerCapture(e.pointerId); } catch {}
          return;
        }
        if (!isLeftSide(x) && lookPointerId === null) {
          lookPointerId = e.pointerId;
          lastLook.x = x; lastLook.y = y;
          try { e.target.setPointerCapture(e.pointerId); } catch {}
          return;
        }
      }
    }

    function onPointerMove(e) {
      if (e.pointerId === joystickPointerId) {
        e.preventDefault();
        const dx = e.clientX - joystickStart.x;
        const dy = e.clientY - joystickStart.y;
        updateJoystickVisual(dx, dy);
        const len = Math.hypot(dx, dy);
        const norm = len > 0 ? Math.min(len / joystickRadius, 1) : 0;
        const angle = Math.atan2(dy, dx);
        const fx = Math.cos(angle) * norm;
        const fy = Math.sin(angle) * norm;
        keys.forward = clamp(-fy, 0, 1);
        keys.backward = clamp(fy, 0, 1);
        keys.left = clamp(-fx, 0, 1);
        keys.right = clamp(fx, 0, 1);
        return;
      }
      if (e.pointerId === lookPointerId) {
        e.preventDefault();
        const dx = e.clientX - lastLook.x;
        const dy = e.clientY - lastLook.y;
        lastLook.x = e.clientX;
        lastLook.y = e.clientY;
        yaw -= dx * lookSensitivity;
        pitch -= dy * lookSensitivity;
        pitch = clamp(pitch, -pitchLimit, pitchLimit);
      }
    }

    function onPointerUp(e) {
      if (e.pointerId === joystickPointerId) {
        joystickPointerId = null;
        keys.forward = 0; keys.backward = 0; keys.left = 0; keys.right = 0;
        resetJoystickVisual();
      }
      if (e.pointerId === lookPointerId) lookPointerId = null;
    }

    renderer.domElement.addEventListener('pointerdown', onPointerDown, { passive: false });
    renderer.domElement.addEventListener('pointermove', onPointerMove, { passive: false });
    renderer.domElement.addEventListener('pointerup', onPointerUp, { passive: false });
    renderer.domElement.addEventListener('pointercancel', onPointerUp, { passive: false });
    renderer.domElement.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gesturechange', (e) => e.preventDefault(), { passive: false });
    document.addEventListener('gestureend', (e) => e.preventDefault(), { passive: false });

    // ===== Collision =====
    const playerRadius = 0.42;
    const playerHeight = 1.65;
    const housePadding = 0.7;

    function resolveHouseCollisions(nextPos) {
      for (const h of houseColliders) {
        const dx = nextPos.x - h.x;
        const dz = nextPos.z - h.z;
        const dist = Math.hypot(dx, dz);
        const minDist = h.radius + playerRadius + housePadding;
        if (dist < minDist) {
          const push = (minDist - dist) + 0.001;
          const nx = dist > 0.0001 ? dx / dist : 1;
          const nz = dist > 0.0001 ? dz / dist : 0;
          nextPos.x += nx * push;
          nextPos.z += nz * push;
        }
      }
    }

    function keepInBounds(nextPos) {
      const limit = worldSize * 0.5 - 3.0;
      nextPos.x = clamp(nextPos.x, -limit, limit);
      nextPos.z = clamp(nextPos.z, -limit, limit);
    }

    // ===== Resize =====
    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      joystickRadius = Math.max(52, Math.min(78, Math.min(window.innerWidth, window.innerHeight) * 0.09));
      const baseSize = Math.min(window.innerWidth, window.innerHeight) * 0.28;
      joystickBase.style.width = `${Math.min(baseSize, 150)}px`;
      joystickBase.style.height = `${Math.min(baseSize, 150)}px`;
      const knobSize = Math.min(window.innerWidth, window.innerHeight) * 0.13;
      joystickKnob.style.width = `${Math.min(knobSize, 64)}px`;
      joystickKnob.style.height = `${Math.min(knobSize, 64)}px`;
      const basePx = Math.min(baseSize, 150);
      const knobPx = Math.min(knobSize, 64);
      joystickKnob.style.left = `calc(max(20px, env(safe-area-inset-left)) + (${basePx}px / 2) - ${knobPx}px / 2)`;
      joystickKnob.style.bottom = `calc(max(22px, env(safe-area-inset-bottom)) + (${basePx}px / 2) - ${knobPx}px / 2)`;
    }
    window.addEventListener('resize', onResize);
    onResize();

    // ===== Game loop =====
    const clock = new THREE.Clock();
    let flickerNoise = 0;
    let candlePercent = 100;
    const candleDrainPerSecond = 0.025;

    function animate() {
      const dt = Math.min(clock.getDelta(), 0.033);

      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      camera.getWorldDirection(tmpForward);
      tmpForward.y = 0;
      tmpForward.normalize();
      tmpRight.crossVectors(tmpForward, upVec).normalize().multiplyScalar(-1);

      moveVelocity.set(0, 0, 0);
      moveVelocity.addScaledVector(tmpForward, keys.backward - keys.forward);
      moveVelocity.addScaledVector(tmpRight, keys.right - keys.left);
      if (moveVelocity.length() > 0) moveVelocity.normalize();

      const nextPos = camera.position.clone();
      nextPos.addScaledVector(moveVelocity, 3.15 * dt);
      nextPos.y = playerHeight;
      keepInBounds(nextPos);
      resolveHouseCollisions(nextPos);
      camera.position.copy(nextPos);

      // camera-linked candle light
      const forward = new THREE.Vector3(0, 0, -1).applyEuler(camera.rotation).normalize();
      candleLight.position.copy(camera.position);
      candleLight.target.position.copy(camera.position).add(forward.multiplyScalar(12));
      candleLight.target.updateMatrixWorld();

      // flicker
      flickerNoise = flickerNoise * 0.82 + (Math.random() - 0.5) * 0.30;
      candleLight.intensity = 55 * (1 + flickerNoise * 0.12);

      candlePercent = Math.max(0, candlePercent - candleDrainPerSecond * dt);
      candleUI.textContent = `蝋燭の残り火：${Math.round(candlePercent)}%`;

      // subtle world motion / atmosphere
      houseGroup.rotation.y += dt * 0.0004;
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    // Spawn facing the center road; the red cube from the previous base is retained as a simple test marker.
    const testCube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0xaa1111, roughness: 0.65, metalness: 0.05, emissive: 0x240000, emissiveIntensity: 0.42 })
    );
    testCube.position.set(0, 0.5, -10);
    testCube.castShadow = true;
    testCube.receiveShadow = true;
    scene.add(testCube);

    camera.lookAt(testCube.position);
    animate();
  </script>
</body>
</html>
