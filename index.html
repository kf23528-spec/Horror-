<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>忌夜ノ村 - 第1章：静寂の廃村</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  overflow:hidden; background:#050507;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#gameCanvas { display:block; width:100%; height:100%; touch-action:none; }

/* =====================================================
   導入プロローグ画面（★修正1：新設）
===================================================== */
#prologueScreen {
  position:fixed; inset:0; z-index:200;
  background:#000;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:32px 28px;
  pointer-events:auto;
  transition:opacity 1.2s ease;
}
#prologueScreen.fadeout {
  opacity:0;
  pointer-events:none;
}
#prologueScreen.gone {
  display:none;
}

/* 血文字のタイトルロゴ */
#prologueLogo {
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:clamp(28px,7vw,52px);
  color:#c80000;
  letter-spacing:0.18em;
  text-align:center;
  line-height:1.3;
  margin-bottom:28px;
  text-shadow:
    0 0 14px rgba(200,0,0,0.9),
    0 0 36px rgba(160,0,0,0.6),
    0 0 60px rgba(100,0,0,0.35),
    2px 2px 0 #1a0000,
    -2px -2px 0 #1a0000;
  animation:bloodPulse 2.8s ease-in-out infinite;
}
@keyframes bloodPulse {
  0%,100% { filter:brightness(1.0) drop-shadow(0 0 10px rgba(200,0,0,0.5)); }
  50%      { filter:brightness(1.18) drop-shadow(0 0 22px rgba(255,0,0,0.8)); }
}

/* 縦線区切り */
#prologueDivider {
  width:1px; height:36px;
  background:linear-gradient(to bottom, transparent, #600000, transparent);
  margin-bottom:24px;
}

/* 本文 */
#prologueBody {
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:clamp(13px,2.8vw,17px);
  color:#d4c0b0;
  line-height:2.0;
  letter-spacing:0.07em;
  text-align:left;
  max-width:600px; width:100%;
  text-shadow:0 1px 8px rgba(0,0,0,0.95);
  margin-bottom:28px;
}
#prologueBody .red { color:#e83030; font-weight:700; }
#prologueBody .dim { color:#886655; }

/* 操作説明 */
#prologueControls {
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:clamp(11px,2.3vw,14px);
  color:#886040;
  line-height:1.9;
  letter-spacing:0.06em;
  text-align:left;
  max-width:600px; width:100%;
  border-left:2px solid #4a2010;
  padding-left:14px;
  margin-bottom:32px;
}

/* タップ促進テキスト */
#prologueTapHint {
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:clamp(13px,2.6vw,16px);
  color:#cc3333;
  letter-spacing:0.18em;
  text-align:center;
  animation:blinkRed 1.1s step-end infinite;
}
@keyframes blinkRed { 0%,100%{opacity:1.0;} 50%{opacity:0.28;} }

/* 血のにじみ風アンビエント */
#prologueScreen::before {
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 70% 40% at 20% 10%, rgba(80,0,0,0.25) 0%, transparent 70%),
    radial-gradient(ellipse 50% 60% at 80% 90%, rgba(60,0,0,0.20) 0%, transparent 70%);
  pointer-events:none;
}

/* =====================================================
   ゲーム本体UI（プロローグ消えるまで隠す）
===================================================== */
#gameUI {
  opacity:0;
  transition:opacity 1.0s ease;
  pointer-events:none;
}
#gameUI.visible {
  opacity:1;
  pointer-events:auto;
}

/* =====================================================
   以下は既存のUI（変更なし）
===================================================== */
#vignette {
  position:fixed; inset:0;
  background:radial-gradient(ellipse at center,transparent 24%,rgba(0,0,0,0.68) 100%);
  pointer-events:none; z-index:5;
}
#darknessOverlay {
  position:fixed; inset:0; background:rgba(0,0,0,0);
  pointer-events:none; z-index:8; transition:background 1.2s ease;
}
#dangerVeil {
  position:fixed; inset:0; background:rgba(180,0,0,0);
  pointer-events:none; z-index:9; transition:background 0.25s ease;
}

/* 蝋燭UI */
#candleUI {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  font-family:'Georgia','Hiragino Mincho ProN',serif;
  font-size:20px; color:#ffe18b; letter-spacing:2px; white-space:nowrap;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 14px rgba(255,180,0,0.8);
  z-index:20; pointer-events:none;
}
#candleBar {
  position:fixed; top:48px; left:50%; transform:translateX(-50%);
  width:200px; height:7px; background:rgba(0,0,0,0.42);
  border:1px solid rgba(255,190,110,0.45); border-radius:4px;
  z-index:20; pointer-events:none; overflow:hidden;
}
#candleBarFill {
  height:100%; width:100%;
  background:linear-gradient(90deg,#ff6a00,#ffd65a);
  border-radius:4px; transition:width 0.35s ease;
  box-shadow:0 0 6px rgba(255,180,0,0.7);
}

/* スタミナUI */
#staminaUI {
  position:fixed; top:64px; left:50%; transform:translateX(-50%);
  font-family:'Georgia','Hiragino Mincho ProN',serif;
  font-size:16px; color:#a0e8ff; letter-spacing:2px; white-space:nowrap;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 10px rgba(80,200,255,0.7);
  z-index:20; pointer-events:none;
}
#staminaBar {
  position:fixed; top:86px; left:50%; transform:translateX(-50%);
  width:200px; height:6px; background:rgba(0,0,0,0.42);
  border:1px solid rgba(80,200,255,0.35); border-radius:4px;
  z-index:20; pointer-events:none; overflow:hidden;
}
#staminaBarFill {
  height:100%; width:100%;
  background:linear-gradient(90deg,#0077cc,#00e5ff);
  border-radius:4px; transition:width 0.1s ease;
  box-shadow:0 0 5px rgba(0,200,255,0.6);
}

/* チャプター表示 */
#chapterBadge {
  position:fixed; top:20px; left:20px;
  font-family:'Hiragino Mincho ProN','Georgia',serif;
  font-size:13px; color:#998877; letter-spacing:3px;
  text-shadow:0 0 8px #000;
  z-index:20; pointer-events:none;
  opacity:0; animation:fadeInBadge 2s 1s forwards;
}
@keyframes fadeInBadge { to { opacity:1; } }

/* 走るボタン */
#dashBtn {
  position:fixed; bottom:60px; right:60px;
  width:80px; height:80px; border-radius:50%;
  background:rgba(0,160,255,0.22);
  border:2px solid rgba(80,200,255,0.55);
  box-shadow:0 0 14px rgba(0,180,255,0.3);
  z-index:15; pointer-events:auto;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.1s, opacity 0.3s, transform 0.1s;
  touch-action:none;
}
#dashBtn .dashLabel {
  font-family:'Hiragino Mincho ProN',serif;
  font-size:15px; color:#aaeeff;
  text-shadow:0 0 6px #000,0 0 10px #000;
  letter-spacing:1px; pointer-events:none;
  line-height:1.25; text-align:center;
}
#dashBtn.pressing { background:rgba(0,200,255,0.42); box-shadow:0 0 22px rgba(0,220,255,0.65); }
#dashBtn.exhausted { background:rgba(60,60,80,0.3); border-color:rgba(120,120,160,0.3); opacity:0.55; }

/* 警告 */
#alertIndicator {
  position:fixed; top:110px; left:50%; transform:translateX(-50%);
  font-family:'Hiragino Mincho ProN',serif;
  font-size:14px; color:#ff4444; letter-spacing:3px;
  text-shadow:0 0 10px #ff0000, 0 0 4px #000;
  z-index:20; pointer-events:none; display:none; white-space:nowrap;
  animation:alertPulse 0.6s ease-in-out infinite;
}
@keyframes alertPulse { 0%,100%{opacity:0.6;} 50%{opacity:1.0;} }

#statusMsg {
  position:fixed; top:130px; left:50%; transform:translateX(-50%);
  font-family:monospace; font-size:12px; color:#c8ffd0;
  text-shadow:0 0 6px #000,0 0 10px #000;
  z-index:20; pointer-events:none; text-align:center; white-space:pre-wrap;
}
#promptMsg {
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
  font-family:'Hiragino Mincho ProN',serif;
  font-size:18px; color:#ffffff;
  padding:8px 14px; border-radius:999px;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(255,255,255,0.25);
  text-shadow:0 0 8px #000;
  z-index:21; pointer-events:none; display:none;
}

/* 封鎖メッセージ */
#blockMsg {
  position:fixed; bottom:200px; left:50%; transform:translateX(-50%);
  font-family:'Hiragino Mincho ProN',serif;
  font-size:15px; color:#bb9966; letter-spacing:2px;
  padding:6px 14px; border-radius:4px;
  background:rgba(0,0,0,0.5);
  border:1px solid rgba(180,140,80,0.3);
  text-shadow:0 0 8px #000;
  z-index:21; pointer-events:none; display:none;
  animation:fadeMsg 0.4s ease;
}
@keyframes fadeMsg { from{opacity:0;} to{opacity:1;} }

#errorMsg {
  position:fixed; top:148px; left:50%; transform:translateX(-50%);
  font-family:monospace; font-size:11px; color:#ff6666;
  text-shadow:0 0 6px #000;
  z-index:20; pointer-events:none; display:none;
  text-align:center; white-space:pre-wrap;
}

/* ゲームオーバー */
#gameOverScreen {
  position:fixed; inset:0; display:none;
  z-index:100; align-items:center; justify-content:center;
  text-align:center; background:rgba(0,0,0,0.0); pointer-events:none;
}
#gameOverScreen.active {
  display:flex; animation:gameOverFlash 0.55s forwards;
}
@keyframes gameOverFlash {
  0%   { background:rgba(0,0,0,0); }
  14%  { background:rgba(90,0,0,0.86); }
  38%  { background:rgba(130,0,0,0.90); }
  70%  { background:rgba(70,0,0,0.92); }
  100% { background:rgba(0,0,0,0.94); }
}
#gameOverInner {
  display:flex; flex-direction:column; align-items:center; gap:16px;
  animation:gameOverTextIn 0.55s 0.12s both;
}
@keyframes gameOverTextIn { 0%{opacity:0;transform:scale(1.35);} 100%{opacity:1;transform:scale(1.0);} }
#gameOverTitle {
  font-family:'Hiragino Mincho ProN','Georgia',serif;
  font-size:clamp(32px,9vw,64px); color:#ffeaea;
  font-weight:900; letter-spacing:4px; line-height:1.25;
  text-shadow:
    0 0 10px #ff0000,
    0 0 24px #ff0000,
    0 0 46px rgba(255,0,0,0.75),
    3px 3px 0 #220000,
    -3px -3px 0 #220000;
}
#gameOverSub {
  font-family:'Hiragino Mincho ProN','Georgia',serif;
  font-size:clamp(18px,4vw,28px); color:#ff9a9a; letter-spacing:6px;
  text-shadow:0 0 12px rgba(255,0,0,0.8),0 0 4px #000;
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.7;} 50%{opacity:1.0;} }

/* ジョイスティック */
#joystickBase {
  position:fixed; bottom:60px; left:60px;
  width:120px; height:120px; border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,210,140,0.28);
  z-index:15; pointer-events:none; transition:opacity 0.25s;
}
#joystickStick {
  position:fixed; bottom:95px; left:95px;
  width:50px; height:50px; border-radius:50%;
  background:rgba(245,200,66,0.45);
  border:2px solid rgba(245,200,66,0.7);
  box-shadow:0 0 10px rgba(255,180,0,0.42);
  z-index:16; pointer-events:none;
  transition:transform 0.03s, opacity 0.25s;
}

/* ジャンプスケア */
#jumpscareOverlay {
  position:fixed; inset:0; z-index:120; display:none; overflow:hidden;
  background:#000;
  pointer-events:none;
}
#jumpscareOverlay.active { display:block; }
#jumpscareOverlay .bg {
  position:absolute; inset:-8%;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,0,0,0.92) 0%, rgba(120,0,0,0.85) 26%, rgba(20,0,0,0.96) 58%, rgba(0,0,0,1) 100%);
  animation:scareBg 0.12s infinite alternate;
}
@keyframes scareBg {
  from { transform:scale(1.00); filter:brightness(1.0) contrast(1.1); }
  to   { transform:scale(1.03); filter:brightness(1.25) contrast(1.35); }
}
#jumpscareFace {
  position:absolute; left:50%; top:50%;
  width:86vw; height:86vh; transform:translate(-50%,-50%) scale(1.0);
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0 34%, rgba(0,0,0,0.98) 35% 100%);
  clip-path: polygon(15% 10%, 38% 0%, 62% 0%, 85% 10%, 95% 36%, 87% 65%, 67% 92%, 33% 92%, 13% 65%, 5% 36%);
  filter: drop-shadow(0 0 26px rgba(255,0,0,0.9)) drop-shadow(0 0 60px rgba(255,0,0,0.45));
  opacity:0.98;
  animation:faceLunge 0.17s infinite alternate;
}
@keyframes faceLunge {
  from { transform:translate(-50%,-50%) scale(1.0) rotate(-1deg); }
  to   { transform:translate(-50%,-50%) scale(1.04) rotate(1deg); }
}
#jumpscareFace::before,
#jumpscareFace::after {
  content:"";
  position:absolute;
  top:28%;
  width:17%;
  height:10%;
  background:rgba(255,255,255,0.94);
  filter:blur(0.4px);
  box-shadow:0 0 18px rgba(255,255,255,0.85), 0 0 30px rgba(255,0,0,0.55);
  clip-path: polygon(0 0, 100% 20%, 85% 100%, 10% 80%);
}
#jumpscareFace::before { left:22%; transform:rotate(-12deg); }
#jumpscareFace::after  { right:22%; transform:rotate(12deg); }
#jumpscareMouth {
  position:absolute; left:50%; top:60%;
  width:30%; height:16%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.92);
  clip-path: polygon(10% 10%, 90% 10%, 100% 60%, 75% 100%, 25% 100%, 0 60%);
  box-shadow:0 0 22px rgba(255,255,255,0.85), 0 0 40px rgba(255,0,0,0.65);
  animation:march 0.09s infinite alternate;
}
@keyframes march {
  from { transform:translateX(-50%) scale(1.0) rotate(0deg); }
  to   { transform:translateX(-50%) scale(1.04) rotate(2deg); }
}
#jumpscareOverlay.fadeOut .bg { animation:none; background:rgba(0,0,0,0.96); }
#jumpscareOverlay.fadeOut #jumpscareFace,
#jumpscareOverlay.fadeOut #jumpscareMouth {
  opacity:0.0;
  transition:opacity 0.25s ease;
}

/* =====================================================
   シネマティックテキストウィンドウ（★修正3：タップ送り対応）
===================================================== */
#cinemaTop {
  position:fixed; top:0; left:0; right:0;
  height:0; background:#000;
  z-index:80; transition:height 0.5s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;
}
#cinemaBot {
  position:fixed; bottom:0; left:0; right:0;
  height:0; background:#000;
  z-index:80; transition:height 0.5s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;
}
#cinemaTop.open { height:18vh; }
#cinemaBot.open { height:24vh; }

/* ページ番号 */
#storyPageNum {
  position:fixed; top:4px; right:18px;
  font-family:'Hiragino Mincho ProN',serif;
  font-size:12px; color:#554433; letter-spacing:2px;
  z-index:88; pointer-events:none; display:none;
}

#storyPanel {
  position:fixed; inset:0; z-index:85;
  display:none; align-items:center; justify-content:center;
  pointer-events:auto;
}
#storyPanel.active { display:flex; }

#storyBox {
  position:absolute; bottom:0; left:0; right:0;
  height:24vh; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  padding:12px 40px 20px;
  pointer-events:auto;
}
#storyText {
  font-family:'Hiragino Mincho ProN','Yu Mincho',serif;
  font-size:clamp(13px,2.5vw,17px); color:#e8ddc8;
  line-height:1.85; letter-spacing:0.06em;
  text-shadow:0 1px 6px rgba(0,0,0,0.9);
  text-align:left; width:100%; max-width:680px;
}
#storyCursor {
  display:inline-block;
  width:10px; height:14px;
  background:#c8b080;
  margin-left:4px; vertical-align:middle;
  animation:blinkCursor 0.8s step-end infinite;
}
@keyframes blinkCursor { 0%,100%{opacity:1;} 50%{opacity:0;} }
#storyTapHint {
  margin-top:10px;
  font-family:'Hiragino Mincho ProN',serif;
  font-size:12px; color:#776655; letter-spacing:3px;
  animation:pulse 1.4s ease-in-out infinite;
}

/* 地蔵プロンプト */
#jizoPrompt {
  position:fixed; bottom:170px; left:50%; transform:translateX(-50%);
  font-family:'Hiragino Mincho ProN',serif;
  font-size:18px; color:#ffffff;
  padding:8px 18px; border-radius:999px;
  background:rgba(0,0,0,0.45);
  border:1px solid rgba(255,255,255,0.25);
  text-shadow:0 0 8px #000;
  z-index:21; pointer-events:none; display:none;
}

/* 揺れオーバーレイ */
#shakeOverlay {
  position:fixed; inset:0; background:rgba(255,255,255,0);
  z-index:90; pointer-events:none;
  transition:background 0.05s;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<!-- =====================================================
   ★修正1：導入プロローグ画面（新設）
===================================================== -->
<div id="prologueScreen">
  <div id="prologueLogo">忌夜ノ村</div>
  <div id="prologueDivider"></div>
  <div id="prologueBody">
    <p>数日前、「八尺様」の呪いについて調べに行った<span class="red">親友が姿を消した</span>。</p>
    <p style="margin-top:10px">あいつの足取りを追い、私は地図にない廃村へと足を踏み入れる……。</p>
  </div>
  <div id="prologueControls">
    ・画面<b>左側</b>：移動（ジョイスティック）<br>
    ・画面<b>右側</b>：視点移動（スワイプ）<br>
    ・画面<b>右下</b>：走る（スタミナ消費）
  </div>
  <div id="prologueTapHint">▶ 画面をタップして、親友の痕跡（光る灯篭の家）を探す</div>
</div>

<!-- =====================================================
   ゲーム本体UIラッパー
===================================================== -->
<div id="gameUI">

<div id="vignette"></div>
<div id="darknessOverlay"></div>
<div id="dangerVeil"></div>
<div id="shakeOverlay"></div>

<div id="chapterBadge">第1章：静寂の廃村</div>

<div id="candleUI">🕯 和蝋燭の残り火：<span id="candlePercent">100</span>%</div>
<div id="candleBar"><div id="candleBarFill"></div></div>

<div id="staminaUI">🏃 スタミナ：<span id="staminaPct">100</span>%</div>
<div id="staminaBar"><div id="staminaBarFill"></div></div>

<div id="alertIndicator">⚠ 八尺様に発見された…</div>
<div id="statusMsg"></div>
<div id="jizoPrompt">【タップ】して地蔵に火を灯す</div>
<div id="promptMsg"></div>
<div id="blockMsg">まだ上に行くべきではない…</div>
<div id="errorMsg"></div>

<div id="gameOverScreen">
  <div id="gameOverInner">
    <div id="gameOverTitle">生贄に捧げられた…</div>
    <div id="gameOverSub">GAME OVER</div>
  </div>
</div>

<div id="jumpscareOverlay">
  <div class="bg"></div>
  <div id="jumpscareFace">
    <div id="jumpscareMouth"></div>
  </div>
</div>

<!-- シネマ黒帯 -->
<div id="cinemaTop"></div>
<div id="cinemaBot"></div>
<div id="storyPageNum"></div>
<div id="storyPanel">
  <div id="storyBox">
    <div id="storyText"><span id="storyContent"></span><span id="storyCursor"></span></div>
    <div id="storyTapHint">── タップして次へ ──</div>
  </div>
</div>

<div id="joystickBase"></div>
<div id="joystickStick"></div>
<div id="dashBtn"><div class="dashLabel">走る</div></div>

</div><!-- /#gameUI -->

<script>
(() => {
'use strict';

/* =====================================================
   ★修正1：プロローグ制御
   - ゲームはプロローグが消えるまで操作不可
===================================================== */
let prologueDone = false;
const prologueScreen = document.getElementById('prologueScreen');
const gameUI = document.getElementById('gameUI');

function dismissPrologue() {
  if (prologueDone) return;
  prologueDone = true;
  prologueScreen.classList.add('fadeout');
  // ゲームUIを表示
  gameUI.classList.add('visible');
  setTimeout(() => {
    prologueScreen.classList.add('gone');
  }, 1300);
}

function isOnPlatform(x, z) {
  return (
    Math.abs(x - PLAT.cx) <= PLAT.w * 0.5 &&
    Math.abs(z - PLAT.cz) <= PLAT.d * 0.5
  );
}
function isOnStair(x, z) {
  return (
    Math.abs(x - STAIR.cx) <= STAIR.width * 0.5 &&
    z >= STAIR.cz - STAIR.length * 0.5 &&
    z <= STAIR.cz + STAIR.length * 0.5 + 2
  );
}
function getTerrainY(x, z) {
  if (isOnPlatform(x, z)) return PLATFORM_H;
  if (isOnStair(x, z)) {
    const t = clamp((z - STAIR.cz) / STAIR.length + 0.5, 0, 1);
    return t * PLATFORM_H;
  }
  return 0;
}

/* =====================================================
   Static decorative meshes
===================================================== */
function cloneUniqueMaterials(root) {
  root.traverse(c => {
    if (!c.isMesh) return;
    c.material = Array.isArray(c.material)
      ? c.material.map(m => m.clone())
      : c.material.clone();
    c.castShadow = false;
    c.receiveShadow = false;
  });
}
function optimizeRoot(root, { darken = 1, allowTransparent = false } = {}) {
  root.traverse(c => {
    if (!c.isMesh) return;
    c.castShadow = false;
    c.receiveShadow = false;
    c.frustumCulled = true;
    if (c.geometry && !c.geometry.boundingSphere) c.geometry.computeBoundingSphere();
    const mats = Array.isArray(c.material) ? c.material : [c.material];
    mats.forEach(m => {
      if (!m) return;
      if (m.color && darken !== 1) m.color.multiplyScalar(darken);
      m.side = THREE.FrontSide;
      m.fog = true; m.depthTest = true; m.depthWrite = true;
      if (!allowTransparent && m.transparent && (m.opacity === undefined || m.opacity >= 0.999) && !m.alphaMap) {
        m.transparent = false; m.opacity = 1;
      }
      if (m.map) { m.map.anisotropy = Math.min(2, renderer.capabilities.getMaxAnisotropy()); m.map.generateMipmaps = true; }
      m.needsUpdate = true;
    });
  });
}

function getNearestJizoInRange() {
  let best = null, bestD = Infinity;
  for (const j of jizoList) {
    if (j.lit) continue;
    const d = dist2D(playerPos.x, playerPos.z, j.x, j.z);
    if (d <= JIZO_PROMPT_R && d < bestD) { best = j; bestD = d; }
  }
  return best;
}
function igniteJizo(jizo) {
  if (!jizo || jizo.lit) return;
  jizo.lit = true;
  jizo.light.intensity = 1.8;
  jizo.light.color.setHex(0xffa040);
}
function isInSafeZone(x, z) {
  return jizoList.some(j => j.lit && dist2D(x, z, j.x, j.z) <= JIZO_SAFE_R);
}
function jizoRepulsion(pos) {
  let rx = 0, rz = 0;
  for (const j of jizoList) {
    if (!j.lit) continue;
    const dx = pos.x - j.x, dz = pos.z - j.z;
    const d = Math.sqrt(dx*dx + dz*dz);
    if (d < JIZO_SAFE_R) {
      const ov = JIZO_SAFE_R - Math.max(d, 0.0001) + 0.15;
      rx += dx / Math.max(d, 0.0001) * ov;
      rz += dz / Math.max(d, 0.0001) * ov;
    }
  }
  return {x:rx, z:rz};
}

      enemyMixer = new THREE.AnimationMixer(window._hachishakuFBX);
      const action = enemyMixer.clipAction(window._hachishakuFBXAnimations[0]);
      action.reset(); action.enabled = true;
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.clampWhenFinished = false;
      action.play();
    }
  } else {
    vRoot.add(buildFallbackEnemy());
  }

  hachishaku.add(vRoot);
  hachishaku.position.set(spawnX, getTerrainY(spawnX, spawnZ), spawnZ);
  scene.add(hachishaku);
  enemyState = 'wander';
  setEnemyWanderTarget();
  chapter.enemySpawned = true;
}

function setEnemyWanderTarget() {
  let p, tries = 0;
  do {
    p = { x: randRange(-70, 70), z: randRange(-70, 70) };
    tries++;
  } while (isInSafeZone(p.x, p.z) && tries < 120);
  enemyTarget = p;
}
function faceEnemy(tx, tz) {
  if (!hachishaku) return;
  hachishaku.rotation.y = Math.atan2(tx - hachishaku.position.x, tz - hachishaku.position.z);
}
function hasLOS(ePos, pPos) {
  if (obstacleMeshes.length === 0) return true;
  const eye = ePos.clone(); eye.y += 2.2;
  const tgt = pPos.clone(); tgt.y += 1.0;
  const dir = new THREE.Vector3().subVectors(tgt, eye).normalize();
  const dist = eye.distanceTo(tgt);
  raycaster.set(eye, dir); raycaster.far = dist - 0.3;
  return raycaster.intersectObjects(obstacleMeshes, true).length === 0;
}

/* =====================================================
   Audio
===================================================== */
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(()=>{});
  } catch(_){}
}
document.addEventListener('touchstart', ensureAudio, { passive:true });
document.addEventListener('pointerdown', ensureAudio, { passive:true });

function playNoise(duration, freqLow, freqHigh, peakGain, vibratePattern) {
  try {
    ensureAudio(); if (!audioCtx) return;
    const len = Math.floor(audioCtx.sampleRate * duration);
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random()*2-1) * (1 - i/len);
    const src = audioCtx.createBufferSource(); src.buffer = buf;
    const hp = audioCtx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value = freqLow;
    const lp = audioCtx.createBiquadFilter(); lp.type='lowpass';  lp.frequency.value = freqHigh;
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value=-28; comp.knee.value=20; comp.ratio.value=20;
    comp.attack.value=0.001; comp.release.value=0.08;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(peakGain, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
    src.connect(hp); hp.connect(lp); lp.connect(comp); comp.connect(gain); gain.connect(audioCtx.destination);
    src.start();
    if (vibratePattern && navigator.vibrate) navigator.vibrate(vibratePattern);
  } catch(_){}
}
function playJumpscare() { playNoise(0.9, 620, 7200, 1.2, [80,40,80,40,180]); }
function playDoom() {
  playNoise(1.4, 40, 800, 1.8, [120,60,120,60,300]);
  setTimeout(() => playNoise(0.8, 60, 600, 1.0, []), 600);
}

/* =====================================================

===================================================== */
const joystickBase  = document.getElementById('joystickBase');
const joystickStick = document.getElementById('joystickStick');
const jizoPromptEl  = document.getElementById('jizoPrompt');
const promptMsg     = document.getElementById('promptMsg');

let joyId = null, joyActive = false, joyDx = 0, joyDy = 0, joyStartX = 0, joyStartY = 0;
let lookId = null, lookPrevX = 0, lookPrevY = 0;
let yaw = 0, pitch = 0;
const touchStartMeta = new Map();
const JOY_R = 60;
let moveLocked = false;

dashBtnEl.addEventListener('touchstart', e => {
  e.stopPropagation(); ensureAudio();
  if (game.state !== 'playing' || dashExhausted || moveLocked || !prologueDone) return;
  isDashing = true;
}, { passive:true });
dashBtnEl.addEventListener('touchend',   e => { e.stopPropagation(); isDashing = false; }, { passive:true });
dashBtnEl.addEventListener('touchcancel',e => { e.stopPropagation(); isDashing = false; }, { passive:true });

canvas.addEventListener('touchstart',  onTS, { passive:false });
canvas.addEventListener('touchmove',   onTM, { passive:false });
canvas.addEventListener('touchend',    onTE, { passive:false });
canvas.addEventListener('touchcancel', onTE, { passive:false });

function onTS(e) {
  e.preventDefault();
  ensureAudio();

  // ★修正3：ストーリー中のタップはページ送り
  if (storyOpen) {
    advanceStory();
    return;
  }

  // プロローグが終わっていない場合は操作しない
  if (!prologueDone) return;
  if (game.state !== 'playing') return;

  for (const t of e.changedTouches) {
    touchStartMeta.set(t.identifier, { x:t.clientX, y:t.clientY, time:Date.now() });
    const isLeft = t.clientX < window.innerWidth / 2;
    if (isLeft && joyId === null) {
      joyId = t.identifier; joyActive = true;
      joyStartX = t.clientX; joyStartY = t.clientY;
      joyDx = 0; joyDy = 0;
    } else if (!isLeft && lookId === null) {
      lookId = t.identifier;
      lookPrevX = t.clientX; lookPrevY = t.clientY;
    }
  }
}

function onTM(e) {
  e.preventDefault();
  if (storyOpen || game.state !== 'playing' || !prologueDone) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      const dx = t.clientX - joyStartX, dy = t.clientY - joyStartY;
      const len = Math.sqrt(dx*dx + dy*dy);
      const cl = Math.min(len, JOY_R);
      const a = Math.atan2(dy, dx);
      joyDx = Math.cos(a) * cl / JOY_R;
      joyDy = Math.sin(a) * cl / JOY_R;
      joystickStick.style.transform = `translate(${Math.cos(a)*cl}px,${Math.sin(a)*cl}px)`;
    }
    if (t.identifier === lookId) {
      yaw   -= (t.clientX - lookPrevX) * 0.003;
      pitch -= (t.clientY - lookPrevY) * 0.0028;
      pitch  = clamp(pitch, -Math.PI/2.2, Math.PI/2.2);
      lookPrevX = t.clientX; lookPrevY = t.clientY;
    }
  }
}

/**
 * ★修正2：tryInteract — 距離判定のみでノートイベントを起動
 *   ・プレイヤーがノート座標から3m以内 かつ
 *   ・タップが短押し（350ms未満）であれば
 *   → どこをタップしても確実にノートイベント発動
 */
function tryInteract(t) {
  if (game.state !== 'playing' || !prologueDone) return;
  const meta = touchStartMeta.get(t.identifier);
  if (!meta) return;

  const elapsed = Date.now() - meta.time;
  const moved   = Math.hypot(t.clientX - meta.x, t.clientY - meta.y);

  // 長押し・スワイプは除外
  if (elapsed > 400 || moved > 30) return;

  // ★ノートイベント：距離判定のみ（レイキャスト不使用）
  if (!noteRead && chapter.phase === 0 && isNoteInRange()) {
    chapter.phase = 1;
    moveLocked = true;
    joyActive = false; joyDx = 0; joyDy = 0;
    jizoPromptEl.style.display = 'none';
    promptMsg.style.display = 'none';
    openStory();
    return;
  }

  // 地蔵点火
  const nj = getNearestJizoInRange();
  if (nj) {
    igniteJizo(nj);
    jizoPromptEl.style.display = 'none';
  }
}

function onTE(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyId = null; joyActive = false; joyDx = 0; joyDy = 0;
      joystickStick.style.transform = 'translate(0,0)';
    }
    if (t.identifier === lookId) lookId = null;
    tryInteract(t);
    touchStartMeta.delete(t.identifier);
  }
}

/* =====================================================
   Player movement
===================================================== */
let blockMsgTimer = null;

function updateMove() {
  if (game.state !== 'playing' || !prologueDone) return;
  if (moveLocked && !storyOpen) moveLocked = false;

  // Stamina
  if (isDashing && !dashExhausted) {
    stamina = Math.max(0, stamina - STAMINA_DRAIN);
    if (stamina <= 0) { stamina = 0; dashExhausted = true; isDashing = false; }
  } else {
    if (dashExhausted) {
      stamina = Math.min(100, stamina + STAMINA_RECOVER * 0.6);
      if (stamina >= 30) dashExhausted = false;
    } else {
      stamina = Math.min(100, stamina + STAMINA_RECOVER);
    }
  }
  updateStaminaUI();

  if (!joyActive || moveLocked) return;

  const spd = (isDashing && !dashExhausted) ? SPEED_DASH : SPEED_WALK;
  const sinY = Math.sin(yaw), cosY = Math.cos(yaw);
  const fwdX = -sinY, fwdZ = -cosY;
  const rgtX =  cosY, rgtZ = -sinY;

  let nx = playerPos.x + (-joyDy * fwdX + joyDx * rgtX) * spd;
  let nz = playerPos.z + (-joyDy * fwdZ + joyDx * rgtZ) * spd;
  nx = clamp(nx, -81, 81);
  nz = clamp(nz, -81, 81);

  // 階段封鎖チェック
  if (stairBlocked) {
    const inBarrier =
      Math.abs(nx - STAIR.cx) <= STAIR.width + 0.5 &&
      nz <= STAIR.cz + 0.5 &&
      nz >= STAIR.cz - STAIR.length - 1;
    if (inBarrier) {
      if (dist2D(nx, nz, STAIR.cx, STAIR.cz - STAIR.length*0.5) < 3.5) {
        blockMsg.style.display = 'block';
        clearTimeout(blockMsgTimer);
        blockMsgTimer = setTimeout(() => { blockMsg.style.display = 'none'; }, 2200);
      }
      return;
    }
  }

  const ny = getTerrainY(nx, nz) + playerEyeH;

  function tryMove(tx, tz) {
    const ty = getTerrainY(tx, tz) + playerEyeH;
    if (!checkPlayerCol(tx, tz, ty)) {
      playerPos.x = tx; playerPos.z = tz;
      targetPlayerY = ty;
      return true;
    }
    return false;
  }

  if (!tryMove(nx, nz)) {
    if (!tryMove(nx, playerPos.z)) tryMove(playerPos.x, nz);
  }

  playerPos.y += (targetPlayerY - playerPos.y) * 0.22;
}

/* =====================================================
   Enemy AI
===================================================== */
function updateEnemyAI(deltaMs) {
  if (!hachishaku || game.state !== 'playing') return;
  if (enemyState === 'dormant') return;

  const ex = hachishaku.position.x, ez = hachishaku.position.z;
  const ePos3 = new THREE.Vector3(ex, 0, ez);
  const distP = dist2D(ex, ez, playerPos.x, playerPos.z);
  const canSee = distP < DETECT_R && hasLOS(ePos3, playerPos);

  if (distP < 1.8) { triggerJumpscare(); return; }

  if (enemyState === 'wander') {
    if (canSee) { enemyState = 'chase'; losTimer = 0; lastKnownPos = playerPos.clone(); }
  } else if (enemyState === 'chase') {
    if (canSee) { losTimer = 0; lastKnownPos = playerPos.clone(); }
    else {
      losTimer += deltaMs;
      if (losTimer >= LOS_LOSE_MS) {
        enemyState = 'wander'; losTimer = 0; lastKnownPos = null; setEnemyWanderTarget();
      }
    }
  }

  alertIndicator.style.display = enemyState === 'chase' ? 'block' : 'none';
  if (enemyState === 'chase') {
    const v = Math.max(0, Math.min(0.22, (DETECT_R - distP) / DETECT_R * 0.3));
    dangerVeil.style.background = `rgba(180,0,0,${v})`;
  } else {
    dangerVeil.style.background = 'rgba(0,0,0,0)';
  }

  const push = jizoRepulsion(hachishaku.position);

  if (enemyState === 'chase') {
    const tgt = canSee
      ? { x:playerPos.x, z:playerPos.z }
      : (lastKnownPos ? { x:lastKnownPos.x, z:lastKnownPos.z } : null);
    if (tgt) {
      faceEnemy(tgt.x, tgt.z);
      const dx = tgt.x - ex, dz = tgt.z - ez;
      const d = Math.sqrt(dx*dx + dz*dz);
      if (d > 0.01) {
        const nx = ex + (dx/d)*ENEMY_SPEED - push.x;
        const nz = ez + (dz/d)*ENEMY_SPEED - push.z;
        if (!isInSafeZone(nx, nz)) {
          hachishaku.position.x = nx; hachishaku.position.z = nz;
        } else { setEnemyWanderTarget(); enemyState = 'wander'; }
      }
      if (!canSee && lastKnownPos && dist2D(ex, ez, lastKnownPos.x, lastKnownPos.z) < 1.2) setEnemyWanderTarget();
    }
  } else {
    if (!enemyTarget) setEnemyWanderTarget();
    const dx = enemyTarget.x - ex, dz = enemyTarget.z - ez;
    const d = Math.sqrt(dx*dx + dz*dz);
    if (push.x !== 0 || push.z !== 0) {
      hachishaku.position.x -= push.x; hachishaku.position.z -= push.z;
      setEnemyWanderTarget();
    } else if (d < 0.9) {
      setEnemyWanderTarget();
    } else {
      const nx = ex + (dx/Math.max(d,0.0001))*ENEMY_WANDER - push.x;
      const nz = ez + (dz/Math.max(d,0.0001))*ENEMY_WANDER - push.z;
      if (!isInSafeZone(nx, nz)) {
        hachishaku.position.x = nx; hachishaku.position.z = nz;
        faceEnemy(enemyTarget.x, enemyTarget.z);
      } else { setEnemyWanderTarget(); }
    }
  }

  hachishaku.position.y = getTerrainY(hachishaku.position.x, hachishaku.position.z)
    + Math.sin(performance.now() * 0.004) * 0.015;
}

/* =====================================================
   Render loop
===================================================== */
let frame = 0;
function animate() {
  if (!game.running) return;
  requestAnimationFrame(animate);
  frame++;

  const delta = clock.getDelta();
  if (enemyMixer) enemyMixer.update(delta);

  if (game.state === 'playing') {
    updateMove();
    updateEnemyAI(delta * 1000);
  }

  // Camera
  camera.position.copy(playerPos);

  if (game.state === 'jumpscare') {
    const t = performance.now() - game.scareStart;
    const life = Math.max(0, 1 - t / 1200);
    const amp = 0.18 * life;
    camera.position.x += (Math.sin(performance.now()*0.08) + (Math.random()-0.5)*1.4) * amp;
    camera.position.y += (Math.cos(performance.now()*0.09) + (Math.random()-0.5)*1.2) * amp;
    camera.rotation.z = Math.sin(performance.now()*0.06) * amp * 0.45;
  } else {
    camera.rotation.z = 0;
  }

  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const dir = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  candleLight.position.copy(camera.position);
  candleLight.target.position.copy(camera.position.clone().addScaledVector(dir, 6));
  candleLight.target.updateMatrixWorld();
  footLight.position.copy(camera.position);

  const flicker = 0.9 + Math.sin(frame*0.23)*0.06 + Math.sin(frame*0.71)*0.04 + (Math.random()-0.5)*0.08;
  if (candlePercent > 0) {
    candleLight.intensity = 8.5 * (candlePercent/100) * flicker;
    candleLight.distance  = 12 + 8 * (candlePercent/100) + Math.random()*0.8;
    footLight.intensity   = 2.0 * (candlePercent/100) * flicker;
  } else {
    candleLight.intensity = 0; footLight.intensity = 0;
  }

  // Candle burn
  const now = Date.now();
  if (game.state === 'playing' && now - lastCandleTick > CANDLE_TICK_MS && candlePercent > 0) {
    candlePercent--;
    lastCandleTick = now;
    updateCandleUI();
    if (candlePercent <= 0) darknessOverlay.style.background = 'rgba(0,0,0,0.95)';
    else if (candlePercent <= 20) darknessOverlay.style.background = `rgba(0,0,0,${0.35*(1-candlePercent/20)})`;
  }

  // プロンプト表示
  if (game.state === 'playing' && !storyOpen && prologueDone) {
    jizoPromptEl.style.display = getNearestJizoInRange() ? 'block' : 'none';

    // ★修正2：ノートプロンプトも距離判定のみ
    if (!noteRead && chapter.phase === 0 && isNoteInRange()) {
      promptMsg.textContent = '【タップ】古いノートを読む';
      promptMsg.style.display = 'block';
    } else {
      promptMsg.style.display = 'none';
    }
  } else {
    jizoPromptEl.style.display = 'none';
    if (storyOpen) promptMsg.style.display = 'none';
  }

  renderer.render(scene, camera);
}

/* =====================================================
   GLB / FBX Asset loading
===================================================== */
function appendStatus(msg) { statusMsg.textContent = (statusMsg.textContent||'') + msg; }
function setStatus(msg) { statusMsg.textContent = msg; }
function clearStatus() { statusMsg.textContent = ''; }
function appendError(msg) {
  errorMsg.textContent = (errorMsg.textContent ? errorMsg.textContent+'\n' : '') + msg;
  errorMsg.style.display = 'block';
}
function clearError() { errorMsg.style.display='none'; errorMsg.textContent=''; }

const gltfLoader = new THREE.GLTFLoader();
const fbxLoader  = new THREE.FBXLoader();

/* --- Houses (ie.glb) --- */
function placeHouses(template) {
  const slots = [];
  for (let z = -75; z < 75; z += 10) {
    if (Math.abs(z) < 12 || isOnPlatform(0, z)) continue;
    slots.push({ x: 11 + randRange(1,4), z: z + randRange(-2,2), ry: Math.PI/2 });
    slots.push({ x:-11 - randRange(1,4), z: z + randRange(-2,2), ry:-Math.PI/2 });
  }
  for (let x = -75; x < 75; x += 10) {
    if (Math.abs(x) < 12) continue;
    const z1 = 11 + randRange(1,4), z2 = -11 - randRange(1,4);
    if (!isOnPlatform(x, z1)) slots.push({ x, z: z1, ry: 0 });
    if (!isOnPlatform(x, z2)) slots.push({ x, z: z2, ry: Math.PI });
  }

  const bbox = new THREE.Box3().setFromObject(template);
  const sz = new THREE.Vector3(); bbox.getSize(sz);
  const TARGET_H = 5.0;
  const autoSc = sz.y > 0.01 ? TARGET_H / sz.y : 1.0;

  let placed = 0;
  for (const slot of slots) {
    if (placed >= 22) break;
    const { x, z, ry } = slot;
    if (Math.sqrt(x*x+z*z) < 10) continue;
    if (isOnPlatform(x, z) || getTerrainY(x, z) > 0.1) continue;

    const house = template.clone(true);
    cloneUniqueMaterials(house);
    const sc = autoSc * (0.85 + Math.random()*0.28);
    house.scale.setScalar(sc);
    house.rotation.y = ry + randRange(-0.15, 0.15);
    house.updateMatrixWorld(true);

    const hb = new THREE.Box3().setFromObject(house);
    house.position.set(x, -hb.min.y, z);
    optimizeRoot(house, { darken:0.55, allowTransparent:true });
    scene.add(house);

    // ★既存最適化維持：Box3 軽量当たり判定
    const finalBB = new THREE.Box3().setFromObject(house);
    finalBB.expandByScalar(-0.10);
    collisionBoxes.push(finalBB);

    house.traverse(c => { if (c.isMesh && obstacleMeshes.length < 40) obstacleMeshes.push(c); });
    placed++;
  }
  return placed;
}

/* --- Street lights (gaitou.glb) --- */
const LANTERN_SLOTS = [];
(function buildLanternSlots() {
  for (let z = -68; z <= 68; z += 12) {
    LANTERN_SLOTS.push([ 8.8, z, Math.PI]);
    LANTERN_SLOTS.push([-8.8, z, 0]);
  }
  for (let x = -68; x <= 68; x += 12) {
    LANTERN_SLOTS.push([x,  8.8,-Math.PI/2]);
    LANTERN_SLOTS.push([x, -8.8, Math.PI/2]);
  }
})();

function placeLanterns(template) {
  const bb = new THREE.Box3().setFromObject(template);
  const sz = new THREE.Vector3(); bb.getSize(sz);
  const sc = sz.y > 0.01 ? 3.6 / sz.y : 1.0;
  let idx = 0;
  for (const [lx, lz, ry] of LANTERN_SLOTS) {
    if (isOnPlatform(lx, lz)) { idx++; continue; }
    const clone = template.clone(true);
    cloneUniqueMaterials(clone);
    clone.scale.setScalar(sc);
    clone.rotation.y = ry;
    clone.updateMatrixWorld(true);
    // ★既存最適化維持：Y=0 接地処理
    const cb = new THREE.Box3().setFromObject(clone);
    clone.position.set(lx, -cb.min.y, lz);
    optimizeRoot(clone, { darken:0.58, allowTransparent:true });
    scene.add(clone);
    if (idx % 5 === 0) {
      const pl = new THREE.PointLight(0xff8800, 0.95, 8, 2);
      pl.position.set(lx, sz.y * sc * 0.98, lz);
      scene.add(pl);
    }
    registerBox3(lx, 1.5, lz, 0.18, 1.8, 0.18);
    idx++;
  }
}
function placeFallbackLanterns() {
  let idx = 0;
  for (const [lx, lz, ry] of LANTERN_SLOTS) {
    if (isOnPlatform(lx, lz)) { idx++; continue; }
    const grp = new THREE.Group();
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.08, 3.2, 6),
      new THREE.MeshLambertMaterial({ color:0x1a0e00 }));
    pole.position.y = 1.6; grp.add(pole);
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.52, 0.42, 0.52),
      new THREE.MeshBasicMaterial({ color:0xffcc66 }));
    head.position.y = 3.35; grp.add(head);
    if (idx % 5 === 0) {
      const pl = new THREE.PointLight(0xff8800, 1.3, 9, 2);
      pl.position.y = 3.35; grp.add(pl);
    }
    grp.position.set(lx, 0, lz);
    grp.rotation.y = ry;
    scene.add(grp);
    registerBox3(lx, 1.6, lz, 0.15, 1.8, 0.15);
    idx++;
  }
}

/* --- Stairs (kaidan.glb) --- */
function placeStairs(template) {
  if (!template) { placeFallbackStairs(); return; }
  const bb = new THREE.Box3().setFromObject(template);
  const sz = new THREE.Vector3(); bb.getSize(sz);
  const scH = sz.y > 0.01 ? PLATFORM_H / sz.y : 1.0;
  const scW = sz.x > 0.01 ? STAIR.width / sz.x : 1.0;
  const clone = template.clone(true);
  cloneUniqueMaterials(clone);
  clone.scale.set(scW, scH, scH);
  clone.rotation.y = STAIR.ry;
  clone.updateMatrixWorld(true);
  // ★既存最適化維持：kaidan.glb の接地処理
  const cb2 = new THREE.Box3().setFromObject(clone);
  clone.position.set(STAIR.cx, -cb2.min.y, STAIR.cz);
  optimizeRoot(clone, { darken:0.7, allowTransparent:true });
  scene.add(clone);
  for (let i = 0; i < STAIR.steps; i++) {
    const t = (i + 0.5) / STAIR.steps;
    const cx = STAIR.cx;
    const cz = STAIR.cz - STAIR.length * (0.5 - t);
    const cy = PLATFORM_H * (i / STAIR.steps + 0.5 / STAIR.steps);
    const stepD = STAIR.length / STAIR.steps;
    registerBox3(cx, cy, cz, STAIR.width * 0.5, cy, stepD * 0.5);
  }
}
function placeFallbackStairs() {
  const mat = new THREE.MeshLambertMaterial({ color:0x4a4338 });
  const rise = PLATFORM_H / STAIR.steps;
  const run  = STAIR.length / STAIR.steps;
  for (let i = 0; i < STAIR.steps; i++) {
    const cz = STAIR.cz - STAIR.length * 0.5 + (i + 0.5) * run;
    const cy = (i + 0.5) * rise;
    const step = new THREE.Mesh(new THREE.BoxGeometry(STAIR.width, rise, run), mat);
    step.position.set(STAIR.cx, cy, cz);
    scene.add(step);
    registerBox3(STAIR.cx, cy, cz, STAIR.width*0.5, rise*0.5, run*0.5);
  }
}

/* =====================================================
   Load sequence
===================================================== */
setStatus('モデル読み込み中...');

gltfLoader.load('./ie.glb', gltf => {
  const t = gltf.scene;
  optimizeRoot(t, { darken:0.55, allowTransparent:true });
  const n = placeHouses(t);
  appendStatus(`✅ ie.glb 家:${n}棟`);
  setTimeout(() => { if (game.state==='playing') clearStatus(); }, 5000);
  loadGaitou();
}, prog => {
  if (prog.total > 0) setStatus(`ie.glb ${Math.round(prog.loaded/prog.total*100)}%`);
}, e => {
  appendError('ie.glb失敗: ' + (e&&e.message?e.message:String(e)));
  loadGaitou();
});

function loadGaitou() {
  gltfLoader.load('./gaitou.glb', gltf => {
    placeLanterns(gltf.scene);
    appendStatus('\n✅ gaitou.glb');
    setTimeout(() => { if(game.state==='playing') clearStatus(); }, 5000);
    loadKaidan();
  }, null, () => {
    appendError('gaitou.glb失敗→基本形状使用');
    placeFallbackLanterns();
    loadKaidan();
  });
}

function loadKaidan() {
  gltfLoader.load('./kaidan.glb', gltf => {
    placeStairs(gltf.scene);
    appendStatus('\n✅ kaidan.glb');
    setTimeout(() => { if(game.state==='playing') clearStatus(); }, 5000);
    loadFBX();
  }, null, () => {
    appendError('kaidan.glb失敗→基本階段使用');
    placeFallbackStairs();
    loadFBX();
  });
}

function loadFBX() {
  if (typeof THREE.FBXLoader === 'undefined') {
    appendError('FBXLoader未定義→フォールバック使用');
    setTimeout(() => clearError(), 5000);
    return;
  }
  fbxLoader.load('./popopo.fbx', fbx => {
    const BASE_SC = 0.02;
    fbx.scale.set(BASE_SC, BASE_SC, BASE_SC);
    fbx.updateMatrixWorld(true);
    const bb = new THREE.Box3().setFromObject(fbx);
    const sz = new THREE.Vector3(); bb.getSize(sz);
    const sc = sz.y > 0.01 ? BASE_SC * (4.5 / sz.y) : BASE_SC;
    fbx.scale.setScalar(sc);
    fbx.updateMatrixWorld(true);
    const bb2 = new THREE.Box3().setFromObject(fbx);
    fbx.position.y = -bb2.min.y;

    fbx.traverse(c => {
      if (!c.isMesh) return;
      c.castShadow = false; c.receiveShadow = false; c.frustumCulled = true;
      const mats = Array.isArray(c.material) ? c.material : [c.material];
      mats.forEach(m => {
        if (!m) return;
        if (m.color) m.color.multiplyScalar(0.28);
        if (m.emissive) m.emissive.multiplyScalar(0.12);
        m.fog=true; m.depthTest=true; m.depthWrite=true;
        m.side=THREE.FrontSide; m.needsUpdate=true;
      });
    });

    window._hachishakuFBX = fbx;
    window._hachishakuFBXAnimations = fbx.animations || [];
    appendStatus(`\n✅ popopo.fbx / アニメ:${fbx.animations.length}クリップ`);
    setTimeout(() => { if(game.state==='playing') clearStatus(); }, 5000);
  }, prog => {
    if (prog.total > 0) appendStatus(`\npopopo.fbx ${Math.round(prog.loaded/prog.total*100)}%`);
  }, e => {
    appendError('popopo.fbx失敗→フォールバック\n'+(e&&e.message?e.message:String(e)));
    setTimeout(() => clearError(), 7000);
  });
}

/* =====================================================
   Start
===================================================== */
animate();
updateCandleUI();
updateStaminaUI();

})();
