<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜の村 - 和風ホラー</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameCanvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }
  #ui {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    pointer-events: none;
    z-index: 10;
  }
  #candleUI {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Georgia', 'Noto Serif JP', serif;
    font-size: 22px;
    color: #f5c842;
    text-shadow:
      -2px -2px 0 #000,
       2px -2px 0 #000,
      -2px  2px 0 #000,
       2px  2px 0 #000,
       0 0 12px rgba(255, 180, 0, 0.6);
    letter-spacing: 2px;
    white-space: nowrap;
    z-index: 20;
    pointer-events: none;
  }
  #candleBar {
    position: fixed;
    top: 52px;
    left: 50%;
    transform: translateX(-50%);
    width: 220px;
    height: 8px;
    background: rgba(0,0,0,0.5);
    border: 1px solid rgba(255,180,0,0.4);
    border-radius: 4px;
    z-index: 20;
    pointer-events: none;
    overflow: hidden;
  }
  #candleBarFill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #ff6a00, #f5c842);
    border-radius: 4px;
    transition: width 0.5s ease;
    box-shadow: 0 0 6px rgba(255, 180, 0, 0.7);
  }
  #errorMsg {
    position: fixed;
    top: 80px;
    left: 50%;
    transform: translateX(-50%);
    font-family: monospace;
    font-size: 14px;
    color: #ff4444;
    text-shadow: 0 0 4px #000, 0 0 8px #000;
    background: transparent;
    padding: 4px 8px;
    z-index: 20;
    pointer-events: none;
    display: none;
    text-align: center;
  }
  /* Joystick */
  #joystickContainer {
    position: fixed;
    bottom: 60px;
    left: 60px;
    width: 120px;
    height: 120px;
    z-index: 15;
    pointer-events: none;
  }
  #joystickBase {
    position: absolute;
    top: 0; left: 0;
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,200,100,0.25);
    box-shadow: 0 0 20px rgba(255,150,0,0.1);
  }
  #joystickStick {
    position: absolute;
    top: 35px; left: 35px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: rgba(245, 200, 66, 0.35);
    border: 2px solid rgba(245, 200, 66, 0.5);
    box-shadow: 0 0 10px rgba(255,180,0,0.3);
    transition: transform 0.05s;
  }
  /* Darkness vignette */
  #vignette {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.75) 100%);
    pointer-events: none;
    z-index: 5;
  }
  /* Darkness overlay when candle dies */
  #darknessOverlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0);
    pointer-events: none;
    z-index: 8;
    transition: background 2s ease;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="vignette"></div>
<div id="darknessOverlay"></div>

<div id="candleUI">🕯 和蝋燭の残り火：<span id="candlePercent">100</span>%</div>
<div id="candleBar"><div id="candleBarFill"></div></div>
<div id="errorMsg" id="errorMsg"></div>

<div id="joystickContainer">
  <div id="joystickBase"></div>
  <div id="joystickStick"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===================================================
// THREE.JS 和風ホラーゲーム - メインコード
// ===================================================

(function() {
  'use strict';

  // ----- 基本設定 -----
  const canvas = document.getElementById('gameCanvas');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setClearColor(0x000000, 1);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x000000);
  scene.fog = new THREE.FogExp2(0x000000, 0.045);

  const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 200);
  camera.position.set(0, 1.6, 0);

  // ----- リサイズ対応 -----
  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  // ----- 地面 -----
  const groundGeo = new THREE.PlaneGeometry(300, 300, 20, 20);
  const groundMat = new THREE.MeshLambertMaterial({ color: 0x1a1a1a });
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // 地面テクスチャ風のグリッド（墓場の石畳）
  const gridHelper = new THREE.GridHelper(300, 60, 0x222222, 0x111111);
  gridHelper.position.y = 0.01;
  scene.add(gridHelper);

  // ----- 環境光（ごく微弱）-----
  const ambientLight = new THREE.AmbientLight(0x050510, 0.8);
  scene.add(ambientLight);

  // ----- 蝋燭スポットライト -----
  const candleLight = new THREE.SpotLight(0xffa050, 6, 18, Math.PI / 5, 0.5, 1.5);
  candleLight.castShadow = true;
  candleLight.shadow.mapSize.width = 512;
  candleLight.shadow.mapSize.height = 512;
  candleLight.shadow.camera.near = 0.1;
  candleLight.shadow.camera.far = 18;
  scene.add(candleLight);
  scene.add(candleLight.target);

  // ポイントライト（蝋燭の周辺光）
  const pointLight = new THREE.PointLight(0xff8822, 1.5, 4);
  scene.add(pointLight);

  // ----- 蝋燭システム -----
  let candlePercent = 100;
  let lastCandleTick = Date.now();
  const CANDLE_TICK_MS = 4000; // 4秒ごとに1%消費
  const candlePercentEl = document.getElementById('candlePercent');
  const candleBarFill = document.getElementById('candleBarFill');
  const darknessOverlay = document.getElementById('darknessOverlay');

  function updateCandleUI() {
    candlePercentEl.textContent = Math.max(0, Math.ceil(candlePercent));
    candleBarFill.style.width = candlePercent + '%';
    // 残り火が少ないほど色が赤くなる
    const r = Math.floor(200 + 55 * (1 - candlePercent / 100));
    const g = Math.floor(200 * (candlePercent / 100));
    candleBarFill.style.background = `linear-gradient(90deg, rgb(${r},50,0), rgb(${r},${g},50))`;
  }

  // ----- 不気味な赤い立方体（フォールバック用・常時表示）-----
  const cubeGeo = new THREE.BoxGeometry(1.2, 2.5, 1.2);
  const cubeMat = new THREE.MeshLambertMaterial({ color: 0x880000 });
  const redCube = new THREE.Mesh(cubeGeo, cubeMat);
  redCube.position.set(0, 1.25, -8);
  redCube.castShadow = true;
  scene.add(redCube);
  // 赤い発光効果
  const cubeGlow = new THREE.PointLight(0xff0000, 0.5, 5);
  cubeGlow.position.copy(redCube.position);
  scene.add(cubeGlow);

  // ----- GLTFLoader 動的ロード -----
  let houseTemplate = null;
  const errorEl = document.getElementById('errorMsg');

  // GLTFLoaderをCDNから動的に読み込む
  function loadGLTFLoader(callback) {
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    script.onload = callback;
    script.onerror = () => {
      showError('GLTFLoaderの読み込みに失敗しました');
      callback(false);
    };
    document.head.appendChild(script);
  }

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = 'block';
  }

  function placeHouses(template) {
    const count = 35;
    const range = 150;
    const minDist = 6; // プレイヤー初期位置からの最小距離

    for (let i = 0; i < count; i++) {
      let x, z, attempts = 0;
      do {
        x = (Math.random() - 0.5) * range;
        z = (Math.random() - 0.5) * range;
        attempts++;
      } while (Math.sqrt(x * x + z * z) < minDist && attempts < 50);

      const house = template.clone();
      house.position.set(x, 0, z);
      house.rotation.y = Math.random() * Math.PI * 2;

      // スケール少しランダムに
      const s = 0.8 + Math.random() * 0.5;
      house.scale.set(s, s, s);

      // シャドウ設定
      house.traverse(child => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          // 暗めのマテリアルにする
          if (child.material) {
            const mat = child.material.clone();
            mat.color && mat.color.multiplyScalar(0.6);
            child.material = mat;
          }
        }
      });

      scene.add(house);
    }
    // 家が読み込めた場合は赤い立方体を非表示
    redCube.visible = false;
    cubeGlow.visible = false;
  }

  loadGLTFLoader(function(ok) {
    if (ok === false) return;
    if (typeof THREE.GLTFLoader === 'undefined') {
      showError('GLTFLoaderが利用できません');
      return;
    }
    const loader = new THREE.GLTFLoader();
    loader.load(
      './ie.glb',
      function(gltf) {
        houseTemplate = gltf.scene;
        placeHouses(houseTemplate);
      },
      function(progress) {
        // ロード進行
      },
      function(error) {
        showError('ie.glbの読み込みに失敗しました');
        console.warn('ie.glb load error:', error);
      }
    );
  });

  // ----- 追加オブジェクト（雰囲気）-----
  // 鳥居
  function addTorii(x, z) {
    const mat = new THREE.MeshLambertMaterial({ color: 0x8B1A1A });
    // 左柱
    const pillarGeo = new THREE.CylinderGeometry(0.15, 0.15, 5, 8);
    const p1 = new THREE.Mesh(pillarGeo, mat);
    p1.position.set(x - 1.5, 2.5, z);
    p1.castShadow = true;
    scene.add(p1);
    // 右柱
    const p2 = p1.clone();
    p2.position.set(x + 1.5, 2.5, z);
    scene.add(p2);
    // 上の横木
    const beamGeo = new THREE.BoxGeometry(4, 0.3, 0.3);
    const b1 = new THREE.Mesh(beamGeo, mat);
    b1.position.set(x, 5, z);
    scene.add(b1);
    // 二段目
    const b2 = b1.clone();
    b2.position.set(x, 4.3, z);
    b2.scale.x = 0.85;
    scene.add(b2);
  }
  addTorii(0, -15);
  addTorii(20, 30);
  addTorii(-25, 15);

  // 提灯（ちょうちん）
  function addLantern(x, z) {
    const lanternGeo = new THREE.SphereGeometry(0.25, 8, 8);
    const lanternMat = new THREE.MeshBasicMaterial({ color: 0xffaa22 });
    const lantern = new THREE.Mesh(lanternGeo, lanternMat);
    lantern.position.set(x, 2.2, z);
    scene.add(lantern);
    const lanternLight = new THREE.PointLight(0xff8811, 0.8, 5);
    lanternLight.position.copy(lantern.position);
    scene.add(lanternLight);
    // 支柱
    const poleGeo = new THREE.CylinderGeometry(0.04, 0.04, 2.5, 6);
    const poleMat = new THREE.MeshLambertMaterial({ color: 0x3a2000 });
    const pole = new THREE.Mesh(poleGeo, poleMat);
    pole.position.set(x, 1, z);
    scene.add(pole);
  }
  const lanternPositions = [
    [5,-12],[-5,-12],[12,-12],[-12,-12],[0,10],[15,5],[-15,5],[8,20],[-8,20]
  ];
  lanternPositions.forEach(p => addLantern(p[0], p[1]));

  // 墓石
  function addGravestone(x, z) {
    const stoneGeo = new THREE.BoxGeometry(0.5, 1.2, 0.15);
    const stoneMat = new THREE.MeshLambertMaterial({ color: 0x2a2a2a });
    const stone = new THREE.Mesh(stoneGeo, stoneMat);
    stone.position.set(x, 0.6, z);
    stone.rotation.y = Math.random() * 0.4 - 0.2;
    stone.castShadow = true;
    scene.add(stone);
  }
  for (let i = 0; i < 20; i++) {
    let gx, gz;
    do {
      gx = (Math.random() - 0.5) * 80;
      gz = (Math.random() - 0.5) * 80;
    } while (Math.sqrt(gx*gx + gz*gz) < 5);
    addGravestone(gx, gz);
  }

  // ===================================================
  // タッチ操作システム
  // ===================================================
  const joystickContainer = document.getElementById('joystickContainer');
  const joystickStick = document.getElementById('joystickStick');
  const JOY_RADIUS = 60;
  const JOY_BASE_X = 60 + 60; // left + half width
  const JOY_BASE_Y = () => window.innerHeight - 60 - 60;

  let joystickActive = false;
  let joystickTouchId = null;
  let joystickDelta = { x: 0, y: 0 };
  let joystickStartX = 0, joystickStartY = 0;

  let lookTouchId = null;
  let lookLastX = 0, lookLastY = 0;

  // カメラ回転状態
  let yaw = 0;   // 水平回転
  let pitch = 0; // 垂直回転

  canvas.addEventListener('touchstart', onTouchStart, { passive: false });
  canvas.addEventListener('touchmove', onTouchMove, { passive: false });
  canvas.addEventListener('touchend', onTouchEnd, { passive: false });
  canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

  function isLeftSide(x) {
    return x < window.innerWidth / 2;
  }

  function onTouchStart(e) {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      if (isLeftSide(touch.clientX) && joystickTouchId === null) {
        joystickTouchId = touch.identifier;
        joystickStartX = touch.clientX;
        joystickStartY = touch.clientY;
        joystickActive = true;
      } else if (!isLeftSide(touch.clientX) && lookTouchId === null) {
        lookTouchId = touch.identifier;
        lookLastX = touch.clientX;
        lookLastY = touch.clientY;
      }
    }
  }

  function onTouchMove(e) {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      if (touch.identifier === joystickTouchId) {
        const dx = touch.clientX - joystickStartX;
        const dy = touch.clientY - joystickStartY;
        const dist = Math.min(Math.sqrt(dx*dx + dy*dy), JOY_RADIUS);
        const angle = Math.atan2(dy, dx);
        joystickDelta.x = Math.cos(angle) * dist / JOY_RADIUS;
        joystickDelta.y = Math.sin(angle) * dist / JOY_RADIUS;

        // スティックUI更新
        const stickX = Math.cos(angle) * Math.min(dist, JOY_RADIUS);
        const stickY = Math.sin(angle) * Math.min(dist, JOY_RADIUS);
        joystickStick.style.transform = `translate(${stickX}px, ${stickY}px)`;
      }

      if (touch.identifier === lookTouchId) {
        const dx = touch.clientX - lookLastX;
        const dy = touch.clientY - lookLastY;
        yaw -= dx * 0.003;
        pitch -= dy * 0.003;
        pitch = Math.max(-Math.PI / 2.5, Math.min(Math.PI / 2.5, pitch));
        lookLastX = touch.clientX;
        lookLastY = touch.clientY;
      }
    }
  }

  function onTouchEnd(e) {
    e.preventDefault();
    for (const touch of e.changedTouches) {
      if (touch.identifier === joystickTouchId) {
        joystickTouchId = null;
        joystickActive = false;
        joystickDelta.x = 0;
        joystickDelta.y = 0;
        joystickStick.style.transform = 'translate(0px, 0px)';
      }
      if (touch.identifier === lookTouchId) {
        lookTouchId = null;
      }
    }
  }

  // ===================================================
  // プレイヤー移動
  // ===================================================
  const MOVE_SPEED = 0.05;
  const playerPos = new THREE.Vector3(0, 1.6, 0);

  function updateMovement() {
    if (!joystickActive) return;
    const forward = new THREE.Vector3(
      -Math.sin(yaw),
      0,
      -Math.cos(yaw)
    );
    const right = new THREE.Vector3(
      Math.cos(yaw),
      0,
      -Math.sin(yaw)
    );
    playerPos.addScaledVector(forward, -joystickDelta.y * MOVE_SPEED);
    playerPos.addScaledVector(right, joystickDelta.x * MOVE_SPEED);

    // マップ境界
    playerPos.x = Math.max(-80, Math.min(80, playerPos.x));
    playerPos.z = Math.max(-80, Math.min(80, playerPos.z));
  }

  // ===================================================
  // メインループ
  // ===================================================
  let frameCount = 0;

  function animate() {
    requestAnimationFrame(animate);
    frameCount++;

    // 移動
    updateMovement();

    // カメラ更新
    camera.position.copy(playerPos);
    camera.rotation.order = 'YXZ';
    camera.rotation.y = yaw;
    camera.rotation.x = pitch;

    // 蝋燭ライト更新
    const lookDir = new THREE.Vector3(0, 0, -1);
    lookDir.applyEuler(camera.rotation);

    candleLight.position.copy(camera.position);
    const targetPos = camera.position.clone().add(lookDir.multiplyScalar(5));
    candleLight.target.position.copy(targetPos);
    candleLight.target.updateMatrixWorld();
    pointLight.position.copy(camera.position);

    // 蝋燭のゆらぎ
    const flicker = 0.9 + Math.sin(frameCount * 0.3) * 0.05 + (Math.random() - 0.5) * 0.1;
    if (candlePercent > 0) {
      const baseIntensity = 6 * (candlePercent / 100);
      candleLight.intensity = baseIntensity * flicker;
      candleLight.distance = 10 + 8 * (candlePercent / 100) + Math.random() * 0.5;
      pointLight.intensity = 1.5 * (candlePercent / 100) * flicker;
    } else {
      candleLight.intensity = 0;
      pointLight.intensity = 0;
    }

    // 蝋燭時間管理
    const now = Date.now();
    if (now - lastCandleTick > CANDLE_TICK_MS && candlePercent > 0) {
      candlePercent -= 1;
      lastCandleTick = now;
      updateCandleUI();
      if (candlePercent <= 0) {
        candlePercent = 0;
        darknessOverlay.style.background = 'rgba(0,0,0,0.92)';
      } else if (candlePercent <= 20) {
        darknessOverlay.style.background = `rgba(0,0,0,${0.3 * (1 - candlePercent / 20)})`;
      }
    }

    // 赤い立方体の回転（雰囲気）
    if (redCube.visible) {
      redCube.rotation.y += 0.01;
    }

    renderer.render(scene, camera);
  }

  animate();
  updateCandleUI();

})();
</script>
</body>
</html>
