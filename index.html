<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜の村 - 和風ホラー</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden; background:#1a140c;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #gameCanvas {
    display:block; width:100%; height:100%; touch-action:none;
  }
  #candleUI {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    font-family:'Georgia','Hiragino Mincho ProN',serif;
    font-size:22px; color:#f5c842; letter-spacing:2px; white-space:nowrap;
    text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 10px rgba(255,200,120,0.7);
    z-index:20; pointer-events:none;
  }
  #candleBar {
    position:fixed; top:54px; left:50%; transform:translateX(-50%);
    width:220px; height:8px; background:rgba(0,0,0,0.5);
    border:1px solid rgba(255,180,0,0.4); border-radius:4px;
    z-index:20; pointer-events:none; overflow:hidden;
  }
  #candleBarFill {
    height:100%; width:100%;
    background:linear-gradient(90deg,#ff6a00,#f5c842);
    border-radius:4px; transition:width 0.5s ease;
    box-shadow:0 0 10px rgba(255,200,120,0.85);
  }
  #statusMsg {
    position:fixed; top:76px; left:50%; transform:translateX(-50%);
    font-family:monospace; font-size:13px; color:#aaffaa;
    text-shadow:0 0 5px #000,0 0 8px #000;
    z-index:20; pointer-events:none; text-align:center;
  }
  #errorMsg {
    position:fixed; top:96px; left:50%; transform:translateX(-50%);
    font-family:monospace; font-size:13px; color:#ff4444;
    text-shadow:0 0 5px #000;
    z-index:20; pointer-events:none; display:none; text-align:center;
  }
  #joystickBase {
    position:fixed; bottom:60px; left:60px;
    width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,0.12);
    border:2px solid rgba(255,220,150,0.45);
    z-index:15; pointer-events:none;
  }
  #joystickStick {
    position:fixed; bottom:95px; left:95px;
    width:50px; height:50px; border-radius:50%;
    background:rgba(255,220,120,0.55);
    border:2px solid rgba(255,220,120,0.75);
    box-shadow:0 0 12px rgba(255,200,120,0.55);
    z-index:16; pointer-events:none;
    transition:transform 0.03s;
  }
  #vignette {
    position:fixed; inset:0;
    background:radial-gradient(ellipse at center,transparent 18%,rgba(0,0,0,0.45) 100%);
    pointer-events:none; z-index:5;
  }
  #darknessOverlay {
    position:fixed; inset:0; background:rgba(0,0,0,0);
    pointer-events:none; z-index:8; transition:background 3s ease;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="vignette"></div>
<div id="darknessOverlay"></div>
<div id="candleUI">🕯 和蝋燭の残り火：<span id="candlePercent">100</span>%</div>
<div id="candleBar"><div id="candleBarFill"></div></div>
<div id="statusMsg"></div>
<div id="errorMsg"></div>
<div id="joystickBase"></div>
<div id="joystickStick"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// ===== 基本セットアップ =====
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000,1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a140c);
scene.fog = new THREE.FogExp2(0x1a140c, 0.016); // 少し弱めて近距離が見えやすく

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 200);
camera.position.set(0, 1.65, 0);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== 地面 =====
const groundMat = new THREE.MeshLambertMaterial({color:0x111111});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400,1,1), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// 石畳グリッド
const grid = new THREE.GridHelper(400, 80, 0x1e1e1e, 0x141414);
grid.position.y = 0.005;
scene.add(grid);

// ===== ライト =====
const ambLight = new THREE.AmbientLight(0x8a8a7a, 1.7);
scene.add(ambLight);

// 蝋燭スポットライト
const candleLight = new THREE.SpotLight(0xffc35c, 14, 30, Math.PI/6, 0.45, 1.8);
candleLight.castShadow = true;
candleLight.shadow.mapSize.set(512,512);
candleLight.shadow.camera.near = 0.1;
candleLight.shadow.camera.far = 20;
scene.add(candleLight);
scene.add(candleLight.target);

// 足元の周辺光
const footLight = new THREE.PointLight(0xff9a2f, 4, 8);
scene.add(footLight);

// ===== 蝋燭UI =====
let candlePercent = 100;
let lastTick = Date.now();
const TICK_MS = 4000;
const pctEl = document.getElementById('candlePercent');
const barFill = document.getElementById('candleBarFill');
const darkOverlay = document.getElementById('darknessOverlay');
const statusMsg = document.getElementById('statusMsg');
const errorMsg  = document.getElementById('errorMsg');

function updateCandleUI(){
  const v = Math.max(0, Math.ceil(candlePercent));
  pctEl.textContent = v;
  barFill.style.width = v+'%';
  const r = Math.floor(180 + 75*(1-v/100));
  const g = Math.floor(190*(v/100));
  barFill.style.background = `linear-gradient(90deg,rgb(${r},40,0),rgb(${r},${g},30))`;
}

// ===== 赤い立方体（フォールバック & 確認用）=====
// MeshBasicMaterial: ライト・フォグの影響を受けず確実に見える
const redCube = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 3, 1.5),
  new THREE.MeshBasicMaterial({color:0xff0000})
);
redCube.position.set(0, 1.5, -5); // 目の前5mに
redCube.material.fog = false;      // フォグの影響を受けない → 必ず見える
scene.add(redCube);
const redGlow = new THREE.PointLight(0xff2200, 1.5, 8);
redGlow.position.copy(redCube.position);
scene.add(redGlow);

// ===== 雰囲気オブジェクト =====
// 鳥居
function addTorii(x, z, ry){
  const mat = new THREE.MeshLambertMaterial({color:0x7a1010});
  const grp = new THREE.Group();
  // 柱×2
  [-1.6,1.6].forEach(ox=>{
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,5.5,8), mat);
    p.position.set(ox,2.75,0); p.castShadow=true; grp.add(p);
  });
  // 笠木（上）
  const k1 = new THREE.Mesh(new THREE.BoxGeometry(4.4,0.35,0.35), mat);
  k1.position.set(0,5.5,0); grp.add(k1);
  // 貫（下）
  const k2 = new THREE.Mesh(new THREE.BoxGeometry(3.8,0.25,0.25), mat);
  k2.position.set(0,4.6,0); grp.add(k2);
  grp.position.set(x,0,z);
  grp.rotation.y = ry||0;
  scene.add(grp);
}
addTorii(0,-18,0);
addTorii(22,28,0.5);
addTorii(-20,18,-0.3);
addTorii(0,35,Math.PI);

// 提灯
function addLantern(x,z){
  const grp = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.28,8,8),
    new THREE.MeshBasicMaterial({color:0xffcc44})
  );
  body.position.y=2.4; grp.add(body);
  const pl = new THREE.PointLight(0xff9900,0.9,7);
  pl.position.y=2.4; grp.add(pl);
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05,0.05,2.6,6),
    new THREE.MeshLambertMaterial({color:0x2a1500})
  );
  pole.position.y=1.1; grp.add(pole);
  grp.position.set(x,0,z);
  scene.add(grp);
}
[[6,-14],[-6,-14],[14,-14],[-14,-14],[0,12],[16,6],[-16,6],[9,22],[-9,22],[0,-25],[20,-5],[-20,-5]].forEach(p=>addLantern(p[0],p[1]));

// 墓石
function addGrave(x,z){
  const mat = new THREE.MeshLambertMaterial({color:0x252525});
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.4,0.18),mat);
  body.position.y=0.7; grp.add(body);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.18,8,1,false,0,Math.PI),mat);
  top.rotation.x=Math.PI/2; top.position.set(0,1.5,0); grp.add(top);
  grp.position.set(x,0,z);
  grp.rotation.y=Math.random()*0.5-0.25;
  grp.castShadow=true;
  scene.add(grp);
}
for(let i=0;i<25;i++){
  let gx,gz;
  do{ gx=(Math.random()-0.5)*100; gz=(Math.random()-0.5)*100; }
  while(Math.sqrt(gx*gx+gz*gz)<6);
  addGrave(gx,gz);
}

// 竹やぶ（細い円柱）
function addBamboo(x,z){
  const mat = new THREE.MeshLambertMaterial({color:0x1a2a10});
  for(let i=0;i<5;i++){
    const b = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05,0.07,4+Math.random()*2,6),
      mat
    );
    b.position.set(x+(Math.random()-0.5)*1.2, (b.geometry.parameters.height||5)/2, z+(Math.random()-0.5)*1.2);
    b.castShadow=true;
    scene.add(b);
  }
}
[[30,10],[-30,10],[25,-20],[-25,-20],[35,30],[-35,-10]].forEach(p=>addBamboo(p[0],p[1]));

// ===== GLTFLoader + ie.glb ロード =====
statusMsg.textContent = 'ie.glb 読み込み中...';

function loadScript(url, cb){
  const s=document.createElement('script');
  s.src=url;
  s.onload=()=>cb(null);
  s.onerror=()=>cb(new Error('script load failed: '+url));
  document.head.appendChild(s);
}

loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js', function(err){
  if(err){
    errorMsg.textContent='GLTFLoaderの読み込みに失敗しました';
    errorMsg.style.display='block';
    statusMsg.textContent='';
    return;
  }
  if(typeof THREE.GLTFLoader === 'undefined'){
    errorMsg.textContent='GLTFLoaderが利用できません';
    errorMsg.style.display='block';
    statusMsg.textContent='';
    return;
  }

  const loader = new THREE.GLTFLoader();
  loader.load('./ie.glb',
    function(gltf){
      const template = gltf.scene;

      // メッシュ数カウント（実際にジオメトリがあるか確認）
      let meshCount = 0;
      template.traverse(c => { if(c.isMesh) meshCount++; });

      if(meshCount === 0){
        errorMsg.textContent = 'ie.glb は読み込めましたがメッシュが0個です（空のファイルかも）';
        errorMsg.style.display = 'block';
        statusMsg.textContent = '';
        // 赤い立方体はそのまま残す
        return;
      }

      // メッシュが存在 → 赤い立方体を消す
      redCube.visible = false;
      redGlow.visible = false;

      // --- モデルの実寸を確認してスケール決定 ---
      const bbox = new THREE.Box3().setFromObject(template);
      const size = new THREE.Vector3();
      bbox.getSize(size);
      // 高さ約4〜6mになるよう自動スケール
      const targetH = 5.0;
      const autoScale = (size.y > 0.01) ? targetH / size.y : 1.0;

      // ローカル底辺のY
      const bottomY = bbox.min.y * autoScale;

      statusMsg.textContent = `✅ ie.glb 読み込み成功 / メッシュ:${meshCount}個 / サイズ:${size.x.toFixed(1)}x${size.y.toFixed(1)}x${size.z.toFixed(1)} / スケール:${autoScale.toFixed(3)}`;
      setTimeout(()=>{ statusMsg.textContent=''; }, 6000);

      // 35軒配置
      const COUNT = 35;
      const RANGE = 140;
      const MIN_DIST = 7; // プレイヤー初期位置から離す

      for(let i=0; i<COUNT; i++){
        // 配置位置決定（初期位置から離す）
        let px,pz,attempts=0;
        do{
          px = (Math.random()-0.5)*RANGE;
          pz = (Math.random()-0.5)*RANGE;
          attempts++;
        }while(Math.sqrt(px*px+pz*pz) < MIN_DIST && attempts < 100);

        // テンプレートをディープコピー
        const house = template.clone(true);
        house.scale.setScalar(autoScale * (0.85 + Math.random()*0.35));
        house.rotation.y = Math.random()*Math.PI*2;
        // 地面にぴったり置く
        house.position.set(px, -bottomY, pz);

        // 影・マテリアル暗め
        house.traverse(child=>{
          if(child.isMesh){
            child.castShadow = true;
            child.receiveShadow = true;
            if(child.material){
              const mats = Array.isArray(child.material) ? child.material : [child.material];
              mats.forEach(m=>{
                if(m.color) m.color.multiplyScalar(0.55);
              });
            }
          }
        });
        scene.add(house);
      }
    },
    function(prog){
      if(prog.total>0){
        const pct = Math.round(prog.loaded/prog.total*100);
        statusMsg.textContent = `ie.glb 読み込み中... ${pct}%`;
      }
    },
    function(err){
      const msg = 'ie.glbの読み込みに失敗しました：' + (err && err.message ? err.message : String(err));
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      errorMsg.style.color = '#ff4444';
      statusMsg.textContent = '';
      console.error('ie.glb load error:', err);
    }
  );
});

// ===== タッチ操作 =====
const joyBase  = document.getElementById('joystickBase');
const joyStick = document.getElementById('joystickStick');
// ジョイスティック中心（CSS: left:60+60=120, bottom:60+60=120）
const JOY_CX  = 120; // left + 半径
const JOY_R   = 60;
let joyId=null, joyActive=false;
let joyDx=0, joyDy=0;
let joyStartX=0, joyStartY=0;

let lookId=null;
let lookPrevX=0, lookPrevY=0;

let yaw=0, pitch=0;

// ジョイスティックスティックの初期位置
const JOY_STICK_INIT_LEFT = 120-25; // center - half stick width
const JOY_STICK_INIT_BOTTOM = 120-25;

canvas.addEventListener('touchstart', onTS, {passive:false});
canvas.addEventListener('touchmove',  onTM, {passive:false});
canvas.addEventListener('touchend',   onTE, {passive:false});
canvas.addEventListener('touchcancel',onTE, {passive:false});

function onTS(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    const isLeft = t.clientX < window.innerWidth/2;
    if(isLeft && joyId===null){
      joyId=t.identifier; joyActive=true;
      joyStartX=t.clientX; joyStartY=t.clientY;
      joyDx=0; joyDy=0;
    } else if(!isLeft && lookId===null){
      lookId=t.identifier;
      lookPrevX=t.clientX; lookPrevY=t.clientY;
    }
  }
}
function onTM(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      const dx=t.clientX-joyStartX;
      const dy=t.clientY-joyStartY;
      const len=Math.sqrt(dx*dx+dy*dy);
      const clamped=Math.min(len,JOY_R);
      const angle=Math.atan2(dy,dx);
      joyDx=Math.cos(angle)*clamped/JOY_R;
      joyDy=Math.sin(angle)*clamped/JOY_R;
      const sx=Math.cos(angle)*clamped;
      const sy=Math.sin(angle)*clamped;
      joyStick.style.transform=`translate(${sx}px,${sy}px)`;
    }
    if(t.identifier===lookId){
      const dx=t.clientX-lookPrevX;
      const dy=t.clientY-lookPrevY;
      yaw   -= dx*0.0030;
      pitch -= dy*0.0028;
      pitch=Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
      lookPrevX=t.clientX; lookPrevY=t.clientY;
    }
  }
}
function onTE(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      joyId=null; joyActive=false; joyDx=0; joyDy=0;
      joyStick.style.transform='translate(0,0)';
    }
    if(t.identifier===lookId) lookId=null;
  }
}

// ===== プレイヤー =====
const SPEED=0.055;
const playerPos=new THREE.Vector3(0,1.65,0);

function updateMove(){
  if(!joyActive) return;
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const rgt=new THREE.Vector3( Math.cos(yaw),0,-Math.sin(yaw));
  playerPos.addScaledVector(fwd,-joyDy*SPEED);
  playerPos.addScaledVector(rgt, joyDx*SPEED);
  playerPos.x=Math.max(-90,Math.min(90,playerPos.x));
  playerPos.z=Math.max(-90,Math.min(90,playerPos.z));
}

// ===== アニメーションループ =====
let frame=0;
function animate(){
  requestAnimationFrame(animate);
  frame++;

  updateMove();

  camera.position.copy(playerPos);
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  // 蝋燭ライトをカメラと同期
  const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  candleLight.position.copy(camera.position);
  const tgt=camera.position.clone().addScaledVector(dir,6);
  candleLight.target.position.copy(tgt);
  candleLight.target.updateMatrixWorld();
  footLight.position.copy(camera.position);

  // ゆらぎ
  const flicker=0.95+Math.sin(frame*0.23)*0.04+Math.sin(frame*0.71)*0.03+(Math.random()-0.5)*0.05;
  if(candlePercent>0){
    const base=14*(candlePercent/100);
    candleLight.intensity=base*flicker;
    candleLight.distance=18+10*(candlePercent/100)+Math.random()*0.8;
    footLight.intensity=4*(candlePercent/100)*flicker;
  } else {
    candleLight.intensity=0;
    footLight.intensity=0;
  }

  // 蝋燭消費
  const now=Date.now();
  if(now-lastTick>TICK_MS && candlePercent>0){
    candlePercent-=1; lastTick=now;
    updateCandleUI();
    if(candlePercent<=0){
      candlePercent=0;
      darkOverlay.style.background='rgba(0,0,0,0.95)';
    } else if(candlePercent<=20){
      const a=0.18*(1-candlePercent/20);
      darkOverlay.style.background=`rgba(0,0,0,${a})`;
    }
  }

  // 赤キューブ回転（見えてる間）
  if(redCube.visible) redCube.rotation.y+=0.012;

  renderer.render(scene,camera);
}

animate();
updateCandleUI();

})();
</script>
</body>
</html>
