<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>忌夜ノ村（いみのむら） - 第1章：静寂の廃村</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  overflow:hidden; background:#050507;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#gameCanvas { display:block; width:100%; height:100%; touch-action:none; }

#vignette {
  position:fixed; inset:0;
  background:radial-gradient(ellipse at center,transparent 24%,rgba(0,0,0,0.62) 100%);
  pointer-events:none; z-index:5;
}
#darknessOverlay {
  position:fixed; inset:0; background:rgba(0,0,0,0);
  pointer-events:none; z-index:8; transition:background 1.2s ease;
}
#dangerVeil {
  position:fixed; inset:0; background:rgba(180,0,0,0);
  pointer-events:none; z-index:9; transition:background 0.25s ease;
}

#candleUI {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  font-family:'Georgia','Hiragino Mincho ProN',serif;
  font-size:20px; color:#ffe18b; letter-spacing:2px; white-space:nowrap;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 14px rgba(255,180,0,0.8);
  z-index:20; pointer-events:none;
}
#candleBar {
  position:fixed; top:48px; left:50%; transform:translateX(-50%);
  width:200px; height:7px; background:rgba(0,0,0,0.42);
  border:1px solid rgba(255,190,110,0.45); border-radius:4px;
  z-index:20; pointer-events:none; overflow:hidden;
}
#candleBarFill {
  height:100%; width:100%;
  background:linear-gradient(90deg,#ff6a00,#ffd65a);
  border-radius:4px; transition:width 0.35s ease;
  box-shadow:0 0 6px rgba(255,180,0,0.7);
}

#staminaUI {
  position:fixed; top:64px; left:50%; transform:translateX(-50%);
  font-family:'Georgia','Hiragino Mincho ProN',serif;
  font-size:16px; color:#a0e8ff; letter-spacing:2px; white-space:nowrap;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 10px rgba(80,200,255,0.7);
  z-index:20; pointer-events:none;
}
#staminaBar {
  position:fixed; top:86px; left:50%; transform:translateX(-50%);
  width:200px; height:6px; background:rgba(0,0,0,0.42);
  border:1px solid rgba(80,200,255,0.35); border-radius:4px;
  z-index:20; pointer-events:none; overflow:hidden;
}
#staminaBarFill {
  height:100%; width:100%;
  background:linear-gradient(90deg,#0077cc,#00e5ff);
  border-radius:4px; transition:width 0.1s ease;
  box-shadow:0 0 5px rgba(0,200,255,0.6);
}

#dashBtn {
  position:fixed; bottom:60px; right:60px;
  width:80px; height:80px; border-radius:50%;
  background:rgba(0,160,255,0.22);
  border:2px solid rgba(80,200,255,0.55);
  box-shadow:0 0 14px rgba(0,180,255,0.3);
  z-index:15; pointer-events:auto;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.1s, opacity 0.3s, transform 0.1s;
  touch-action:none;
}
#dashBtn .dashLabel {
  font-family:'Hiragino Mincho ProN',serif;
  font-size:15px; color:#aaeeff;
  text-shadow:0 0 6px #000,0 0 10px #000;
  letter-spacing:1px; pointer-events:none;
  line-height:1.25; text-align:center;
}
#dashBtn.pressing { background:rgba(0,200,255,0.42); box-shadow:0 0 22px rgba(0,220,255,0.65); }
#dashBtn.exhausted { background:rgba(60,60,80,0.3); border-color:rgba(120,120,160,0.3); opacity:0.55; }

#alertIndicator {
  position:fixed; top:110px; left:50%; transform:translateX(-50%);
  font-family:'Hiragino Mincho ProN',serif;
  font-size:14px; color:#ff4444; letter-spacing:3px;
  text-shadow:0 0 10px #ff0000, 0 0 4px #000;
  z-index:20; pointer-events:none; display:none; white-space:nowrap;
  animation:alertPulse 0.6s ease-in-out infinite;
}
@keyframes alertPulse { 0%,100%{opacity:0.6;} 50%{opacity:1.0;} }

#statusMsg {
  position:fixed; top:130px; left:50%; transform:translateX(-50%);
  font-family:monospace; font-size:12px; color:#c8ffd0;
  text-shadow:0 0 6px #000,0 0 10px #000;
  z-index:20; pointer-events:none; text-align:center; white-space:pre-wrap;
}
#promptMsg {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  font-family:'Hiragino Mincho ProN',serif;
  font-size:18px; color:#ffffff;
  padding:8px 14px; border-radius:999px;
  background:rgba(0,0,0,0.38);
  border:1px solid rgba(255,255,255,0.25);
  text-shadow:0 0 8px #000;
  z-index:21; pointer-events:none; display:none;
}
#smallHint {
  position:fixed; top:150px; left:50%; transform:translateX(-50%);
  font-family:'Hiragino Mincho ProN',serif;
  font-size:12px; color:#d7d7d7; letter-spacing:1px;
  text-shadow:0 0 8px #000;
  z-index:20; pointer-events:none; display:none;
}
#errorMsg {
  position:fixed; top:170px; left:50%; transform:translateX(-50%);
  font-family:monospace; font-size:11px; color:#ff6666;
  text-shadow:0 0 6px #000;
  z-index:20; pointer-events:none; display:none;
  text-align:center; white-space:pre-wrap;
}

#gameOverScreen {
  position:fixed; inset:0; display:none;
  z-index:120; align-items:center; justify-content:center;
  text-align:center; background:rgba(0,0,0,0.0); pointer-events:none;
}
#gameOverScreen.active {
  display:flex; animation:gameOverFlash 0.55s forwards;
}
@keyframes gameOverFlash {
  0%   { background:rgba(0,0,0,0); }
  14%  { background:rgba(90,0,0,0.86); }
  38%  { background:rgba(130,0,0,0.90); }
  70%  { background:rgba(70,0,0,0.92); }
  100% { background:rgba(0,0,0,0.94); }
}
#gameOverInner {
  display:flex; flex-direction:column; align-items:center; gap:16px;
  animation:gameOverTextIn 0.55s 0.12s both;
}
@keyframes gameOverTextIn { 0%{opacity:0;transform:scale(1.35);} 100%{opacity:1;transform:scale(1.0);} }
#gameOverTitle {
  font-family:'Hiragino Mincho ProN','Georgia',serif;
  font-size:clamp(32px,9vw,64px); color:#ffeaea;
  font-weight:900; letter-spacing:4px; line-height:1.25;
  text-shadow:
    0 0 10px #ff0000,
    0 0 24px #ff0000,
    0 0 46px rgba(255,0,0,0.75),
    3px 3px 0 #220000,
    -3px -3px 0 #220000;
}
#gameOverSub {
  font-family:'Hiragino Mincho ProN','Georgia',serif;
  font-size:clamp(18px,4vw,28px); color:#ff9a9a; letter-spacing:6px;
  text-shadow:0 0 12px rgba(255,0,0,0.8),0 0 4px #000;
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.7;} 50%{opacity:1.0;} }

#joystickBase {
  position:fixed; bottom:60px; left:60px;
  width:120px; height:120px; border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,210,140,0.28);
  z-index:15; pointer-events:none; transition:opacity 0.25s;
}
#joystickStick {
  position:fixed; bottom:95px; left:95px;
  width:50px; height:50px; border-radius:50%;
  background:rgba(245,200,66,0.45);
  border:2px solid rgba(245,200,66,0.7);
  box-shadow:0 0 10px rgba(255,180,0,0.42);
  z-index:16; pointer-events:none;
  transition:transform 0.03s, opacity 0.25s;
}

#jumpscareOverlay {
  position:fixed; inset:0; z-index:130; display:none; overflow:hidden;
  background:#000; pointer-events:none;
}
#jumpscareOverlay.active { display:block; }
#jumpscareOverlay .bg {
  position:absolute; inset:-8%;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,0,0,0.92) 0%, rgba(120,0,0,0.85) 26%, rgba(20,0,0,0.96) 58%, rgba(0,0,0,1) 100%);
  animation:scareBg 0.12s infinite alternate;
}
@keyframes scareBg {
  from { transform:scale(1.00); filter:brightness(1.0) contrast(1.1); }
  to   { transform:scale(1.03); filter:brightness(1.25) contrast(1.35); }
}
#jumpscareFace {
  position:absolute; left:50%; top:50%;
  width:86vw; height:86vh; transform:translate(-50%,-50%) scale(1.0);
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0 34%, rgba(0,0,0,0.98) 35% 100%);
  clip-path: polygon(15% 10%, 38% 0%, 62% 0%, 85% 10%, 95% 36%, 87% 65%, 67% 92%, 33% 92%, 13% 65%, 5% 36%);
  filter: drop-shadow(0 0 26px rgba(255,0,0,0.9)) drop-shadow(0 0 60px rgba(255,0,0,0.45));
  opacity:0.98;
  animation:faceLunge 0.17s infinite alternate;
}
@keyframes faceLunge {
  from { transform:translate(-50%,-50%) scale(1.0) rotate(-1deg); }
  to   { transform:translate(-50%,-50%) scale(1.04) rotate(1deg); }
}
#jumpscareFace::before,
#jumpscareFace::after {
  content:"";
  position:absolute;
  top:28%;
  width:17%;
  height:10%;
  background:rgba(255,255,255,0.94);
  filter:blur(0.4px);
  box-shadow:0 0 18px rgba(255,255,255,0.85), 0 0 30px rgba(255,0,0,0.55);
  clip-path: polygon(0 0, 100% 20%, 85% 100%, 10% 80%);
}
#jumpscareFace::before { left:22%; transform:rotate(-12deg); }
#jumpscareFace::after  { right:22%; transform:rotate(12deg); }
#jumpscareMouth {
  position:absolute; left:50%; top:60%;
  width:30%; height:16%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.92);
  clip-path: polygon(10% 10%, 90% 10%, 100% 60%, 75% 100%, 25% 100%, 0 60%);
  box-shadow:0 0 22px rgba(255,255,255,0.85), 0 0 40px rgba(255,0,0,0.65);
  animation:march 0.09s infinite alternate;
}
@keyframes march {
  from { transform:translateX(-50%) scale(1.0) rotate(0deg); }
  to   { transform:translateX(-50%) scale(1.04) rotate(2deg); }
}
#jumpscareOverlay.fadeOut .bg { animation:none; background:rgba(0,0,0,0.96); }
#jumpscareOverlay.fadeOut #jumpscareFace,
#jumpscareOverlay.fadeOut #jumpscareMouth {
  opacity:0.0;
  transition:opacity 0.25s ease;
}

#storyOverlay {
  position:fixed; inset:0;
  z-index:110;
  display:none;
  pointer-events:auto;
  touch-action:none;
  background:rgba(0,0,0,0.18);
}
#storyOverlay.active { display:block; }
#storyTopBand, #storyBottomBand {
  position:absolute; left:0; width:100%; height:18vh; background:#000;
}
#storyTopBand { top:0; }
#storyBottomBand { bottom:0; }
#storyPanel {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(900px, 92vw);
  padding:18px 18px 16px;
  background:rgba(10,10,10,0.7);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:16px;
  box-shadow:0 0 18px rgba(0,0,0,0.6);
  color:#f4f4f4;
  text-align:center;
}
#storyChapter {
  font-family:'Hiragino Mincho ProN',serif;
  font-size:clamp(18px,4vw,26px);
  letter-spacing:3px;
  color:#ffdddd;
  margin-bottom:12px;
  text-shadow:0 0 10px rgba(255,0,0,0.4);
}
#storyText {
  font-family:'Hiragino Mincho ProN',serif;
  font-size:clamp(15px,3.4vw,21px);
  line-height:1.9;
  white-space:pre-wrap;
  text-align:left;
  color:#f2f2f2;
  min-height:5.5em;
}
#storyFooter {
  margin-top:12px;
  font-family:monospace;
  font-size:12px;
  color:#cccccc;
  letter-spacing:1px;
  opacity:0.9;
}

#chapterToast {
  position:fixed; top:110px; left:50%; transform:translateX(-50%);
  z-index:22; pointer-events:none; display:none;
  font-family:'Hiragino Mincho ProN',serif;
  font-size:14px; color:#ffe7a9; letter-spacing:2px;
  text-shadow:0 0 10px rgba(0,0,0,0.8), 0 0 14px rgba(255,170,0,0.4);
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="vignette"></div>
<div id="darknessOverlay"></div>
<div id="dangerVeil"></div>

<div id="candleUI">🕯 和蝋燭の残り火：<span id="candlePercent">100</span>%</div>
<div id="candleBar"><div id="candleBarFill"></div></div>

<div id="staminaUI">🏃 スタミナ：<span id="staminaPct">100</span>%</div>
<div id="staminaBar"><div id="staminaBarFill"></div></div>

<div id="alertIndicator">⚠ 八尺様に発見された…</div>
<div id="statusMsg"></div>
<div id="promptMsg">【画面をタップ】して地蔵に火を灯す</div>
<div id="smallHint">まだ上に行くべきではない…</div>
<div id="errorMsg"></div>
<div id="chapterToast"></div>

<div id="gameOverScreen">
  <div id="gameOverInner">
    <div id="gameOverTitle">生贄に捧げられた…</div>
    <div id="gameOverSub">GAME OVER</div>
  </div>
</div>

<div id="storyOverlay">
  <div id="storyTopBand"></div>
  <div id="storyBottomBand"></div>
  <div id="storyPanel">
    <div id="storyChapter">第1章：静寂の廃村</div>
    <div id="storyText"></div>
    <div id="storyFooter">タップで次へ</div>
  </div>
</div>

<div id="jumpscareOverlay">
  <div class="bg"></div>
  <div id="jumpscareFace"><div id="jumpscareMouth"></div></div>
</div>

<div id="joystickBase"></div>
<div id="joystickStick"></div>
<div id="dashBtn"><div class="dashLabel">走る</div></div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x0b0b10, 1);
renderer.sortObjects = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0d12);
scene.fog = new THREE.FogExp2(0x111218, 0.022);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 180);
camera.position.set(0, 1.65, 0);
camera.rotation.order = 'YXZ';

const clock = new THREE.Clock();
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const $ = id => document.getElementById(id);

const ui = {
  candlePct: $('candlePercent'),
  candleBar: $('candleBarFill'),
  staminaPct: $('staminaPct'),
  staminaBar: $('staminaBarFill'),
  darkOverlay: $('darknessOverlay'),
  dangerVeil: $('dangerVeil'),
  alert: $('alertIndicator'),
  status: $('statusMsg'),
  prompt: $('promptMsg'),
  smallHint: $('smallHint'),
  error: $('errorMsg'),
  gameOver: $('gameOverScreen'),
  story: $('storyOverlay'),
  storyText: $('storyText'),
  toast: $('chapterToast'),
  joyBase: $('joystickBase'),
  joyStick: $('joystickStick'),
  dashBtn: $('dashBtn'),
  jumpscare: $('jumpscareOverlay'),
};

function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }
function dist2D(ax, az, bx, bz){ const dx = ax - bx, dz = az - bz; return Math.sqrt(dx*dx + dz*dz); }
function randRange(a, b){ return a + Math.random() * (b - a); }
function randomPointInRange(r){ return { x:(Math.random()-0.5)*r, z:(Math.random()-0.5)*r }; }

function optimizeImportedRoot(root, opts = {}) {
  const { darken = 1, allowTransparent = false, forceFrontSide = true } = opts;
  root.traverse(child => {
    if (!child.isMesh) return;
    child.castShadow = false;
    child.receiveShadow = false;
    child.frustumCulled = true;
    if (child.geometry && !child.geometry.boundingSphere) child.geometry.computeBoundingSphere();

    const mats = Array.isArray(child.material) ? child.material : [child.material];
    mats.forEach(m => {
      if (!m) return;
      if (m.color && darken !== 1) m.color.multiplyScalar(darken);
      if (forceFrontSide) m.side = THREE.FrontSide;
      m.fog = true;
      m.depthTest = true;
      m.depthWrite = true;
      if (!allowTransparent && m.transparent && (m.opacity === undefined || m.opacity >= 0.999) && !m.alphaMap) {
        m.transparent = false;
        m.opacity = 1;
      }
      if (m.map) m.map.anisotropy = Math.min(2, renderer.capabilities.getMaxAnisotropy());
      m.needsUpdate = true;
    });
  });
}

function cloneUniqueMaterials(root) {
  root.traverse(child => {
    if (!child.isMesh) return;
    if (child.material) {
      child.material = Array.isArray(child.material) ? child.material.map(m => m.clone()) : child.material.clone();
    }
  });
}

function pointToSegmentData(x, z, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az;
  const len2 = vx*vx + vz*vz;
  if (len2 < 1e-8) return null;
  const t = ((x - ax) * vx + (z - az) * vz) / len2;
  const px = ax + vx * t, pz = az + vz * t;
  const dist = Math.sqrt((x - px) ** 2 + (z - pz) ** 2);
  return { t, px, pz, dist };
}
function pointInRect(x, z, cx, cz, w, d){
  return Math.abs(x - cx) <= w * 0.5 && Math.abs(z - cz) <= d * 0.5;
}
function smoothStep(t){ return t*t*(3 - 2*t); }

/* ===================================================================
   2階層マップ（完全固定）
=================================================================== */
const MAP = {
  groundY: 0,
  platformY: 4,
  platform: { cx: 0, cz: -70, w: 62, d: 24 },      // 高台の床メッシュは1つだけ
  stair: { x: 0, zStart: -48, zEnd: -58, w: 8, steps: 8 }, // ground -> platform edge
};

function getSurfaceHeight(x, z) {
  if (Math.abs(x - MAP.stair.x) <= MAP.stair.w * 0.5 && z <= MAP.stair.zStart && z >= MAP.stair.zEnd) {
    const t = (MAP.stair.zStart - z) / (MAP.stair.zStart - MAP.stair.zEnd);
    const step = Math.max(0, Math.min(MAP.stair.steps - 1, Math.floor(t * MAP.stair.steps)));
    return ((step + 1) / MAP.stair.steps) * MAP.platformY;
  }
  if (pointInRect(x, z, MAP.platform.cx, MAP.platform.cz, MAP.platform.w, MAP.platform.d)) {
    return MAP.platformY;
  }
  return MAP.groundY;
}
function isOnPlatform(x, z){ return pointInRect(x, z, MAP.platform.cx, MAP.platform.cz, MAP.platform.w, MAP.platform.d); }
function isOnStairCorridor(x, z){ return Math.abs(x - MAP.stair.x) <= MAP.stair.w * 0.5 && z <= MAP.stair.zStart && z >= MAP.stair.zEnd; }

/* ===================================================================
   Scene / lights
=================================================================== */
const sceneRoot = new THREE.Group();
scene.add(sceneRoot);

const ambLight = new THREE.AmbientLight(0x8080a0, 0.55);
scene.add(ambLight);
const hemi = new THREE.HemisphereLight(0x8d8fa7, 0x35353d, 0.40);
scene.add(hemi);
const moonLight = new THREE.DirectionalLight(0x9090c0, 0.18);
moonLight.position.set(30, 60, -40);
scene.add(moonLight);

const candleLight = new THREE.SpotLight(0xffb15a, 8.5, 18, Math.PI/6, 0.45, 1.8);
scene.add(candleLight, candleLight.target);
const footLight = new THREE.PointLight(0xff7a18, 2.0, 5.0);
scene.add(footLight);

/* ===================================================================
   Ground / plateau / roads
=================================================================== */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(360, 360, 1, 1),
  new THREE.MeshLambertMaterial({ color:0x18181c })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const platformMesh = new THREE.Mesh(
  new THREE.BoxGeometry(MAP.platform.w, MAP.platformY, MAP.platform.d),
  new THREE.MeshLambertMaterial({ color:0x2a2a30 })
);
platformMesh.position.set(MAP.platform.cx, MAP.platformY * 0.5, MAP.platform.cz);
scene.add(platformMesh);

const roadMat = new THREE.MeshLambertMaterial({ color:0x1e1e20 });
function addRoad(x, z, w, d, y = 0) {
  const geo = new THREE.PlaneGeometry(w, d, 1, 1);
  geo.rotateX(-Math.PI / 2);
  const m = new THREE.Mesh(geo, roadMat);
  m.position.set(x, y + 0.012, z);
  scene.add(m);
}
addRoad(0, 0, 7, 160, 0);
addRoad(0, -70, 42, 4, 4); // plateau road

/* ===================================================================
   Collision system (Box3 only)
=================================================================== */
const collisions = []; // { box: Box3, active: boolean }
const obstaclesLOS = []; // representative meshes for raycast only
const tmpBox = new THREE.Box3();
const playerBox = new THREE.Box3();
const PLAYER_BOX_HALF = 0.38;

function addCollisionBox(box, active = true) {
  const entry = { box: box.clone(), active };
  collisions.push(entry);
  return entry;
}
function addStaticBox(cx, cy, cz, hw, hh, hd, active = true) {
  return addCollisionBox(
    new THREE.Box3(
      new THREE.Vector3(cx - hw, cy - hh, cz - hd),

function placeOnSurface(object3D, x, z, surfaceY, ry = 0, scale = 1) {
  object3D.scale.setScalar(scale);
  object3D.rotation.y = ry;
  object3D.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(object3D);
  object3D.position.set(x, surfaceY - box.min.y, z);
  object3D.updateMatrixWorld(true);
  return new THREE.Box3().setFromObject(object3D);
}
function centerScaleToHeight(object3D, targetHeight) {
  object3D.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(object3D);
  const size = new THREE.Vector3();
  box.getSize(size);
  const s = size.y > 0.01 ? targetHeight / size.y : 1;
  object3D.scale.setScalar(s);
  object3D.updateMatrixWorld(true);
  return s;
}

const jizoList = [];
const JIZO_COUNT = 3;
const JIZO_SAFE_RADIUS = 4.0;
const JIZO_PROMPT_RADIUS = 3.0;

function createJizo(x, z) {
  const grp = new THREE.Group();
  const bMat = new THREE.MeshLambertMaterial({ color:0xf0f0f0, emissive:0x101010, emissiveIntensity:0.18 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.5, 0.8), bMat);
  body.position.y = 0.75; grp.add(body);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.12 }));
  halo.position.y = 1.45; grp.add(halo);
  const light = new THREE.PointLight(0xff9800, 0, 7, 2);
  light.position.y = 1.55; grp.add(light);

  const jy = getSurfaceHeight(x, z);
  grp.position.set(x, jy, z);
  scene.add(grp);
  const j = { group:grp, light, lit:false, x, z };
  jizoList.push(j);
  return j;
}
function placeJizoRandomly() {
  for (let i = 0; i < JIZO_COUNT; i++) {
    let p, tries = 0;
    do { p = randomPointInRange(65); tries++; }
    while ((Math.abs(p.x) < 10 && Math.abs(p.z) < 10) || isOnPlatform(p.x,p.z) || isOnStairCorridor(p.x,p.z) || tries < 1 && false || tries < 250 && false);
    // strong safety: avoid stairs/platform and central road
    while ((isOnPlatform(p.x,p.z) || isOnStairCorridor(p.x,p.z) || (Math.abs(p.x) < 8 && Math.abs(p.z) < 8)) && tries < 250) {
      p = randomPointInRange(65);
      tries++;
    }
    createJizo(p.x, p.z);
  }
}
function igniteJizo(jizo) {
  if (!jizo || jizo.lit) return;
  jizo.lit = true;
  jizo.light.intensity = 1.8;
  jizo.light.color.setHex(0xffa040);
  const hm = jizo.group.children.find(c => c.isMesh && c.geometry && c.geometry.type === 'SphereGeometry');
  if (hm && hm.material) hm.material.opacity = 0.26;
}
function getNearestJizoInPromptRange() {
  let best = null, bestDist = Infinity;
  for (const j of jizoList) {
    if (j.lit) continue;
    const d = dist2D(playerPos.x, playerPos.z, j.x, j.z);
    if (d <= JIZO_PROMPT_RADIUS && d < bestDist) { best = j; bestDist = d; }
  }
  return best;
}
function getLitJizoRepulsion(pos) {
  let px = 0, pz = 0;
  for (const j of jizoList) {
    if (!j.lit) continue;
    const dx = pos.x - j.x, dz = pos.z - j.z;
    const d = Math.sqrt(dx*dx + dz*dz);
    if (d < JIZO_SAFE_RADIUS) {
      const sd = Math.max(d, 0.0001), ov = JIZO_SAFE_RADIUS - sd + 0.15;
      px += (dx / sd) * ov;
      pz += (dz / sd) * ov;
    }
  }
  return { x:px, z:pz };
}
function isPointInsideAnySafeZone(x, z) {
  for (const j of jizoList) {
    if (!j.lit) continue;
    if (dist2D(x, z, j.x, j.z) <= JIZO_SAFE_RADIUS) return true;
  }
  return false;
}

function playChapterBoom() {
  ensureAudioContext();
  if (!audioCtx) return;

  const now = audioCtx.currentTime;
  const noiseDur = 0.65;
  const len = Math.floor(audioCtx.sampleRate * noiseDur);
  const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const fade = 1 - (i / len);
    data[i] = (Math.random() * 2 - 1) * fade * 0.75;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;

  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 180;
  bp.Q.value = 0.8;

  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(1.0, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, now + noiseDur);

  noise.connect(bp);
  bp.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();

  const osc = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(62, now);
  osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
  og.gain.setValueAtTime(0.001, now);
  og.gain.exponentialRampToValueAtTime(0.55, now + 0.02);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
  osc.connect(og);
  og.connect(audioCtx.destination);
  osc.start();
  osc.stop(now + 0.6);

  chapterState.boomUntil = performance.now() + 800;
  if (navigator.vibrate) navigator.vibrate([120, 60, 180]);
  ui.dangerVeil.style.background = 'rgba(255,0,0,0.16)';
  setTimeout(() => { if (!chapterState.storyOpen && !gameOverActive) ui.dangerVeil.style.background = 'rgba(0,0,0,0)'; }, 700);
}

function updateEnemyAI(deltaMs) {
  if (!hachishaku || game.state !== 'playing' || chapterState.storyOpen) return;

  const ex = hachishaku.position.x;
  const ez = hachishaku.position.z;
  const enemyPos3D = new THREE.Vector3(ex, 0, ez);
  const distToPlayer = dist2D(ex, ez, playerPos.x, playerPos.z);
  const canSee = (distToPlayer < DETECT_RADIUS) && hasLineOfSight(enemyPos3D, playerPos);

  if (distToPlayer < 1.8) {
    triggerJumpScare();
    return;
  }

  if (enemyState === 'wander') {
    if (canSee) {
      enemyState = 'chase';
      losTimer = 0;
      lastKnownPlayerPos = playerPos.clone();
    }
  } else if (enemyState === 'chase') {
    if (canSee) {
      losTimer = 0;
      lastKnownPlayerPos = playerPos.clone();
    } else {
      losTimer += deltaMs;
      if (losTimer >= LOS_LOSE_TIME) {
        enemyState = 'wander';
        losTimer = 0;
        lastKnownPlayerPos = null;
        setEnemyTargetAvoidingSafeZone();
      }
    }
  }

  if (enemyState === 'chase') {
    ui.alert.style.display = 'block';
    const veilAlpha = clamp((DETECT_RADIUS - distToPlayer) / DETECT_RADIUS * 0.3, 0, 0.22);
    ui.dangerVeil.style.background = `rgba(180,0,0,${veilAlpha})`;
  } else {
    ui.alert.style.display = 'none';
    ui.dangerVeil.style.background = 'rgba(0,0,0,0)';
  }

  const push = getLitJizoRepulsion(hachishaku.position);

  if (enemyState === 'chase') {
    const chaseTarget = canSee
      ? { x:playerPos.x, z:playerPos.z }
      : (lastKnownPlayerPos ? { x:lastKnownPlayerPos.x, z:lastKnownPlayerPos.z } : null);

    if (chaseTarget) {
      faceEnemyToward(chaseTarget.x, chaseTarget.z);
      const dx = chaseTarget.x - ex, dz = chaseTarget.z - ez;
      const d = Math.sqrt(dx*dx + dz*dz);
      if (d > 0.01) {
        const nx = dx / d, nz = dz / d;
        const nextX = ex + nx * ENEMY_SPEED - push.x;
        const nextZ = ez + nz * ENEMY_SPEED - push.z;
        if (!isPointInsideAnySafeZone(nextX, nextZ)) {
          hachishaku.position.x = nextX;
          hachishaku.position.z = nextZ;
        } else {
          setEnemyTargetAvoidingSafeZone();
          enemyState = 'wander';
          losTimer = 0;
        }
      }
    }
  } else {
    if (!enemyTarget) setEnemyTargetAvoidingSafeZone();
    const dx = enemyTarget.x - ex, dz = enemyTarget.z - ez;
    const dist = Math.sqrt(dx*dx + dz*dz);

    if (push.x !== 0 || push.z !== 0) {
      hachishaku.position.x -= push.x;
      hachishaku.position.z -= push.z;
      setEnemyTargetAvoidingSafeZone();
    } else if (dist < 0.9) {
      setEnemyTargetAvoidingSafeZone();
    } else {
      const nx = dx / Math.max(dist, 0.0001), nz = dz / Math.max(dist, 0.0001);
      const nextX = ex + nx * ENEMY_WANDER_SPEED;
      const nextZ = ez + nz * ENEMY_WANDER_SPEED;
      if (!isPointInsideAnySafeZone(nextX, nextZ)) {
        hachishaku.position.x = nextX;
        hachishaku.position.z = nextZ;
        faceEnemyToward(enemyTarget.x, enemyTarget.z);
      } else {
        setEnemyTargetAvoidingSafeZone();
      }
    }
  }

  hachishaku.position.y = getSurfaceHeight(hachishaku.position.x, hachishaku.position.z) + Math.sin(performance.now() * 0.004) * 0.015;
}

let joyId = null, joyActive = false, joyDx = 0, joyDy = 0, joyStartX = 0, joyStartY = 0;
let lookId = null, lookPrevX = 0, lookPrevY = 0;
let yaw = 0, pitch = 0;
const touchStartMeta = new Map();
const JOY_R = 60;

function ensureAudioContext() {
  try {
    if (!window.audioCtx) window.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  } catch (_) {}
}
const audioCtx = (() => {
  try { return new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { return null; }
})();

function playJumpNoise() {
  try {
    ensureAudioContext();
    if (!audioCtx) return;

    const duration = 0.9;
    const len = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const fade = 1 - (i / len);
      data[i] = (Math.random() * 2 - 1) * fade;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = buffer;

    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 620;

    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 7200;

    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -28;
    comp.knee.value = 20;
    comp.ratio.value = 20;
    comp.attack.value = 0.001;
    comp.release.value = 0.08;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(1.2, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.7, audioCtx.currentTime + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

    src.connect(hp);
    hp.connect(lp);
    lp.connect(comp);
    comp.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();

    if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 180]);
  } catch (_) {}
}

function onTS(e) {
  e.preventDefault();
  ensureAudioContext();
  if (game.inputLocked || game.state !== 'playing') return;

  for (const t of e.changedTouches) {
    touchStartMeta.set(t.identifier, { x:t.clientX, y:t.clientY, time:Date.now() });
    const isLeft = t.clientX < window.innerWidth / 2;
    if (isLeft && joyId === null) {
      joyId = t.identifier; joyActive = true; joyStartX = t.clientX; joyStartY = t.clientY; joyDx = 0; joyDy = 0;
    } else if (!isLeft && lookId === null) {
      lookId = t.identifier; lookPrevX = t.clientX; lookPrevY = t.clientY;
    }
  }
}
function onTM(e) {
  e.preventDefault();
  if (game.inputLocked || game.state !== 'playing') return;

  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      const dx = t.clientX - joyStartX;
      const dy = t.clientY - joyStartY;
      const len = Math.sqrt(dx*dx + dy*dy);
      const cl = Math.min(len, JOY_R);
      const a = Math.atan2(dy, dx);
      joyDx = Math.cos(a) * cl / JOY_R;
      joyDy = Math.sin(a) * cl / JOY_R;
      ui.joyStick.style.transform = `translate(${Math.cos(a)*cl}px,${Math.sin(a)*cl}px)`;
    }
    if (t.identifier === lookId) {
      const dx = t.clientX - lookPrevX;
      const dy = t.clientY - lookPrevY;
      yaw -= dx * 0.0030;
      pitch -= dy * 0.0028;
      pitch = clamp(pitch, -Math.PI / 2.2, Math.PI / 2.2);
      lookPrevX = t.clientX;
      lookPrevY = t.clientY;
    }
  }
}

function tryIgniteJizoByTap(t) {
  if (game.inputLocked || game.state !== 'playing') return;
  const meta = touchStartMeta.get(t.identifier);
  if (!meta) return;
  if (Date.now() - meta.time > 350 || Math.hypot(t.clientX - meta.x, t.clientY - meta.y) > 24) return;
  const n = getNearestJizoInPromptRange();
  if (n) {
    igniteJizo(n);
    ui.prompt.style.display = 'none';
    touchStartMeta.delete(t.identifier);
    return;
  }
  const note = getNearestNoteInRange();
  if (note) {
    openNoteStory(note);
  }
  touchStartMeta.delete(t.identifier);
}
function onTE(e) {
  e.preventDefault();
  if (chapterState.storyOpen) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyId = null; joyActive = false; joyDx = 0; joyDy = 0;
      ui.joyStick.style.transform = 'translate(0,0)';
    }
    if (t.identifier === lookId) lookId = null;
    tryIgniteJizoByTap(t);
    touchStartMeta.delete(t.identifier);
  }
}

const playerPos = new THREE.Vector3(0, 1.65, 0);

function updateMove() {
  if (game.state !== 'playing' || game.inputLocked) return;

  if (isDashing && !dashExhausted) {
    stamina = Math.max(0, stamina - STAMINA_DRAIN);
    if (stamina <= 0) { stamina = 0; dashExhausted = true; isDashing = false; }
  } else {
    if (dashExhausted) {
      stamina = Math.min(100, stamina + STAMINA_RECOVER * 0.6);
      if (stamina >= 30) dashExhausted = false;
    } else {
      stamina = Math.min(100, stamina + STAMINA_RECOVER);
    }
  }

  if (ui.staminaPct) {
    const v = Math.max(0, Math.round(stamina));
    ui.staminaPct.textContent = v;
    ui.staminaBar.style.width = v + '%';
    const g1 = Math.floor(160 * (v / 100));
    ui.staminaBar.style.background = `linear-gradient(90deg,rgb(0,${g1},200),rgb(0,220,255))`;
    if (dashExhausted) {
      ui.dashBtn.classList.add('exhausted');
      ui.dashBtn.classList.remove('pressing');
    } else if (isDashing) {
      ui.dashBtn.classList.add('pressing');
      ui.dashBtn.classList.remove('exhausted');
    } else {
      ui.dashBtn.classList.remove('pressing', 'exhausted');
    }
  }

  if (!joyActive) return;

  const spd = (isDashing && !dashExhausted) ? SPEED_DASH : SPEED_WALK;
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const rgt = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));

  let nx = playerPos.x - joyDy * spd * fwd.x + joyDx * spd * rgt.x;
  let nz = playerPos.z - joyDy * spd * fwd.z + joyDx * spd * rgt.z;

  nx = clamp(nx, -81, 81);
  nz = clamp(nz, -81, 81);

  const th = getSurfaceHeight(nx, nz);
  const ny = th + playerEyeH;

  if (!checkPlayerCollision(nx, nz, ny)) {
    playerPos.x = nx;
    playerPos.z = nz;
  } else {
    // slide X
    const xOnly = playerPos.x - joyDy * spd * fwd.x + joyDx * spd * rgt.x;
    const zOnly = playerPos.z;
    if (!checkPlayerCollision(xOnly, zOnly, getSurfaceHeight(xOnly, zOnly) + playerEyeH)) {
      playerPos.x = xOnly;
    } else {
      const xOnly2 = playerPos.x;
      const zOnly2 = playerPos.z - joyDy * spd * fwd.z + joyDx * spd * rgt.z;
      if (!checkPlayerCollision(xOnly2, zOnly2, getSurfaceHeight(xOnly2, zOnly2) + playerEyeH)) {
        playerPos.z = zOnly2;
      }
    }
  }

  const newTerrainY = getSurfaceHeight(playerPos.x, playerPos.z) + playerEyeH;
  targetPlayerY = newTerrainY;
  playerPos.y += (targetPlayerY - playerPos.y) * 0.22;
}

  }

  const jizo = getNearestJizoInPromptRange();
  if (jizo) {
    ui.prompt.textContent = '【地蔵】を灯す';
    ui.prompt.style.display = 'block';
    ui.smallHint.style.display = 'none';
    return;
  }

  ui.prompt.style.display = 'none';
  if (!chapterState.chapter1Cleared && dist2D(playerPos.x, playerPos.z, stairTrigger.x, stairTrigger.z) < 5.5) {
    ui.smallHint.textContent = 'まだ上に行くべきではない…';
    ui.smallHint.style.display = 'block';
  } else {
    ui.smallHint.style.display = 'none';
  }
}

/* ===================================================================
   Story overlay interactions
=================================================================== */
function closeStoryIfAny() {
  if (!chapterState.storyOpen) return;
  chapterState.storyOpen = false;
  ui.story.classList.remove('active');
  playChapterBoom();
  chapterState.chapter1Cleared = true;
  removeBarrier();
  showToast('第1章クリア：階段が開放された');
  lockPlayerInput(false);
  ui.smallHint.style.display = 'none';
  setTimeout(() => { if (!chapterState.enemySpawned) spawnEnemy(); }, 1400);
}
ui.story.addEventListener('touchstart', e => { e.preventDefault(); ensureAudioContext(); }, { passive:false });
ui.story.addEventListener('touchend', e => {
  e.preventDefault();
  if (!chapterState.storyOpen) return;
  storyIndex++;
  if (storyIndex < chapterPages.length) {
    ui.storyText.textContent = chapterPages[storyIndex];
  } else {
    closeStoryIfAny();
  }
}, { passive:false });
ui.story.addEventListener('click', () => {
  if (!chapterState.storyOpen) return;
  storyIndex++;
  if (storyIndex < chapterPages.length) ui.storyText.textContent = chapterPages[storyIndex];
  else closeStoryIfAny();
});

/* ===================================================================
   Note opening
=================================================================== */
function openNoteStory(info) {
  if (!info || info.noteUsed || chapterState.storyOpen || chapterState.chapter1Cleared) return;
  info.noteUsed = true;
  chapterState.noteRead = true;
  if (info.noteGroup) info.noteGroup.visible = false;
  lockPlayerInput(true);
  ui.prompt.style.display = 'none';
  ui.smallHint.style.display = 'none';
  chapterState.storyOpen = true;
  ui.storyText.textContent = chapterPages[0];
  ui.story.classList.add('active');
}

/* ===================================================================
   Chapter boom / shake
=================================================================== */
function playChapterBoom() {
  ensureAudioContext();
  if (!audioCtx) return;

  const now = audioCtx.currentTime;
  const noiseDur = 0.65;
  const len = Math.floor(audioCtx.sampleRate * noiseDur);
  const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < len; i++) {
    const fade = 1 - (i / len);
    data[i] = (Math.random() * 2 - 1) * fade * 0.75;
  }

  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const bp = audioCtx.createBiquadFilter();
  bp.type = 'bandpass';
  bp.frequency.value = 180;
  bp.Q.value = 0.8;
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.001, now);
  gain.gain.exponentialRampToValueAtTime(1.0, now + 0.02);
  gain.gain.exponentialRampToValueAtTime(0.001, now + noiseDur);
  noise.connect(bp);
  bp.connect(gain);
  gain.connect(audioCtx.destination);
  noise.start();

  const osc = audioCtx.createOscillator();
  const og = audioCtx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(62, now);
  osc.frequency.exponentialRampToValueAtTime(30, now + 0.35);
  og.gain.setValueAtTime(0.001, now);
  og.gain.exponentialRampToValueAtTime(0.55, now + 0.02);
  og.gain.exponentialRampToValueAtTime(0.001, now + 0.55);
  osc.connect(og);
  og.connect(audioCtx.destination);
  osc.start();
  osc.stop(now + 0.6);

  chapterState.boomUntil = performance.now() + 800;
  if (navigator.vibrate) navigator.vibrate([120, 60, 180]);
}
function playToast(text) {
  ui.toast.textContent = text;
  ui.toast.style.display = 'block';
  setTimeout(() => { ui.toast.style.display = 'none'; }, 2200);
}

/* ===================================================================
   Load enemy (kept hidden until Chapter 1 cleared)
=================================================================== */
function loadEnemyTemplate() {
  const loader = new THREE.FBXLoader();
  loader.load('./popopo.fbx', fbx => {
    optimizeImportedRoot(fbx, { darken:0.28, allowTransparent:true, forceFrontSide:true });
    enemyTemplate = fbx;
  }, null, () => {
    enemyTemplate = null;
  });
}
loadEnemyTemplate();

/* ===================================================================
   Game loop
=================================================================== */
let frame = 0;
function animate() {
  if (!game.running) return;
  requestAnimationFrame(animate);
  frame++;

  const delta = clock.getDelta();
  if (enemyMixer) enemyMixer.update(delta);

  if (game.state === 'playing') {
    updateMove();
    updateEnemyAI(delta * 1000);
    updatePrompts();
  }

  camera.position.copy(playerPos);

  // Chapter boom shake
  if (performance.now() < chapterState.boomUntil) {
    const life = (chapterState.boomUntil - performance.now()) / 800;
    const amp = 0.10 * life;
    camera.position.x += (Math.random() - 0.5) * amp;
    camera.position.y += (Math.random() - 0.5) * amp;
    camera.position.z += (Math.random() - 0.5) * amp;
    camera.rotation.z = (Math.random() - 0.5) * amp * 0.5;
  } else if (game.state !== 'jumpscare') {
    camera.rotation.z = 0;
  }

  if (game.state === 'jumpscare') {
    const t = performance.now();
    const amp = 0.18;
    camera.position.x += (Math.sin(t * 0.08) + (Math.random() - 0.5) * 1.4) * amp;
    camera.position.y += (Math.cos(t * 0.09) + (Math.random() - 0.5) * 1.2) * amp;
    camera.position.z += (Math.sin(t * 0.11) + (Math.random() - 0.5) * 1.2) * amp * 0.35;
    camera.rotation.z = Math.sin(t * 0.06) * amp * 0.45;
  }

  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const dir = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  candleLight.position.copy(camera.position);
  candleLight.target.position.copy(camera.position.clone().addScaledVector(dir, 6));
  candleLight.target.updateMatrixWorld();
  footLight.position.copy(camera.position);

  const flicker = 0.9 + Math.sin(frame * 0.23) * 0.06 + Math.sin(frame * 0.71) * 0.04 + (Math.random() - 0.5) * 0.08;
  if (candlePercent > 0) {
    candleLight.intensity = 8.5 * (candlePercent / 100) * flicker;
    candleLight.distance  = 12 + 8 * (candlePercent / 100) + Math.random() * 0.8;
    footLight.intensity   = 2.0 * (candlePercent / 100) * flicker;
  } else {
    candleLight.intensity = 0;
    footLight.intensity = 0;
  }

  const now = Date.now();
  if (game.state === 'playing' && now - lastTick > TICK_MS && candlePercent > 0) {
    candlePercent--;
    lastTick = now;
    ui.candlePct.textContent = Math.max(0, Math.ceil(candlePercent));
    ui.candleBar.style.width = Math.max(0, Math.ceil(candlePercent)) + '%';
    const v = Math.max(0, Math.ceil(candlePercent));
    const r = Math.floor(180 + 75 * (1 - v / 100));
    const g = Math.floor(190 * (v / 100));
    ui.candleBar.style.background = `linear-gradient(90deg,rgb(${r},40,0),rgb(${r},${g},30))`;
    if (candlePercent <= 0) {
      candlePercent = 0;
      ui.darkOverlay.style.background = 'rgba(0,0,0,0.95)';
    } else if (candlePercent <= 20) {
      ui.darkOverlay.style.background = `rgba(0,0,0,${0.35 * (1 - candlePercent / 20)})`;
    }
  }

  renderer.render(scene, camera);
}

function updateHudFromState() {
  const v = Math.max(0, Math.round(stamina));
  ui.staminaPct.textContent = v;
  ui.staminaBar.style.width = v + '%';
  const g1 = Math.floor(160 * (v / 100));
  ui.staminaBar.style.background = `linear-gradient(90deg,rgb(0,${g1},200),rgb(0,220,255))`;
}

function init() {
  ui.candlePct.textContent = '100';
  ui.candleBar.style.width = '100%';
  ui.staminaPct.textContent = '100';
  ui.staminaBar.style.width = '100%';
  showControls();
  lockPlayerInput(false);
  ui.storyText.textContent = chapterPages[0];
  animate();
  updateHudFromState();
}
init();

/* ===================================================================
   Jumpscare / note / story click handling
=================================================================== */
function showChapterReadyToast() {
  ui.chapterToast.textContent = '第1章：静寂の廃村';
  ui.chapterToast.style.display = 'block';
  setTimeout(() => { ui.chapterToast.style.display = 'none'; }, 1500);
}
showChapterReadyToast();

/* keep note visibility coherent */
setInterval(() => {
  if (chapterState.noteRead) updateNoteVisibilityAfterRead();
}, 1000);

function updateNoteVisibilityAfterRead() {
  for (const info of houseInfos) {
    if (info.noteGroup && info.noteUsed) info.noteGroup.visible = false;
  }
}

/* global touch end route for note interactions */
document.addEventListener('touchend', e => {
  if (chapterState.storyOpen || game.inputLocked || game.state !== 'playing') return;
  for (const t of e.changedTouches) {
    if (touchStartMeta.has(t.identifier)) {
      tryIgniteJizoByTap(t);
      const note = getNearestNoteInRange();
      if (note) openNoteStory(note);
    }
  }
}, { passive:true });

/* safety: keep texts correct after resize / moves */
setInterval(() => {
  if (game.state !== 'playing') return;
  updatePrompts();
  updateHudFromState();
}, 250);

})();
</script>
