<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>夜の村 - 和風ホラー</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  overflow:hidden; background:#050507;
  touch-action:none; user-select:none; -webkit-user-select:none;
}
#gameCanvas { display:block; width:100%; height:100%; touch-action:none; }

#vignette {
  position:fixed; inset:0;
  background:radial-gradient(ellipse at center,transparent 24%,rgba(0,0,0,0.62) 100%);
  pointer-events:none; z-index:5;
}
#darknessOverlay {
  position:fixed; inset:0; background:rgba(0,0,0,0);
  pointer-events:none; z-index:8; transition:background 1.2s ease;
}
#dangerVeil {
  position:fixed; inset:0; background:rgba(180,0,0,0);
  pointer-events:none; z-index:9; transition:background 0.25s ease;
}

/* 蝋燭UI */
#candleUI {
  position:fixed; top:20px; left:50%; transform:translateX(-50%);
  font-family:'Georgia','Hiragino Mincho ProN',serif;
  font-size:20px; color:#ffe18b; letter-spacing:2px; white-space:nowrap;
  text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 14px rgba(255,180,0,0.8);
  z-index:20; pointer-events:none;
}
#candleBar {
  position:fixed; top:48px; left:50%; transform:translateX(-50%);
  width:200px; height:7px; background:rgba(0,0,0,0.42);
  border:1px solid rgba(255,190,110,0.45); border-radius:4px;
  z-index:20; pointer-events:none; overflow:hidden;
}
#candleBarFill {
  height:100%; width:100%;
  background:linear-gradient(90deg,#ff6a00,#ffd65a);
  border-radius:4px; transition:width 0.35s ease;
  box-shadow:0 0 6px rgba(255,180,0,0.7);
}

/* スタミナUI */
#staminaUI {
  position:fixed; top:64px; left:50%; transform:translateX(-50%);
  font-family:'Georgia','Hiragino Mincho ProN',serif;
  font-size:16px; color:#a0e8ff; letter-spacing:2px; white-space:nowrap;
  text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 10px rgba(80,200,255,0.7);
  z-index:20; pointer-events:none;
}
#staminaBar {
  position:fixed; top:86px; left:50%; transform:translateX(-50%);
  width:200px; height:6px; background:rgba(0,0,0,0.42);
  border:1px solid rgba(80,200,255,0.35); border-radius:4px;
  z-index:20; pointer-events:none; overflow:hidden;
}
#staminaBarFill {
  height:100%; width:100%;
  background:linear-gradient(90deg,#0077cc,#00e5ff);
  border-radius:4px; transition:width 0.1s ease;
  box-shadow:0 0 5px rgba(0,200,255,0.6);
}

/* 走るボタン */
#dashBtn {
  position:fixed; bottom:60px; right:60px;
  width:80px; height:80px; border-radius:50%;
  background:rgba(0,160,255,0.22);
  border:2px solid rgba(80,200,255,0.55);
  box-shadow:0 0 14px rgba(0,180,255,0.3);
  z-index:15; pointer-events:auto;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.1s, opacity 0.3s, transform 0.1s;
  touch-action:none;
}
#dashBtn .dashLabel {
  font-family:'Hiragino Mincho ProN',serif;
  font-size:15px; color:#aaeeff;
  text-shadow:0 0 6px #000,0 0 10px #000;
  letter-spacing:1px; pointer-events:none;
  line-height:1.25; text-align:center;
}
#dashBtn.pressing { background:rgba(0,200,255,0.42); box-shadow:0 0 22px rgba(0,220,255,0.65); }
#dashBtn.exhausted { background:rgba(60,60,80,0.3); border-color:rgba(120,120,160,0.3); opacity:0.55; }

/* 警告 */
#alertIndicator {
  position:fixed; top:110px; left:50%; transform:translateX(-50%);
  font-family:'Hiragino Mincho ProN',serif;
  font-size:14px; color:#ff4444; letter-spacing:3px;
  text-shadow:0 0 10px #ff0000, 0 0 4px #000;
  z-index:20; pointer-events:none; display:none; white-space:nowrap;
  animation:alertPulse 0.6s ease-in-out infinite;
}
@keyframes alertPulse { 0%,100%{opacity:0.6;} 50%{opacity:1.0;} }

#statusMsg {
  position:fixed; top:130px; left:50%; transform:translateX(-50%);
  font-family:monospace; font-size:12px; color:#c8ffd0;
  text-shadow:0 0 6px #000,0 0 10px #000;
  z-index:20; pointer-events:none; text-align:center; white-space:pre-wrap;
}
#promptMsg {
  position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
  font-family:'Hiragino Mincho ProN',serif;
  font-size:18px; color:#ffffff;
  padding:8px 14px; border-radius:999px;
  background:rgba(0,0,0,0.38);
  border:1px solid rgba(255,255,255,0.25);
  text-shadow:0 0 8px #000;
  z-index:21; pointer-events:none; display:none;
}
#errorMsg {
  position:fixed; top:148px; left:50%; transform:translateX(-50%);
  font-family:monospace; font-size:11px; color:#ff6666;
  text-shadow:0 0 6px #000;
  z-index:20; pointer-events:none; display:none;
  text-align:center; white-space:pre-wrap;
}

/* ゲームオーバー */
#gameOverScreen {
  position:fixed; inset:0; display:none;
  z-index:100; align-items:center; justify-content:center;
  text-align:center; background:rgba(0,0,0,0.0); pointer-events:none;
}
#gameOverScreen.active {
  display:flex; animation:gameOverFlash 0.55s forwards;
}
@keyframes gameOverFlash {
  0%   { background:rgba(0,0,0,0); }
  14%  { background:rgba(90,0,0,0.86); }
  38%  { background:rgba(130,0,0,0.90); }
  70%  { background:rgba(70,0,0,0.92); }
  100% { background:rgba(0,0,0,0.94); }
}
#gameOverInner {
  display:flex; flex-direction:column; align-items:center; gap:16px;
  animation:gameOverTextIn 0.55s 0.12s both;
}
@keyframes gameOverTextIn { 0%{opacity:0;transform:scale(1.35);} 100%{opacity:1;transform:scale(1.0);} }
#gameOverTitle {
  font-family:'Hiragino Mincho ProN','Georgia',serif;
  font-size:clamp(32px,9vw,64px); color:#ffeaea;
  font-weight:900; letter-spacing:4px; line-height:1.25;
  text-shadow:
    0 0 10px #ff0000,
    0 0 24px #ff0000,
    0 0 46px rgba(255,0,0,0.75),
    3px 3px 0 #220000,
    -3px -3px 0 #220000;
}
#gameOverSub {
  font-family:'Hiragino Mincho ProN','Georgia',serif;
  font-size:clamp(18px,4vw,28px); color:#ff9a9a; letter-spacing:6px;
  text-shadow:0 0 12px rgba(255,0,0,0.8),0 0 4px #000;
  animation:pulse 1.1s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:0.7;} 50%{opacity:1.0;} }

/* ジョイスティック */
#joystickBase {
  position:fixed; bottom:60px; left:60px;
  width:120px; height:120px; border-radius:50%;
  background:rgba(255,255,255,0.08);
  border:2px solid rgba(255,210,140,0.28);
  z-index:15; pointer-events:none; transition:opacity 0.25s;
}
#joystickStick {
  position:fixed; bottom:95px; left:95px;
  width:50px; height:50px; border-radius:50%;
  background:rgba(245,200,66,0.45);
  border:2px solid rgba(245,200,66,0.7);
  box-shadow:0 0 10px rgba(255,180,0,0.42);
  z-index:16; pointer-events:none;
  transition:transform 0.03s, opacity 0.25s;
}

/* ジャンプスケア */
#jumpscareOverlay {
  position:fixed; inset:0; z-index:120; display:none; overflow:hidden;
  background:#000;
  pointer-events:none;
}
#jumpscareOverlay.active { display:block; }
#jumpscareOverlay .bg {
  position:absolute; inset:-8%;
  background:
    radial-gradient(circle at 50% 40%, rgba(255,0,0,0.92) 0%, rgba(120,0,0,0.85) 26%, rgba(20,0,0,0.96) 58%, rgba(0,0,0,1) 100%);
  animation:scareBg 0.12s infinite alternate;
}
@keyframes scareBg {
  from { transform:scale(1.00); filter:brightness(1.0) contrast(1.1); }
  to   { transform:scale(1.03); filter:brightness(1.25) contrast(1.35); }
}
#jumpscareFace {
  position:absolute; left:50%; top:50%;
  width:86vw; height:86vh; transform:translate(-50%,-50%) scale(1.0);
  background:
    radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 0 34%, rgba(0,0,0,0.98) 35% 100%);
  clip-path: polygon(15% 10%, 38% 0%, 62% 0%, 85% 10%, 95% 36%, 87% 65%, 67% 92%, 33% 92%, 13% 65%, 5% 36%);
  filter: drop-shadow(0 0 26px rgba(255,0,0,0.9)) drop-shadow(0 0 60px rgba(255,0,0,0.45));
  opacity:0.98;
  animation:faceLunge 0.17s infinite alternate;
}
@keyframes faceLunge {
  from { transform:translate(-50%,-50%) scale(1.0) rotate(-1deg); }
  to   { transform:translate(-50%,-50%) scale(1.04) rotate(1deg); }
}
#jumpscareFace::before,
#jumpscareFace::after {
  content:"";
  position:absolute;
  top:28%;
  width:17%;
  height:10%;
  background:rgba(255,255,255,0.94);
  filter:blur(0.4px);
  box-shadow:0 0 18px rgba(255,255,255,0.85), 0 0 30px rgba(255,0,0,0.55);
  clip-path: polygon(0 0, 100% 20%, 85% 100%, 10% 80%);
}
#jumpscareFace::before { left:22%; transform:rotate(-12deg); }
#jumpscareFace::after  { right:22%; transform:rotate(12deg); }
#jumpscareMouth {
  position:absolute; left:50%; top:60%;
  width:30%; height:16%;
  transform:translateX(-50%);
  background:rgba(255,255,255,0.92);
  clip-path: polygon(10% 10%, 90% 10%, 100% 60%, 75% 100%, 25% 100%, 0 60%);
  box-shadow:0 0 22px rgba(255,255,255,0.85), 0 0 40px rgba(255,0,0,0.65);
  animation:march 0.09s infinite alternate;
}
@keyframes march {
  from { transform:translateX(-50%) scale(1.0) rotate(0deg); }
  to   { transform:translateX(-50%) scale(1.04) rotate(2deg); }
}
#jumpscareOverlay.fadeOut .bg { animation:none; background:rgba(0,0,0,0.96); }
#jumpscareOverlay.fadeOut #jumpscareFace,
#jumpscareOverlay.fadeOut #jumpscareMouth {
  opacity:0.0;
  transition:opacity 0.25s ease;
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="vignette"></div>
<div id="darknessOverlay"></div>
<div id="dangerVeil"></div>

<div id="candleUI">🕯 和蝋燭の残り火：<span id="candlePercent">100</span>%</div>
<div id="candleBar"><div id="candleBarFill"></div></div>

<div id="staminaUI">🏃 スタミナ：<span id="staminaPct">100</span>%</div>
<div id="staminaBar"><div id="staminaBarFill"></div></div>

<div id="alertIndicator">⚠ 八尺様に発見された…</div>
<div id="statusMsg"></div>
<div id="promptMsg">【画面をタップ】して地蔵に火を灯す</div>
<div id="errorMsg"></div>

<div id="gameOverScreen">
  <div id="gameOverInner">
    <div id="gameOverTitle">生贄に捧げられた…</div>
    <div id="gameOverSub">GAME OVER</div>
  </div>
</div>

<div id="jumpscareOverlay">
  <div class="bg"></div>
  <div id="jumpscareFace">
    <div id="jumpscareMouth"></div>
  </div>
</div>

<div id="joystickBase"></div>
<div id="joystickStick"></div>
<div id="dashBtn"><div class="dashLabel">走る</div></div>

<script>
(() => {
'use strict';

const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.25));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = false;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x0b0b10, 1);
renderer.sortObjects = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0d12);
scene.fog = new THREE.FogExp2(0x111218, 0.022);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 180);
camera.position.set(0, 2.5, 0);
camera.rotation.order = 'YXZ';

const clock = new THREE.Clock();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function dist2D(ax, az, bx, bz) { const dx = ax - bx, dz = az - bz; return Math.sqrt(dx*dx + dz*dz); }
function randRange(a, b) { return a + Math.random() * (b - a); }
function randomPointInRange(r) { return { x:(Math.random()-0.5)*r, z:(Math.random()-0.5)*r }; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function smoothStep(t) { return t*t*(3-2*t); }

function optimizeImportedRoot(root, opts = {}) {
  const {
    darken = 1,
    allowTransparent = false,
    forceFrontSide = true,
  } = opts;

  root.traverse(child => {
    if (!child.isMesh) return;

    child.castShadow = false;
    child.receiveShadow = false;
    child.frustumCulled = true;
    if (child.geometry && !child.geometry.boundingSphere) {
      child.geometry.computeBoundingSphere();
    }

    const mats = Array.isArray(child.material) ? child.material : [child.material];
    mats.forEach(m => {
      if (!m) return;
      if (m.color && darken !== 1) m.color.multiplyScalar(darken);
      if (forceFrontSide) m.side = THREE.FrontSide;
      m.fog = true;
      m.depthTest = true;
      m.depthWrite = true;

      if (!allowTransparent && m.transparent && (m.opacity === undefined || m.opacity >= 0.999) && !m.alphaMap) {
        m.transparent = false;
        m.opacity = 1;
      }

      if (m.map) {
        m.map.anisotropy = Math.min(2, renderer.capabilities.getMaxAnisotropy());
        m.map.generateMipmaps = true;
      }
      m.needsUpdate = true;
    });
  });
}

function cloneUniqueMaterials(root) {
  root.traverse(child => {
    if (!child.isMesh) return;
    if (child.material) {
      if (Array.isArray(child.material)) child.material = child.material.map(m => m.clone());
      else child.material = child.material.clone();
    }
    child.castShadow = false;
    child.receiveShadow = false;
  });
}

function pointInRect(x, z, cx, cz, w, d) {
  return Math.abs(x - cx) <= w * 0.5 && Math.abs(z - cz) <= d * 0.5;
}
function pointToSegmentData(x, z, ax, az, bx, bz) {
  const vx = bx - ax, vz = bz - az;
  const len2 = vx*vx + vz*vz;
  if (len2 < 1e-8) return null;
  const t = ((x - ax) * vx + (z - az) * vz) / len2;
  const px = ax + vx * t;
  const pz = az + vz * t;
  const dist = Math.sqrt((x - px) ** 2 + (z - pz) ** 2);
  return { t, px, pz, dist, vx, vz, len2 };
}

/* =========================================================
   2階層マップ設定
========================================================= */
const GROUND_Y = 0;
const PLATFORM = {
  cx: 0,
  cz: -48,
  w: 78,
  d: 36,
  topY: 4,
  h: 4
};
const STAIRS = {
  x: 0,
  startZ: -18,
  endZ: -30,
  width: 6.2,
  steps: 12,
  topY: 4,
};
const ROAD = {
  x: 0,
  w: 8,
  zStart: -80,
  zEnd: 80
};

function isInStairCorridor(x, z) {
  return Math.abs(x - STAIRS.x) <= STAIRS.width * 0.5 && z <= STAIRS.startZ && z >= STAIRS.endZ;
}
function isOnPlatformTop(x, z) {
  return Math.abs(x - PLATFORM.cx) <= PLATFORM.w * 0.5 && z < STAIRS.endZ && z >= PLATFORM.cz - PLATFORM.d * 0.5;
}
function getFloorHeight(x, z) {
  if (isInStairCorridor(x, z)) {
    const t = clamp((STAIRS.startZ - z) / (STAIRS.startZ - STAIRS.endZ), 0, 1);
    return STAIRS.topY * smoothStep(t);
  }
  if (isOnPlatformTop(x, z)) return PLATFORM.topY;
  return GROUND_Y;
}
function getFloorLayer(x, z) {
  if (isInStairCorridor(x, z)) return 'stair';
  if (isOnPlatformTop(x, z)) return 'platform';
  return 'ground';
}

/* =========================================================
   scene / lighting
========================================================= */
const groundMat = new THREE.MeshLambertMaterial({ color:0x18181c });
const ground = new THREE.Mesh(new THREE.PlaneGeometry(360, 360, 1, 1), groundMat);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

const ambLight = new THREE.AmbientLight(0x8080a0, 0.55);
scene.add(ambLight);
const hemi = new THREE.HemisphereLight(0x8d8fa7, 0x35353d, 0.40);
scene.add(hemi);
const moonLight = new THREE.DirectionalLight(0x9090c0, 0.18);
moonLight.position.set(30, 60, -40);
scene.add(moonLight);

const candleLight = new THREE.SpotLight(0xffb15a, 8.5, 18, Math.PI/6, 0.45, 1.8);
scene.add(candleLight, candleLight.target);
const footLight = new THREE.PointLight(0xff7a18, 2.0, 5.0);
scene.add(footLight);

const roadMat = new THREE.MeshLambertMaterial({ color:0x1e1e20 });
function addRoad(x, z, w, d) {
  const geo = new THREE.PlaneGeometry(w, d, 1, 1);
  geo.rotateX(-Math.PI / 2);
  const cy = getFloorHeight(x, z) + 0.012;
  const m = new THREE.Mesh(geo, roadMat);
  m.position.set(x, cy, z);
  scene.add(m);
}
addRoad(ROAD.x, 0, ROAD.w, ROAD.zEnd - ROAD.zStart + 10);

/* =========================================================
   collisions
========================================================= */
const collisionBoxes = [];
const obstacleMeshes = [];
const playerBox = new THREE.Box3();
const PLAYER_BOX_HALF = 0.38;

function registerStaticBox(cx, cy, cz, hw, hh, hd) {
  collisionBoxes.push(
    new THREE.Box3(
      new THREE.Vector3(cx - hw, cy - hh, cz - hd),
      new THREE.Vector3(cx + hw, cy + hh, cz + hd)
    )
  );
}
function checkBoxCollisionAt(x, z, y, half = PLAYER_BOX_HALF, yLow = 1.0, yHigh = 0.5) {
  playerBox.set(
    new THREE.Vector3(x - half, y - yLow, z - half),
    new THREE.Vector3(x + half, y + yHigh, z + half)
  );
  for (const box of collisionBoxes) {
    if (playerBox.intersectsBox(box)) return true;
  }
  return false;
}
function tryMoveWithSlide(currentPos, nextX, nextZ, floorY, half = PLAYER_BOX_HALF) {
  if (!checkBoxCollisionAt(nextX, nextZ, floorY, half)) {
    currentPos.x = nextX;
    currentPos.z = nextZ;
    return true;
  }
  const onlyX = !checkBoxCollisionAt(nextX, currentPos.z, getFloorHeight(nextX, currentPos.z) + PLAYER_EYE_H, half);
  if (onlyX) {
    currentPos.x = nextX;
    return true;
  }
  const onlyZ = !checkBoxCollisionAt(currentPos.x, nextZ, getFloorHeight(currentPos.x, nextZ) + PLAYER_EYE_H, half);
  if (onlyZ) {
    currentPos.z = nextZ;
    return true;
  }
  return false;
}

/* =========================================================
   platform / stair visuals
========================================================= */
function buildPlatform() {
  const platformMesh = new THREE.Mesh(
    new THREE.BoxGeometry(PLATFORM.w, PLATFORM.h, PLATFORM.d),
    new THREE.MeshLambertMaterial({ color:0x27272c })
  );
  platformMesh.position.set(PLATFORM.cx, PLATFORM.h * 0.5, PLATFORM.cz);
  scene.add(platformMesh);
  obstacleMeshes.push(platformMesh);

  registerStaticBox(
    PLATFORM.cx,
    PLATFORM.h * 0.5,
    PLATFORM.cz - 0.4,
    PLATFORM.w * 0.5,
    PLATFORM.h * 0.5,
    PLATFORM.d * 0.5 - 0.4
  );
}
buildPlatform();

function buildStairs() {
  const stairsGroup = new THREE.Group();
  const stepW = STAIRS.width;
  const stepD = (STAIRS.startZ - STAIRS.endZ) / STAIRS.steps;
  const stepH = STAIRS.topY / STAIRS.steps;

  for (let i = 0; i < STAIRS.steps; i++) {
    const y = (i + 0.5) * stepH;
    const z = STAIRS.startZ - (i + 0.5) * stepD;
    const step = new THREE.Mesh(
      new THREE.BoxGeometry(stepW, stepH, stepD),
      new THREE.MeshLambertMaterial({ color:0x453e35 })
    );
    step.position.set(STAIRS.x, y, z);
    stairsGroup.add(step);
  }
  scene.add(stairsGroup);
}
buildStairs();

/* =========================================================
   strict structure props
========================================================= */
function makeHouseSlots() {
  const slots = [];

  for (let z = -72; z <= 72; z += 12) {
    if (Math.abs(z) < 8) continue;
    slots.push({ x:-15, z, ry:Math.PI/2, area:'ground' });
    slots.push({ x: 15, z, ry:-Math.PI/2, area:'ground' });
  }

  for (let z = -60; z <= -36; z += 12) {
    slots.push({ x:-28, z, ry:Math.PI/2, area:'platform' });
    slots.push({ x: 28, z, ry:-Math.PI/2, area:'platform' });
  }

  slots.push({ x:-20, z:-58, ry:0, area:'platform' });
  slots.push({ x:  0, z:-58, ry:0, area:'platform' });
  slots.push({ x: 20, z:-58, ry:0, area:'platform' });

  return slots;
}

function placeModelOnFloor(template, x, z, ry, targetHeight, options = {}) {
  const obj = template.clone(true);
  cloneUniqueMaterials(obj);
  obj.scale.setScalar(1);
  obj.rotation.y = ry || 0;
  obj.updateMatrixWorld(true);

  const box0 = new THREE.Box3().setFromObject(obj);
  const size0 = new THREE.Vector3();
  box0.getSize(size0);

  let scale = 1;
  if (targetHeight && size0.y > 0.01) scale = targetHeight / size0.y;
  if (options.maxWidth && size0.x > 0.01) scale = Math.min(scale, options.maxWidth / size0.x);
  if (options.maxDepth && size0.z > 0.01) scale = Math.min(scale, options.maxDepth / size0.z);

  obj.scale.setScalar(scale);
  obj.rotation.y = ry || 0;
  obj.updateMatrixWorld(true);

  const box1 = new THREE.Box3().setFromObject(obj);
  const y = getFloorHeight(x, z) - box1.min.y + (options.yOffset || 0);
  obj.position.set(x, y, z);
  obj.updateMatrixWorld(true);

  if (options.darken !== undefined && options.darken !== 1) {
    obj.traverse(child => {
      if (!child.isMesh || !child.material) return;
      const mats = Array.isArray(child.material) ? child.material : [child.material];
      mats.forEach(m => { if (m.color) m.color.multiplyScalar(options.darken); });
    });
  }

  return { obj, scale };
}

const jizoList = [];
const JIZO_COUNT = 3, JIZO_SAFE_RADIUS = 4.0, JIZO_PROMPT_RADIUS = 3.0;

function isPointReserved(x, z) {
  if (Math.abs(x) < 6.5) return true; // main road
  if (isOnPlatformTop(x, z) || isInStairCorridor(x, z)) return true;
  return false;
}
function createJizo(x, z) {
  const grp = new THREE.Group();
  const bMat = new THREE.MeshLambertMaterial({ color:0xf0f0f0, emissive:0x101010, emissiveIntensity:0.18 });
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.5, 0.8), bMat);
  body.position.y = 0.75; grp.add(body);
  const halo = new THREE.Mesh(new THREE.SphereGeometry(0.24, 12, 12), new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, opacity:0.12 }));
  halo.position.y = 1.45; grp.add(halo);
  const light = new THREE.PointLight(0xff9800, 0, 7, 2);
  light.position.y = 1.55; grp.add(light);
  const jy = getFloorHeight(x, z);
  grp.position.set(x, jy, z);
  scene.add(grp);
  const j = { group:grp, light, lit:false, x, z };
  jizoList.push(j);
  return j;
}
function placeJizoRandomly() {
  for (let i = 0; i < JIZO_COUNT; i++) {
    let p, tries = 0;
    do { p = randomPointInRange(65); tries++; }
    while (isPointReserved(p.x, p.z) && tries < 250);
    createJizo(p.x, p.z);
  }
}
placeJizoRandomly();

const playerPos = new THREE.Vector3(0, getFloorHeight(0,0) + 1.65, 0);

function getNearestJizoInPromptRange() {
  let best = null, bestDist = Infinity;
  for (const j of jizoList) {
    if (j.lit) continue;
    const d = dist2D(playerPos.x, playerPos.z, j.x, j.z);
    if (d <= JIZO_PROMPT_RADIUS && d < bestDist) { best = j; bestDist = d; }
  }
  return best;
}
function igniteJizo(jizo) {
  if (!jizo || jizo.lit) return;
  jizo.lit = true;
  jizo.light.intensity = 1.8;
  jizo.light.color.setHex(0xffa040);
  const hm = jizo.group.children.find(c => c.isMesh && c.geometry && c.geometry.type === 'SphereGeometry');
  if (hm && hm.material) hm.material.opacity = 0.26;
}
function updateJizoPrompt() {
  const n = getNearestJizoInPromptRange();
  if (n && game.state === 'playing') promptMsg.style.display = 'block';
  else promptMsg.style.display = 'none';
}
function getLitJizoRepulsion(pos) {
  let px = 0, pz = 0;
  for (const j of jizoList) {
    if (!j.lit) continue;
    const dx = pos.x - j.x, dz = pos.z - j.z;
    const d = Math.sqrt(dx*dx + dz*dz);
    if (d < JIZO_SAFE_RADIUS) {
      const sd = Math.max(d, 0.0001), ov = JIZO_SAFE_RADIUS - sd + 0.15;
      px += (dx / sd) * ov;
      pz += (dz / sd) * ov;
    }
  }
  return { x:px, z:pz };
}
function isPointInsideAnySafeZone(x, z) {
  for (const j of jizoList) {
    if (!j.lit) continue;
    if (dist2D(x, z, j.x, j.z) <= JIZO_SAFE_RADIUS) return true;
  }
  return false;
}

let hachishaku = null;
let enemyTarget = null;
let enemyState = 'wander';
let losTimer = 0;
const LOS_LOSE_TIME = 3000;
let lastKnownPlayerPos = null;
const raycaster = new THREE.Raycaster();
const ENEMY_VISUAL_YAW_OFFSET = -Math.PI / 2;
const ENEMY_SPEED = 0.05 * 1.2;
const ENEMY_WANDER_SPEED = 0.016 * 1.2;

function buildFallbackEnemy() {

  const aGeo = new THREE.CylinderGeometry(0.12, 0.14, 1.9, 6);
  const aL = new THREE.Mesh(aGeo, mat); aL.position.set(-0.95,2.6,0); aL.rotation.z=0.7; grp.add(aL);
  const aR = new THREE.Mesh(aGeo, mat); aR.position.set(0.95,2.6,0); aR.rotation.z=-0.7; grp.add(aR);
  const lGeo = new THREE.CylinderGeometry(0.15, 0.18, 1.7, 6);

  const lR = new THREE.Mesh(lGeo, mat); lR.position.set(0.26,0.9,0); grp.add(lR);
  return grp;
}
function setEnemyTargetAvoidingSafeZone() {
  let p, tries = 0;
  do { p = randomPointInRange(130); tries++; }
  while ((isPointReserved(p.x, p.z) || isInStairCorridor(p.x, p.z) || isOnPlatformTop(p.x, p.z)) && tries < 120);
  enemyTarget = p;
}
function hasLineOfSight(enemyPos, playerPos3D) {
  if (obstacleMeshes.length === 0) return true;
  const eyePos = enemyPos.clone(); eyePos.y += 2.2;
  const targetPos = playerPos3D.clone(); targetPos.y += 1.0;
  const dir = new THREE.Vector3().subVectors(targetPos, eyePos).normalize();
  const dist = eyePos.distanceTo(targetPos);
  raycaster.set(eyePos, dir);
  raycaster.far = dist - 0.3;
  const hits = raycaster.intersectObjects(obstacleMeshes, true);
  return hits.length === 0;
}
function faceEnemyToward(tx, tz) {
  if (!hachishaku) return;
  const dx = tx - hachishaku.position.x;
  const dz = tz - hachishaku.position.z;
  hachishaku.rotation.set(0, Math.atan2(dx, dz), 0);
}
function ensureHachishaku() {
  if (hachishaku) return;
  hachishaku = new THREE.Group();
  const visualRoot = new THREE.Group();
  visualRoot.rotation.y = ENEMY_VISUAL_YAW_OFFSET;
  visualRoot.add(buildFallbackEnemy());
  hachishaku.add(visualRoot);
  hachishaku.position.set(18, getFloorHeight(18,18), 18);
  scene.add(hachishaku);
  setEnemyTargetAvoidingSafeZone();
}

}
function chooseEnemyTarget() {
  const pFloor = getFloorHeight(playerPos.x, playerPos.z);
  const eFloor = getFloorHeight(hachishaku.position.x, hachishaku.position.z);

  if (pFloor > eFloor + 0.5) {
    return { x: STAIRS.x, z: STAIRS.startZ + 0.6 };
  }
  if (eFloor > pFloor + 0.5) {
    return { x: STAIRS.x, z: STAIRS.endZ - 0.6 };
  }
  return { x: playerPos.x, z: playerPos.z };
}
function updateEnemyAI(deltaMs) {
  if (!hachishaku || game.state !== 'playing') return;

  const ex = hachishaku.position.x;
  const ez = hachishaku.position.z;
  const enemyPos3D = new THREE.Vector3(ex, 0, ez);
  const distToPlayer = dist2D(ex, ez, playerPos.x, playerPos.z);

  if (distToPlayer < 1.8) {
    triggerJumpScare();
    return;
  }

  const pFloor = getFloorHeight(playerPos.x, playerPos.z);
  const eFloor = getFloorHeight(ex, ez);
  const sameLayer = Math.abs(pFloor - eFloor) < 0.35;
  const canSee = (distToPlayer < DETECT_RADIUS) && (sameLayer ? hasLineOfSight(enemyPos3D, playerPos) : true);

  if (enemyState === 'wander') {
    if (canSee) {
      enemyState = 'chase';
      losTimer = 0;
      lastKnownPlayerPos = playerPos.clone();
    }
  } else if (enemyState === 'chase') {
    if (canSee) {
      losTimer = 0;
      lastKnownPlayerPos = playerPos.clone();
    } else {
      losTimer += deltaMs;
      if (losTimer >= LOS_LOSE_TIME) {
        enemyState = 'wander';
        losTimer = 0;
        lastKnownPlayerPos = null;
        setEnemyTargetAvoidingSafeZone();
      }
    }
  }

  if (enemyState === 'chase') {
    alertIndicator.style.display = 'block';
    const veilAlpha = Math.max(0, Math.min(0.22, (DETECT_RADIUS - distToPlayer) / DETECT_RADIUS * 0.3));
    dangerVeil.style.background = `rgba(180,0,0,${veilAlpha})`;
  } else {
    alertIndicator.style.display = 'none';
    dangerVeil.style.background = 'rgba(0,0,0,0)';
  }

  const push = getLitJizoRepulsion(hachishaku.position);

  let target;
  if (enemyState === 'chase') {
    target = chooseEnemyTarget();
    if (!canSee && lastKnownPlayerPos) target = { x:lastKnownPlayerPos.x, z:lastKnownPlayerPos.z };
  } else {
    if (!enemyTarget) setEnemyTargetAvoidingSafeZone();
    target = enemyTarget;
  }

  faceEnemyToward(target.x, target.z);

  const dx = target.x - ex;
  const dz = target.z - ez;
  const d = Math.sqrt(dx*dx + dz*dz);

  if (d > 0.01) {
    const nx = dx / d, nz = dz / d;
    const speed = enemyState === 'chase' ? ENEMY_SPEED : ENEMY_WANDER_SPEED;
    const nextX = ex + nx * speed - push.x;
    const nextZ = ez + nz * speed - push.z;

    if (enemyState === 'wander' && (push.x !== 0 || push.z !== 0)) {
      hachishaku.position.x -= push.x;
      hachishaku.position.z -= push.z;
      setEnemyTargetAvoidingSafeZone();
    } else {
      hachishaku.position.x = nextX;
      hachishaku.position.z = nextZ;
    }
  } else if (enemyState === 'wander') {
    setEnemyTargetAvoidingSafeZone();
  }

  const floorY = getFloorHeight(hachishaku.position.x, hachishaku.position.z);
  hachishaku.position.y = floorY + Math.sin(performance.now() * 0.004) * 0.015;
}

function placeHousesAlongRoads(template) {
  const slots = HOUSE_SLOTS.slice();
  let placed = 0;
  const TARGET_GROUND_H = 4.6;
  const TARGET_PLATFORM_H = 4.2;

  for (const slot of slots) {
    const x = slot.x, z = slot.z, ry = slot.ry;
    if (isPointReserved(x, z)) continue;

    const targetH = slot.area === 'platform' ? TARGET_PLATFORM_H : TARGET_GROUND_H;
    const house = placeModelOnFloor(template, x, z, ry, targetH, {
      darken: 0.55,
      maxWidth: slot.area === 'platform' ? 7.5 : 6.6,
      maxDepth: slot.area === 'platform' ? 7.5 : 6.6
    });

    house.obj.traverse(child => {
      if (child.isMesh && child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m => { if (m.color) m.color.multiplyScalar(0.95); });
      }
    });

    scene.add(house.obj);
    const box = new THREE.Box3().setFromObject(house.obj);
    box.expandByScalar(-0.12);
    collisionBoxes.push(box);
    obstacleMeshes.push(house.obj);
    placed++;
  }
  return placed;
}

function placeFallbackHouses() {
  let placed = 0;
  for (const slot of HOUSE_SLOTS) {
    if (isPointReserved(slot.x, slot.z)) continue;
    placeFallbackHouse(slot.x, slot.z, slot.ry, slot.area);
    placed++;
  }
  return placed;
}

function placeGaitouLights(template) {
  const box = new THREE.Box3().setFromObject(template);
  const size = new THREE.Vector3();
  box.getSize(size);
  const TARGET_H = 3.5;
  const LIGHT_EVERY = 4;
  let idx = 0;

  for (const slot of LANTERN_SLOTS) {
    const lamp = placeModelOnFloor(template, slot.x, slot.z, slot.ry, TARGET_H, {
      darken: 0.58,
      maxWidth: 1.6,
      maxDepth: 1.6
    });

    optimizeImportedRoot(lamp.obj, {
      darken: 0.58,
      allowTransparent: true,
      forceFrontSide: true
    });

    scene.add(lamp.obj);

    if (idx % LIGHT_EVERY === 0) {
      const pl = new THREE.PointLight(0xff8800, 0.95, 8, 2);
      pl.position.set(slot.x, getFloorHeight(slot.x, slot.z) + (size.y * lamp.scale) * 0.98, slot.z);
      scene.add(pl);
    }

    registerStaticBox(slot.x, getFloorHeight(slot.x, slot.z) + 1.5, slot.z, 0.18, 1.7, 0.18);
    collisionBoxes.push(new THREE.Box3(
      new THREE.Vector3(slot.x - 0.18, getFloorHeight(slot.x, slot.z), slot.z - 0.18),
      new THREE.Vector3(slot.x + 0.18, getFloorHeight(slot.x, slot.z) + 3.5, slot.z + 0.18)
    ));
    obstacleMeshes.push(lamp.obj);
    idx++;
  }
}

let audioCtx = null;
function ensureAudioContext() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  } catch (_) {}
}
document.addEventListener('touchstart', ensureAudioContext, { passive:true });
document.addEventListener('pointerdown', ensureAudioContext, { passive:true });

function playJumpNoise() {
  try {
    ensureAudioContext();
    if (!audioCtx) return;

    const duration = 0.9;
    const len = Math.floor(audioCtx.sampleRate * duration);
    const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const fade = 1 - (i / len);
      data[i] = (Math.random() * 2 - 1) * fade;
    }

    const src = audioCtx.createBufferSource();
    src.buffer = buffer;

    const hp = audioCtx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 620;

    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 7200;

    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value = -28;
    comp.knee.value = 20;
    comp.ratio.value = 20;
    comp.attack.value = 0.001;
    comp.release.value = 0.08;

    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(1.2, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.7, audioCtx.currentTime + 0.08);
    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);

    src.connect(hp);
    hp.connect(lp);
    lp.connect(comp);
    comp.connect(gain);
    gain.connect(audioCtx.destination);
    src.start();

    if (navigator.vibrate) navigator.vibrate([80, 40, 80, 40, 180]);
  } catch (_) {}
}

function hideControls() {
  joystickBase.style.display = 'none';
  joystickStick.style.display = 'none';

function setTouchUIVisible(v) {

function getNearestJizoInPromptRange() {
  let best = null, bestDist = Infinity;
  for (const j of jizoList) {
    if (j.lit) continue;
    const d = dist2D(playerPos.x, playerPos.z, j.x, j.z);
    if (d <= JIZO_PROMPT_RADIUS && d < bestDist) { best = j; bestDist = d; }
  }
  return best;
}
function igniteJizo(jizo) {
  if (!jizo || jizo.lit) return;
  jizo.lit = true;
  jizo.light.intensity = 1.8;
  jizo.light.color.setHex(0xffa040);
  const hm = jizo.group.children.find(c => c.isMesh && c.geometry && c.geometry.type === 'SphereGeometry');
  if (hm && hm.material) hm.material.opacity = 0.26;
}
function updateJizoPrompt() {
  const n = getNearestJizoInPromptRange();
  if (n && game.state === 'playing') promptMsg.style.display = 'block';
  else promptMsg.style.display = 'none';
}
function getLitJizoRepulsion(pos) {
  let px = 0, pz = 0;
  for (const j of jizoList) {
    if (!j.lit) continue;
    const dx = pos.x - j.x, dz = pos.z - j.z;
    const d = Math.sqrt(dx*dx + dz*dz);
    if (d < JIZO_SAFE_RADIUS) {
      const sd = Math.max(d, 0.0001), ov = JIZO_SAFE_RADIUS - sd + 0.15;
      px += (dx / sd) * ov;
      pz += (dz / sd) * ov;
    }
  }
  return { x:px, z:pz };
}
function isPointInsideAnySafeZone(x, z) {
  for (const j of jizoList) {
    if (!j.lit) continue;
    if (dist2D(x, z, j.x, j.z) <= JIZO_SAFE_RADIUS) return true;
  }
  return false;
}

function updateMove() {
  if (game.state !== 'playing') return;

  if (isDashing && !dashExhausted) {
    stamina = Math.max(0, stamina - STAMINA_DRAIN);
    if (stamina <= 0) {
      stamina = 0;
      dashExhausted = true;
      isDashing = false;
    }
  } else {
    if (dashExhausted) {
      stamina = Math.min(100, stamina + STAMINA_RECOVER * 0.6);
      if (stamina >= 30) dashExhausted = false;
    } else {
      stamina = Math.min(100, stamina + STAMINA_RECOVER);
    }
  }
  updateStaminaUI();

  if (!joyActive) return;

  const spd = (isDashing && !dashExhausted) ? SPEED_DASH : SPEED_WALK;
  const fwd = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
  const rgt = new THREE.Vector3( Math.cos(yaw), 0, -Math.sin(yaw));

  let nx = playerPos.x - joyDy * spd * fwd.x + joyDx * spd * rgt.x;
  let nz = playerPos.z - joyDy * spd * fwd.z + joyDx * spd * rgt.z;

  nx = clamp(nx, -81, 81);
  nz = clamp(nz, -81, 81);

  const th = getFloorHeight(nx, nz);
  const ny = th + PLAYER_EYE_H;

  if (!checkBoxCollisionAt(nx, nz, ny)) {
    playerPos.x = nx;
    playerPos.z = nz;
  } else {
    const onlyNx = playerPos.x - joyDy * spd * fwd.x + joyDx * spd * rgt.x;
    const onlyNz = playerPos.z;
    const th2 = getFloorHeight(onlyNx, onlyNz);
    if (!checkBoxCollisionAt(onlyNx, onlyNz, th2 + PLAYER_EYE_H)) {
      playerPos.x = onlyNx;
    } else {
      const onlyNx2 = playerPos.x;
      const onlyNz2 = playerPos.z - joyDy * spd * fwd.z + joyDx * spd * rgt.z;
      const th3 = getFloorHeight(onlyNx2, onlyNz2);
      if (!checkBoxCollisionAt(onlyNx2, onlyNz2, th3 + PLAYER_EYE_H)) {
        playerPos.z = onlyNz2;
      }
    }
  }

  const newTerrainY = getFloorHeight(playerPos.x, playerPos.z) + PLAYER_EYE_H;
  targetPlayerY = newTerrainY;
  playerPos.y += (targetPlayerY - playerPos.y) * TERRAIN_LERP_K;
}

/* =========================================================
   touch controls
========================================================= */
let joyId = null, joyActive = false, joyDx = 0, joyDy = 0, joyStartX = 0, joyStartY = 0;
let lookId = null, lookPrevX = 0, lookPrevY = 0;
let yaw = 0, pitch = 0;
const touchStartMeta = new Map();
const JOY_R = 60;

dashBtnEl.addEventListener('touchstart', e => {
  e.stopPropagation();
  ensureAudioContext();
  if (game.state !== 'playing' || dashExhausted) return;
  isDashing = true;
}, { passive:true });
dashBtnEl.addEventListener('touchend', e => {
  e.stopPropagation();
  isDashing = false;
}, { passive:true });
dashBtnEl.addEventListener('touchcancel', e => {
  e.stopPropagation();
  isDashing = false;
}, { passive:true });

canvas.addEventListener('touchstart', onTS, { passive:false });
canvas.addEventListener('touchmove', onTM, { passive:false });
canvas.addEventListener('touchend', onTE, { passive:false });
canvas.addEventListener('touchcancel', onTE, { passive:false });

function onTS(e) {
  e.preventDefault();
  ensureAudioContext();
  if (game.state !== 'playing') return;

  for (const t of e.changedTouches) {
    touchStartMeta.set(t.identifier, { x:t.clientX, y:t.clientY, time:Date.now() });
    const isLeft = t.clientX < window.innerWidth / 2;
    if (isLeft && joyId === null) {
      joyId = t.identifier;
      joyActive = true;
      joyStartX = t.clientX;
      joyStartY = t.clientY;
      joyDx = 0; joyDy = 0;
    } else if (!isLeft && lookId === null) {
      lookId = t.identifier;
      lookPrevX = t.clientX;
      lookPrevY = t.clientY;
    }
  }
}

function onTM(e) {
  e.preventDefault();
  if (game.state !== 'playing') return;

  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      const dx = t.clientX - joyStartX;
      const dy = t.clientY - joyStartY;
      const len = Math.sqrt(dx*dx + dy*dy);
      const cl = Math.min(len, JOY_R);
      const a = Math.atan2(dy, dx);
      joyDx = Math.cos(a) * cl / JOY_R;
      joyDy = Math.sin(a) * cl / JOY_R;
      joystickStick.style.transform = `translate(${Math.cos(a)*cl}px,${Math.sin(a)*cl}px)`;
    }
    if (t.identifier === lookId) {
      const dx = t.clientX - lookPrevX;
      const dy = t.clientY - lookPrevY;
      yaw -= dx * 0.0030;
      pitch -= dy * 0.0028;
      pitch = clamp(pitch, -Math.PI / 2.2, Math.PI / 2.2);
      lookPrevX = t.clientX;
      lookPrevY = t.clientY;
    }
  }
}

function tryIgniteJizoByTap(t) {
  if (game.state !== 'playing') return;
  const meta = touchStartMeta.get(t.identifier);
  if (!meta) return;
  if (Date.now() - meta.time > 350 || Math.hypot(t.clientX - meta.x, t.clientY - meta.y) > 24) return;
  const n = getNearestJizoInPromptRange();
  if (n) {
    igniteJizo(n);
    promptMsg.style.display = 'none';
  }
}

function onTE(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier === joyId) {
      joyId = null; joyActive = false; joyDx = 0; joyDy = 0;
      joystickStick.style.transform = 'translate(0,0)';
    }
    if (t.identifier === lookId) lookId = null;
    tryIgniteJizoByTap(t);
    touchStartMeta.delete(t.identifier);
  }
}

/* =========================================================
   GLB / FBX placement
========================================================= */
function placeFallbackEnemy() {
  if (hachishaku) return;
  hachishaku = new THREE.Group();
  const visualRoot = new THREE.Group();
  visualRoot.rotation.y = ENEMY_VISUAL_YAW_OFFSET;
  visualRoot.add(buildFallbackEnemy());
  hachishaku.add(visualRoot);
  hachishaku.position.set(18, getFloorHeight(18,18), 18);
  scene.add(hachishaku);
  setEnemyTargetAvoidingSafeZone();
}

function placeHousesAlongRoads(template) {
  let placed = 0;
  for (const slot of HOUSE_SLOTS) {
    const x = slot.x, z = slot.z, ry = slot.ry;
    if (isPointReserved(x, z)) continue;

    const house = placeModelOnFloor(template, x, z, ry, slot.area === 'platform' ? 4.2 : 4.6, {
      darken: 0.55,
      maxWidth: slot.area === 'platform' ? 7.5 : 6.6,
      maxDepth: slot.area === 'platform' ? 7.5 : 6.6
    });

    scene.add(house.obj);
    const box = new THREE.Box3().setFromObject(house.obj);
    box.expandByScalar(-0.12);
    collisionBoxes.push(box);
    obstacleMeshes.push(house.obj);
    placed++;
  }
  return placed;
}

function placeFallbackHouseLayout() {
  let placed = 0;
  for (const slot of HOUSE_SLOTS) {
    if (isPointReserved(slot.x, slot.z)) continue;
    placeFallbackHouse(slot.x, slot.z, slot.ry, slot.area);
    placed++;
  }
  return placed;
}

function placeGaitouLightsIfTemplate(template) {
  placeGaitouLights(template);
}

function buildPlatformAndRoadCollisionAndVisuals() {
  // platform is already added as visual and collider above
  // stairs are visuals only; floor detection drives ascent
}

function addDebugStatus(msg) { statusMsg.textContent = msg; }
function appendStatus(msg) { statusMsg.textContent = (statusMsg.textContent || '') + msg; }
function setStatus(msg) { statusMsg.textContent = msg; }
function clearStatus() { statusMsg.textContent = ''; }
function appendError(msg) {
  errorMsg.textContent = (errorMsg.textContent ? errorMsg.textContent + '\n' : '') + msg;
  errorMsg.style.display = 'block';
}
function clearError() {
  errorMsg.style.display = 'none';
  errorMsg.textContent = '';
}

const gltfLoader = new THREE.GLTFLoader();
const fbxLoader = new THREE.FBXLoader();

setStatus('モデル読み込み中...');

gltfLoader.load('./ie.glb', gltf => {
  const template = gltf.scene;
  optimizeImportedRoot(template, {
    darken: 0.55,
    allowTransparent: true,
    forceFrontSide: true
  });

  let meshCount = 0;
  template.traverse(c => { if (c.isMesh) meshCount++; });

  if (meshCount === 0) {
    appendError('ie.glb: メッシュ0個');
    placeFallbackHouseLayout();
  } else {
    const placed = placeHousesAlongRoads(template);
    appendStatus(`✅ ie.glb 成功 / 家:${placed}棟`);
    setTimeout(() => { if (game.state === 'playing') clearStatus(); }, 6000);
  }

  loadGaitou();
}, prog => {
  if (prog.total > 0) setStatus(`ie.glb ${Math.round(prog.loaded / prog.total * 100)}%`);
}, e => {
  appendError('ie.glb失敗: ' + (e && e.message ? e.message : String(e)));
  placeFallbackHouseLayout();
  loadGaitou();
});

let gaitouTemplate = null;
function loadGaitou() {
  gltfLoader.load('./gaitou.glb', gltf => {
    gaitouTemplate = gltf.scene;
    placeGaitouLightsIfTemplate(gaitouTemplate);
    appendStatus('\n✅ gaitou.glb 成功');
    setTimeout(() => { if (game.state === 'playing') clearStatus(); }, 5000);
    loadKaidan();
  }, null, () => {
    appendError('gaitou.glb失敗→基本形状使用');
    placeFallbackLanterns();
    loadKaidan();
  });
}

let kaidanTemplate = null;
function placeKaidanVisual(template) {
  const model = template.clone(true);
  cloneUniqueMaterials(model);

  model.scale.setScalar(1);
  model.rotation.y = 0;
  model.updateMatrixWorld(true);

  const box0 = new THREE.Box3().setFromObject(model);
  const size0 = new THREE.Vector3();
  box0.getSize(size0);

  const targetHeight = 4.0;
  const scale = Math.min(
    size0.y > 0.01 ? targetHeight / size0.y : 1,
    size0.x > 0.01 ? (STAIRS.width * 0.92) / size0.x : 1,
    size0.z > 0.01 ? ((STAIRS.startZ - STAIRS.endZ) * 0.95) / size0.z : 1
  );

  model.scale.setScalar(scale);
  model.rotation.y = Math.PI;
  model.updateMatrixWorld(true);

  const box1 = new THREE.Box3().setFromObject(model);
  model.position.set(
    STAIRS.x,
    -box1.min.y,
    (STAIRS.startZ + STAIRS.endZ) * 0.5
  );
  model.updateMatrixWorld(true);

  optimizeImportedRoot(model, {
    darken: 0.68,
    allowTransparent: true,
    forceFrontSide: true
  });

  scene.add(model);
  obstacleMeshes.push(model);
}
function loadKaidan() {
  gltfLoader.load('./kaidan.glb', gltf => {
    kaidanTemplate = gltf.scene;
    placeStairVisuals();
    placeKaidanVisual(kaidanTemplate);
    appendStatus('\n✅ kaidan.glb 成功');
    setTimeout(() => { if (game.state === 'playing') clearStatus(); }, 5000);
    tryLoadFBX();
  }, null, () => {
    appendError('kaidan.glb失敗→基本階段使用');
    placeFallbackStairVisuals();
    tryLoadFBX();
  });
}
function placeStairVisuals() {
  // staircase is already visible through boxes built above
}
function placeFallbackStairVisuals() {
  placeFallbackStairVisuals();
}
function tryLoadFBX() {
  if (typeof THREE.FBXLoader === 'undefined') {
    ensureHachishaku();
    appendError('FBXLoader未定義→フォールバック使用');
    setTimeout(() => { clearError(); }, 5000);
    return;
  }

  fbxLoader.load('./popopo.fbx', fbx => {
    const box = new THREE.Box3().setFromObject(fbx);
    const size = new THREE.Vector3();
    box.getSize(size);

    const TARGET_HEIGHT = 4.5;
    let finalScale = 1;
    if (size.y > 0.01) finalScale = TARGET_HEIGHT / size.y;
    fbx.scale.setScalar(finalScale);
    fbx.updateMatrixWorld(true);

    const box2 = new THREE.Box3().setFromObject(fbx);
    fbx.position.y = -box2.min.y;
    fbx.rotation.set(0, 0, 0);

    fbx.traverse(child => {
      if (child.isMesh) {
        child.castShadow = false;
        child.receiveShadow = false;
        child.frustumCulled = true;
        if (child.material) {
          const mats = Array.isArray(child.material) ? child.material : [child.material];
          mats.forEach(m => {
            if (m.color) m.color.multiplyScalar(0.28);
            if ('emissive' in m && m.emissive) m.emissive.multiplyScalar(0.12);
            m.fog = true;
            m.depthTest = true;
            m.depthWrite = true;
            m.side = THREE.FrontSide;
            m.needsUpdate = true;
          });
        }
      }
    });

    hachishaku = new THREE.Group();
    const visualRoot = new THREE.Group();
    visualRoot.rotation.y = ENEMY_VISUAL_YAW_OFFSET;
    visualRoot.add(fbx);
    hachishaku.add(visualRoot);
    hachishaku.position.set(18, getFloorHeight(18,18), 18);
    scene.add(hachishaku);
    setEnemyTargetAvoidingSafeZone();

    if (fbx.animations && fbx.animations.length > 0) {
      enemyMixer = new THREE.AnimationMixer(fbx);
      const action = enemyMixer.clipAction(fbx.animations[0]);
      action.reset();
      action.enabled = true;
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.clampWhenFinished = false;
      action.play();
      appendStatus(`\n✅ popopo.fbx / アニメ:${fbx.animations.length}クリップ`);
    } else {
      appendStatus('\n✅ popopo.fbx / アニメなし');
    }

    setTimeout(() => { if (game.state === 'playing') clearStatus(); }, 5000);
  }, prog => {
    if (prog.total > 0) {
      const pct = Math.round(prog.loaded / prog.total * 100);
      appendStatus(`\npopopo.fbx ${pct}%`);
    }
  }, e => {
    ensureHachishaku();
    appendError('popopo.fbx失敗→フォールバック\n' + (e && e.message ? e.message : String(e)));
    setTimeout(() => { clearError(); }, 7000);
  });
}

/* =========================================================
   main loop
========================================================= */
let frame = 0;
function animate() {
  if (!game.running) return;
  requestAnimationFrame(animate);
  frame++;

  const delta = clock.getDelta();
  if (enemyMixer) enemyMixer.update(delta);

  if (game.state === 'playing') {
    updateMove();
    updateEnemyAI(delta * 1000);
    updateJizoPrompt();
  }

  camera.position.copy(playerPos);

  if (game.state === 'jumpscare') {
    const t = performance.now() - game.scareStart;
    const life = Math.max(0, 1 - t / 1200);
    const amp = 0.18 * life;
    const sx = (Math.sin(performance.now() * 0.08) + (Math.random() - 0.5) * 1.4) * amp;
    const sy = (Math.cos(performance.now() * 0.09) + (Math.random() - 0.5) * 1.2) * amp;
    const sz = (Math.sin(performance.now() * 0.11) + (Math.random() - 0.5) * 1.2) * amp * 0.35;
    camera.position.x += sx;
    camera.position.y += sy;
    camera.position.z += sz;
    camera.rotation.z = Math.sin(performance.now() * 0.06) * amp * 0.45;
  } else {
    camera.rotation.z = 0;
  }

  camera.rotation.y = yaw;
  camera.rotation.x = pitch;

  const dir = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  candleLight.position.copy(camera.position);
  candleLight.target.position.copy(camera.position.clone().addScaledVector(dir, 6));
  candleLight.target.updateMatrixWorld();
  footLight.position.copy(camera.position);

  const flicker = 0.9 + Math.sin(frame * 0.23) * 0.06 + Math.sin(frame * 0.71) * 0.04 + (Math.random() - 0.5) * 0.08;
  if (candlePercent > 0) {
    candleLight.intensity = 8.5 * (candlePercent / 100) * flicker;
    candleLight.distance  = 12 + 8 * (candlePercent / 100) + Math.random() * 0.8;
    footLight.intensity   = 2.0 * (candlePercent / 100) * flicker;
  } else {
    candleLight.intensity = 0;
    footLight.intensity = 0;
  }

  const now = Date.now();
  if (game.state === 'playing' && now - lastTick > 4000 && candlePercent > 0) {
    candlePercent--;
    lastTick = now;
    updateCandleUI();
    if (candlePercent <= 0) {
      candlePercent = 0;
      darkOverlay.style.background = 'rgba(0,0,0,0.95)';
    } else if (candlePercent <= 20) {
      darkOverlay.style.background = `rgba(0,0,0,${0.35 * (1 - candlePercent / 20)})`;
    }
  }

  renderer.render(scene, camera);
}

/* =========================================================
   enemy init
========================================================= */
function ensureEnemyAndStart() {
  if (!hachishaku) ensureHachishaku();
}

/* =========================================================
   start
========================================================= */
updateCandleUI();
updateStaminaUI();
ensureEnemyAndStart();
animate();

})();
