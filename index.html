<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜の村 - 和風ホラー</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden; background:#050507;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #gameCanvas {
    display:block; width:100%; height:100%; touch-action:none;
  }
  #candleUI {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    font-family:'Georgia','Hiragino Mincho ProN',serif;
    font-size:22px; color:#ffe18b; letter-spacing:2px; white-space:nowrap;
    text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 14px rgba(255,180,0,0.8);
    z-index:20; pointer-events:none;
  }
  #candleBar {
    position:fixed; top:54px; left:50%; transform:translateX(-50%);
    width:220px; height:8px; background:rgba(0,0,0,0.42);
    border:1px solid rgba(255,190,110,0.45); border-radius:4px;
    z-index:20; pointer-events:none; overflow:hidden;
  }
  #candleBarFill {
    height:100%; width:100%;
    background:linear-gradient(90deg,#ff6a00,#ffd65a);
    border-radius:4px; transition:width 0.5s ease;
    box-shadow:0 0 6px rgba(255,180,0,0.7);
  }
  #statusMsg {
    position:fixed; top:76px; left:50%; transform:translateX(-50%);
    font-family:monospace; font-size:13px; color:#c8ffd0;
    text-shadow:0 0 6px #000,0 0 10px #000;
    z-index:20; pointer-events:none; text-align:center;
    white-space:pre-wrap;
  }
  #promptMsg {
    position:fixed; bottom:128px; left:50%; transform:translateX(-50%);
    font-family:'Hiragino Mincho ProN',serif;
    font-size:18px; color:#ffffff;
    padding:8px 14px; border-radius:999px;
    background:rgba(0,0,0,0.38);
    border:1px solid rgba(255,255,255,0.25);
    text-shadow:0 0 8px #000;
    z-index:21; pointer-events:none;
    display:none;
  }
  #errorMsg {
    position:fixed; top:96px; left:50%; transform:translateX(-50%);
    font-family:monospace; font-size:13px; color:#ff6666;
    text-shadow:0 0 6px #000;
    z-index:20; pointer-events:none; display:none; text-align:center;
    white-space:pre-wrap;
  }

  /* ===== ゲームオーバー演出 ===== */
  #gameOverScreen {
    position:fixed; inset:0;
    display:none;
    z-index:100;
    align-items:center;
    justify-content:center;
    text-align:center;
    background:rgba(255,0,0,0);
    transition:background 0.12s ease;
    pointer-events:none;
  }
  #gameOverScreen.active {
    display:flex;
    animation: gameOverFlash 0.5s forwards;
  }
  @keyframes gameOverFlash {
    0%   { background: rgba(255,0,0,0); }
    15%  { background: rgba(255,0,0,0.92); }
    35%  { background: rgba(255,0,0,0.85); }
    60%  { background: rgba(160,0,0,0.78); }
    100% { background: rgba(100,0,0,0.88); }
  }
  #gameOverInner {
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
    animation: gameOverTextIn 0.6s 0.25s both;
  }
  @keyframes gameOverTextIn {
    0%   { opacity:0; transform:scale(1.4); }
    100% { opacity:1; transform:scale(1.0); }
  }
  #gameOverTitle {
    font-family:'Hiragino Mincho ProN','Georgia',serif;
    font-size:clamp(36px, 10vw, 68px);
    color:#fff0f0;
    font-weight:900;
    letter-spacing:4px;
    line-height:1.3;
    text-shadow:
      0 0 10px #ff0000,
      0 0 25px #ff0000,
      0 0 50px rgba(255,0,0,0.7),
      3px 3px 0 #330000,
      -3px -3px 0 #220000;
  }
  #gameOverSub {
    font-family:'Hiragino Mincho ProN','Georgia',serif;
    font-size:clamp(18px, 4vw, 28px);
    color:#ffaaaa;
    letter-spacing:6px;
    text-shadow:0 0 12px rgba(255,0,0,0.8), 0 0 4px #000;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { opacity:0.7; }
    50%      { opacity:1.0; }
  }

  #joystickBase {
    position:fixed; bottom:60px; left:60px;
    width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,210,140,0.28);
    z-index:15; pointer-events:none;
    transition:opacity 0.3s;
  }
  #joystickStick {
    position:fixed; bottom:95px; left:95px;
    width:50px; height:50px; border-radius:50%;
    background:rgba(245,200,66,0.45);
    border:2px solid rgba(245,200,66,0.7);
    box-shadow:0 0 10px rgba(255,180,0,0.42);
    z-index:16; pointer-events:none;
    transition:transform 0.03s, opacity 0.3s;
  }
  #vignette {
    position:fixed; inset:0;

    position:fixed; inset:0; background:rgba(0,0,0,0);
    pointer-events:none; z-index:8; transition:background 3s ease;
  }

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';

// ===== 基本セットアップ =====
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x0b0b10,1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0d12);
scene.fog = new THREE.FogExp2(0x111218, 0.021);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 220);
camera.position.set(0, 1.65, 0);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===== 共通ユーティリティ =====
function randRange(min, max){ return min + Math.random() * (max - min); }
function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
function dist2D(ax, az, bx, bz){
  const dx = ax - bx, dz = az - bz;
  return Math.sqrt(dx*dx + dz*dz);
}
function randomPointInRange(range){
  return {
    x: (Math.random() - 0.5) * range,
    z: (Math.random() - 0.5) * range
  };
}

// ===== 地面 =====
const groundMat = new THREE.MeshLambertMaterial({color:0x171719});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400,1,1), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

const grid = new THREE.GridHelper(400, 80, 0x242428, 0x1a1a1d);
grid.position.y = 0.005;
scene.add(grid);

// ===== ライト =====
const ambLight = new THREE.AmbientLight(0x7a7a86, 0.72);
scene.add(ambLight);

const hemi = new THREE.HemisphereLight(0x8d8fa7, 0x35353d, 0.55);
scene.add(hemi);

const candleLight = new THREE.SpotLight(0xffb15a, 8.5, 20, Math.PI/6, 0.45, 1.8);
candleLight.castShadow = true;
candleLight.shadow.mapSize.set(512,512);
candleLight.shadow.camera.near = 0.1;
candleLight.shadow.camera.far = 20;
scene.add(candleLight);
scene.add(candleLight.target);

const footLight = new THREE.PointLight(0xff7a18, 2.2, 5.5);
scene.add(footLight);

// ===== UI / 状態 =====
let candlePercent = 100;
let lastTick = Date.now();
const TICK_MS = 4000;
const pctEl = document.getElementById('candlePercent');
const barFill = document.getElementById('candleBarFill');
const darkOverlay = document.getElementById('darknessOverlay');
const statusMsg = document.getElementById('statusMsg');
const errorMsg  = document.getElementById('errorMsg');
const promptMsg = document.getElementById('promptMsg');
const gameOverScreen = document.getElementById('gameOverScreen');
const joyBase  = document.getElementById('joystickBase');
const joyStick = document.getElementById('joystickStick');

function updateCandleUI(){
  const v = Math.max(0, Math.ceil(candlePercent));
  pctEl.textContent = v;
  barFill.style.width = v+'%';
  const r = Math.floor(180 + 75*(1-v/100));
  const g = Math.floor(190*(v/100));
  barFill.style.background = `linear-gradient(90deg,rgb(${r},40,0),rgb(${r},${g},30))`;
}

let gameOver = false;
let animationRunning = true;

function triggerGameOver(){
  if(gameOver) return;
  gameOver = true;
  animationRunning = false;

  // ジョイスティックUIを即座に非表示
  joyBase.style.opacity  = '0';
  joyStick.style.opacity = '0';
  joyBase.style.pointerEvents  = 'none';
  joyStick.style.pointerEvents = 'none';

  joyId = null;
  lookId = null;
  joyActive = false;
  joyDx = 0;
  joyDy = 0;

  promptMsg.style.display = 'none';
  statusMsg.textContent = '';
  errorMsg.textContent = '';
}

// ===== 赤い立方体（フォールバック確認用） =====
const redCube = new THREE.Mesh(
  new THREE.BoxGeometry(1.5, 3, 1.5),
  new THREE.MeshBasicMaterial({color:0xff0000})
);
redCube.position.set(0, 1.5, -5);
redCube.material.fog = false;
scene.add(redCube);
const redGlow = new THREE.PointLight(0xff2200, 1.5, 8);
redGlow.position.copy(redCube.position);
scene.add(redGlow);

// ===== 村の装飾 =====
function addTorii(x, z, ry){
  const mat = new THREE.MeshLambertMaterial({color:0x7e1111});
  const grp = new THREE.Group();
  [-1.6,1.6].forEach(ox=>{
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.18,0.18,5.5,8), mat);
    p.position.set(ox,2.75,0); p.castShadow=true; grp.add(p);
  });
  const k1 = new THREE.Mesh(new THREE.BoxGeometry(4.4,0.35,0.35), mat);
  k1.position.set(0,5.5,0); grp.add(k1);
  const k2 = new THREE.Mesh(new THREE.BoxGeometry(3.8,0.25,0.25), mat);
  k2.position.set(0,4.6,0); grp.add(k2);
  grp.position.set(x,0,z);
  grp.rotation.y = ry||0;
  scene.add(grp);
}
addTorii(0,-18,0);
addTorii(22,28,0.5);
addTorii(-20,18,-0.3);
addTorii(0,35,Math.PI);

function addLantern(x,z){
  const grp = new THREE.Group();
  const body = new THREE.Mesh(
    new THREE.SphereGeometry(0.28,8,8),
    new THREE.MeshBasicMaterial({color:0xffcc44})
  );
  body.position.y=2.4; grp.add(body);
  const pl = new THREE.PointLight(0xff9900,0.9,7);
  pl.position.y=2.4; grp.add(pl);
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.05,0.05,2.6,6),
    new THREE.MeshLambertMaterial({color:0x2a1500})
  );
  pole.position.y=1.1; grp.add(pole);
  grp.position.set(x,0,z);
  scene.add(grp);
}
[[6,-14],[-6,-14],[14,-14],[-14,-14],[0,12],[16,6],[-16,6],[9,22],[-9,22],[0,-25],[20,-5],[-20,-5]].forEach(p=>addLantern(p[0],p[1]));

function addGrave(x,z){
  const mat = new THREE.MeshLambertMaterial({color:0x252525});
  const grp = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.6,1.4,0.18),mat);
  body.position.y=0.7; grp.add(body);
  const top = new THREE.Mesh(new THREE.CylinderGeometry(0.32,0.32,0.18,8,1,false,0,Math.PI),mat);
  top.rotation.x=Math.PI/2; top.position.set(0,1.5,0); grp.add(top);
  grp.position.set(x,0,z);
  grp.rotation.y=Math.random()*0.5-0.25;
  grp.castShadow=true;
  scene.add(grp);
}
for(let i=0;i<25;i++){
  let gx,gz;
  do{ gx=(Math.random()-0.5)*100; gz=(Math.random()-0.5)*100; }
  while(Math.sqrt(gx*gx+gz*gz)<6);
  addGrave(gx,gz);
}

function addBamboo(x,z){
  const mat = new THREE.MeshLambertMaterial({color:0x1a2a10});
  for(let i=0;i<5;i++){
    const b = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05,0.07,4+Math.random()*2,6),
      mat
    );
    b.position.set(x+(Math.random()-0.5)*1.2, (b.geometry.parameters.height||5)/2, z+(Math.random()-0.5)*1.2);
    b.castShadow=true;
    scene.add(b);
  }
}
[[30,10],[-30,10],[25,-20],[-25,-20],[35,30],[-35,-10]].forEach(p=>addBamboo(p[0],p[1]));

// ===== 地蔵の結界 =====
const jizoList = [];
const JIZO_COUNT = 3;
const JIZO_SAFE_RADIUS = 4.0;
const JIZO_PROMPT_RADIUS = 3.0;

function createJizo(x, z){
  const grp = new THREE.Group();
  const bodyMat = new THREE.MeshLambertMaterial({color:0xf0f0f0, emissive:0x101010, emissiveIntensity:0.18});
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.8,1.5,0.8), bodyMat);
  body.position.y = 0.75;
  body.castShadow = true;
  body.receiveShadow = true;
  grp.add(body);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(0.24, 12, 12),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.12})
  );
  halo.position.y = 1.45;
  grp.add(halo);

  const light = new THREE.PointLight(0xff9800, 0, 7, 2);
  light.position.y = 1.55;
  grp.add(light);

  grp.position.set(x, 0, z);
  scene.add(grp);

  const jizo = { group:grp, light, lit:false, x, z };
  jizoList.push(jizo);
  return jizo;
}

function placeJizoRandomly(){
  for(let i=0;i<JIZO_COUNT;i++){
    let p, tries = 0;
    do {
      p = randomPointInRange(120);
      tries++;
    } while ((Math.abs(p.x) < 8 && Math.abs(p.z) < 8) && tries < 200);
    createJizo(p.x, p.z);
  }
}
placeJizoRandomly();

function getNearestJizoInPromptRange(){
  let best = null, bestDist = Infinity;
  for(const j of jizoList){
    if(j.lit) continue;
    const d = dist2D(playerPos.x, playerPos.z, j.x, j.z);
    if(d <= JIZO_PROMPT_RADIUS && d < bestDist){ best = j; bestDist = d; }
  }
  return best;
}

function igniteJizo(jizo){
  if(!jizo || jizo.lit) return;
  jizo.lit = true;
  jizo.light.intensity = 1.8;
  jizo.light.color.setHex(0xffa040);
  const haloMesh = jizo.group.children.find(c => c.isMesh && c.geometry && c.geometry.type === 'SphereGeometry');
  if(haloMesh && haloMesh.material) haloMesh.material.opacity = 0.26;
}

function updateJizoPrompt(){
  const nearest = getNearestJizoInPromptRange();
  if(nearest && !gameOver){
    promptMsg.style.display = 'block';
    promptMsg.dataset.jizoX = nearest.x.toFixed(3);
    promptMsg.dataset.jizoZ = nearest.z.toFixed(3);
  } else {
    promptMsg.style.display = 'none';
    delete promptMsg.dataset.jizoX;
    delete promptMsg.dataset.jizoZ;
  }
}

function getLitJizoRepulsion(enemyPos){
  let pushX = 0, pushZ = 0;
  for(const j of jizoList){
    if(!j.lit) continue;
    const dx = enemyPos.x - j.x;
    const dz = enemyPos.z - j.z;
    const d = Math.sqrt(dx*dx + dz*dz);
    if(d < JIZO_SAFE_RADIUS){
      const safeD = Math.max(d, 0.0001);
      const overlap = JIZO_SAFE_RADIUS - safeD + 0.15;
      pushX += (dx / safeD) * overlap;
      pushZ += (dz / safeD) * overlap;
    }
  }
  return {x: pushX, z: pushZ};
}

function isPointInsideAnySafeZone(x, z){
  for(const j of jizoList){
    if(!j.lit) continue;
    if(dist2D(x, z, j.x, j.z) <= JIZO_SAFE_RADIUS) return true;
  }
  return false;
}

// ===== GLTFLoader + モデルロード =====
statusMsg.textContent = 'モデル読み込み中...';

function loadScript(url, cb){
  const s = document.createElement('script');
  s.src = url;
  s.onload  = ()=>cb(null);
  s.onerror = ()=>cb(new Error('script load failed: ' + url));

// ===== 八尺様（hachishaku）管理 =====
let hachishaku = null;         // シーン上の THREE.Group
let hachishakuModelRoot = null;
let enemyTarget = null;
const ENEMY_SPEED       = 0.05;   // 追跡速度（メートル/フレーム）
const ENEMY_WANDER_SPEED = 0.016; // 徘徊速度

function buildFallbackEnemy(){
  const grp = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({color:0x1a1111, emissive:0x050000, emissiveIntensity:0.2});

  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.55, 2.6, 6, 10), mat);
  torso.position.y = 2.0; grp.add(torso);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.85, 14, 14), mat);
  head.position.y = 4.0; grp.add(head);

  const armGeo = new THREE.CapsuleGeometry(0.14, 1.8, 4, 8);
  const armL = new THREE.Mesh(armGeo, mat);
  const armR = new THREE.Mesh(armGeo, mat);
  armL.position.set(-0.95, 2.6, 0); armR.position.set(0.95, 2.6, 0);
  armL.rotation.z = 0.7;            armR.rotation.z = -0.7;
  grp.add(armL, armR);

  const legGeo = new THREE.CapsuleGeometry(0.18, 1.6, 4, 8);
  const legL = new THREE.Mesh(legGeo, mat); const legR = new THREE.Mesh(legGeo, mat);
  legL.position.set(-0.26, 0.9, 0); legR.position.set(0.26, 0.9, 0);
  grp.add(legL, legR);

  grp.scale.setScalar(1.0);
  return grp;
}

function setEnemyTargetAvoidingSafeZone(){
  let p, tries = 0;
  do {
    p = randomPointInRange(130);
    tries++;
  } while (isPointInsideAnySafeZone(p.x, p.z) && tries < 120);
  enemyTarget = p;
}

// ============================================================
// 【修正①】popopo.glb 読み込み後に底面Y補正を確実に行う
// ============================================================
function setupHachishakuFromTemplate(template){
  hachishaku = new THREE.Group();

  // モデルをクローンしてグループに追加
  hachishakuModelRoot = template.clone(true);

  // -- 底面補正: Box3でバウンディングボックスを計算し、底面がY=0になるよう配置 --
  const box = new THREE.Box3().setFromObject(hachishakuModelRoot);
  const size = new THREE.Vector3();
  box.getSize(size);

  // 目標身長を4mに合わせてスケール計算
  const targetH = 4.0;
  const autoScale = (size.y > 0.01) ? targetH / size.y : 1.0;
  hachishakuModelRoot.scale.setScalar(autoScale);

  // スケール適用後に再計算してY底面オフセットを取得
  const boxAfterScale = new THREE.Box3().setFromObject(hachishakuModelRoot);
  const bottomY = boxAfterScale.min.y; // 底面のY座標（負の値になる場合が多い）

  // 底面をY=0に合わせるよう内部モデルを持ち上げる
  hachishakuModelRoot.position.y = -bottomY;

  hachishakuModelRoot.rotation.y = Math.PI;
  hachishakuModelRoot.traverse(child=>{
    if(child.isMesh){
      child.castShadow = true;
      child.receiveShadow = true;
      if(child.material){
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(m=>{
          if(m.color)    m.color.multiplyScalar(0.28);
          if('emissive' in m && m.emissive) m.emissive.multiplyScalar(0.12);
        });
      }
    }
  });

  hachishaku.add(hachishakuModelRoot);

  // 初期位置は少し離れた場所（プレイヤーから遠い場所にスポーン）
  hachishaku.position.set(18, 0, 18);

  scene.add(hachishaku);
  setEnemyTargetAvoidingSafeZone();
}

function ensureHachishaku(){
  if(hachishaku) return;
  hachishaku = new THREE.Group();
  const fallback = buildFallbackEnemy();
  hachishaku.add(fallback);

  // フォールバックも底面補正
  const box = new THREE.Box3().setFromObject(hachishaku);
  const bottomY = box.min.y;
  hachishaku.position.set(18, -bottomY, 18);

  scene.add(hachishaku);
  setEnemyTargetAvoidingSafeZone();
}

loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js', function(err){
  if(err){
    errorMsg.textContent = 'GLTFLoaderの読み込みに失敗しました';
    errorMsg.style.display = 'block';
    statusMsg.textContent = '';
    ensureHachishaku();
    return;
  }
  if(typeof THREE.GLTFLoader === 'undefined'){
    errorMsg.textContent = 'GLTFLoaderが利用できません';
    errorMsg.style.display = 'block';
    statusMsg.textContent = '';
    ensureHachishaku();
    return;
  }

  const loader = new THREE.GLTFLoader();

  // ie.glb ロード（古民家）
  loader.load('./ie.glb',
    function(gltf){
      const template = gltf.scene;
      let meshCount = 0;
      template.traverse(c => { if(c.isMesh) meshCount++; });

      if(meshCount === 0){
        errorMsg.textContent = 'ie.glb は読み込めましたがメッシュが0個です（空のファイルかも）';
        errorMsg.style.display = 'block';
        statusMsg.textContent = '';
      } else {
        redCube.visible = false;
        redGlow.visible = false;

        const bbox = new THREE.Box3().setFromObject(template);
        const size = new THREE.Vector3();
        bbox.getSize(size);
        const targetH = 5.0;
        const autoScale = (size.y > 0.01) ? targetH / size.y : 1.0;
        const bottomY = bbox.min.y * autoScale;

        statusMsg.textContent = `✅ ie.glb 読み込み成功 / メッシュ:${meshCount}個 / サイズ:${size.x.toFixed(1)}x${size.y.toFixed(1)}x${size.z.toFixed(1)} / スケール:${autoScale.toFixed(3)}`;
        setTimeout(()=>{ if(!gameOver) statusMsg.textContent=''; }, 6000);

        const COUNT = 35, RANGE = 140, MIN_DIST = 7;
        for(let i=0; i<COUNT; i++){
          let px,pz,attempts=0;
          do{
            px = (Math.random()-0.5)*RANGE;
            pz = (Math.random()-0.5)*RANGE;
            attempts++;
          }while(Math.sqrt(px*px+pz*pz) < MIN_DIST && attempts < 100);

          const house = template.clone(true);
          house.scale.setScalar(autoScale * (0.85 + Math.random()*0.35));
          house.rotation.y = Math.random()*Math.PI*2;
          house.position.set(px, -bottomY, pz);
          house.traverse(child=>{
            if(child.isMesh){
              child.castShadow = true;
              child.receiveShadow = true;
              if(child.material){
                const mats = Array.isArray(child.material) ? child.material : [child.material];
                mats.forEach(m=>{ if(m.color) m.color.multiplyScalar(0.62); });
              }
            }
          });
          scene.add(house);
        }
      }
    },
    function(prog){
      if(prog.total>0){
        const pct = Math.round(prog.loaded/prog.total*100);
        statusMsg.textContent = `ie.glb 読み込み中... ${pct}%`;
      }
    },
    function(e){
      const msg = 'ie.glbの読み込みに失敗しました：' + (e && e.message ? e.message : String(e));
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
      errorMsg.style.color = '#ff6666';
      statusMsg.textContent = '';
      console.error('ie.glb load error:', e);
    }
  );

  // popopo.glb ロード（八尺様）
  loader.load('./popopo.glb',
    function(gltf){
      // 【修正①】底面補正を含む初期化
      setupHachishakuFromTemplate(gltf.scene);
      const extra = statusMsg.textContent ? statusMsg.textContent + '\n' : '';
      statusMsg.textContent = extra + 'popopo.glb 読み込み成功（八尺様セットアップ完了）';
      setTimeout(()=>{ if(!gameOver) statusMsg.textContent=''; }, 5000);
    },
    function(){},
    function(e){
      console.warn('popopo.glb load error:', e);
      ensureHachishaku();
      errorMsg.textContent = 'popopo.glbの読み込みに失敗したため、フォールバック敵を使用します';
      errorMsg.style.display = 'block';
      setTimeout(()=>{ if(!gameOver) errorMsg.style.display='none'; }, 5000);
    }
  );
});

// ===== タッチ操作 =====
const JOY_R = 60;
let joyId = null, joyActive = false;
let joyDx = 0, joyDy = 0;
let joyStartX = 0, joyStartY = 0;
let lookId = null, lookPrevX = 0, lookPrevY = 0;
let yaw = 0, pitch = 0;
const touchStartMeta = new Map();

canvas.addEventListener('touchstart', onTS, {passive:false});
canvas.addEventListener('touchmove',  onTM, {passive:false});
canvas.addEventListener('touchend',   onTE, {passive:false});
canvas.addEventListener('touchcancel',onTE, {passive:false});

function onTS(e){
  e.preventDefault();
  if(gameOver) return;
  for(const t of e.changedTouches){
    touchStartMeta.set(t.identifier, { x:t.clientX, y:t.clientY, time:Date.now() });
    const isLeft = t.clientX < window.innerWidth/2;
    if(isLeft && joyId===null){
      joyId=t.identifier; joyActive=true;
      joyStartX=t.clientX; joyStartY=t.clientY;
      joyDx=0; joyDy=0;
    } else if(!isLeft && lookId===null){
      lookId=t.identifier; lookPrevX=t.clientX; lookPrevY=t.clientY;
    }
  }
}

function onTM(e){
  e.preventDefault();
  if(gameOver) return;
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      const dx=t.clientX-joyStartX, dy=t.clientY-joyStartY;
      const len=Math.sqrt(dx*dx+dy*dy);
      const clamped=Math.min(len,JOY_R);
      const angle=Math.atan2(dy,dx);
      joyDx=Math.cos(angle)*clamped/JOY_R;
      joyDy=Math.sin(angle)*clamped/JOY_R;
      joyStick.style.transform=`translate(${Math.cos(angle)*clamped}px,${Math.sin(angle)*clamped}px)`;
    }
    if(t.identifier===lookId){
      const dx=t.clientX-lookPrevX, dy=t.clientY-lookPrevY;
      yaw   -= dx*0.0030;
      pitch -= dy*0.0028;
      pitch=Math.max(-Math.PI/2.2, Math.min(Math.PI/2.2, pitch));
      lookPrevX=t.clientX; lookPrevY=t.clientY;
    }
  }
}

function tryIgniteJizoByTap(t){
  if(gameOver) return;
  const meta = touchStartMeta.get(t.identifier);
  if(!meta) return;
  const duration = Date.now() - meta.time;
  const move = Math.hypot(t.clientX - meta.x, t.clientY - meta.y);
  if(duration > 350 || move > 24) return;
  const nearest = getNearestJizoInPromptRange();
  if(nearest){ igniteJizo(nearest); promptMsg.style.display='none'; }
}

function onTE(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){ joyId=null; joyActive=false; joyDx=0; joyDy=0; joyStick.style.transform='translate(0,0)'; }
    if(t.identifier===lookId) lookId=null;
    tryIgniteJizoByTap(t);
    touchStartMeta.delete(t.identifier);
  }
}

// ===== プレイヤー =====
const SPEED = 0.055;
const playerPos = new THREE.Vector3(0,1.65,0);

function updateMove(){
  if(gameOver) return;
  if(!joyActive) return;
  const fwd = new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const rgt = new THREE.Vector3( Math.cos(yaw),0,-Math.sin(yaw));
  playerPos.addScaledVector(fwd,-joyDy*SPEED);
  playerPos.addScaledVector(rgt, joyDx*SPEED);
  playerPos.x = Math.max(-90,Math.min(90,playerPos.x));
  playerPos.z = Math.max(-90,Math.min(90,playerPos.z));
}

// ===== アニメーションループ =====
let frame = 0;

function animate(){
  if(!animationRunning) return; // ゲームオーバー後はループ停止
  requestAnimationFrame(animate);
  frame++;

  // --- プレイヤー移動 ---
  updateMove();

  // ============================================================
  // 【修正②】八尺様のAI処理（毎フレーム実行）
  // ============================================================
  if(hachishaku && !gameOver){
    const distToPlayer = hachishaku.position.distanceTo(camera.position);

    if(distToPlayer < 25){
      // ★ 索敵範囲25m以内：プレイヤーを直接追跡
      const targetPos = new THREE.Vector3(camera.position.x, hachishaku.position.y, camera.position.z);
      hachishaku.lookAt(targetPos);

      const direction = new THREE.Vector3();
      direction.subVectors(camera.position, hachishaku.position);
      direction.y = 0;
      direction.normalize();

      // 地蔵結界による反発を計算
      const push = getLitJizoRepulsion(hachishaku.position);
      const nextX = hachishaku.position.x + direction.x * ENEMY_SPEED - push.x;
      const nextZ = hachishaku.position.z + direction.z * ENEMY_SPEED - push.z;

      // 安全ゾーンの内部には入らない
      if(!isPointInsideAnySafeZone(nextX, nextZ)){
        hachishaku.position.x = nextX;
        hachishaku.position.z = nextZ;
      } else {
        // 安全ゾーンに弾かれたら別ターゲットへ徘徊
        setEnemyTargetAvoidingSafeZone();
      }

    } else {
      // ★ 索敵範囲外：従来の徘徊ロジック
      if(!enemyTarget) setEnemyTargetAvoidingSafeZone();

      const ex = hachishaku.position.x;
      const ez = hachishaku.position.z;
      const dx = enemyTarget.x - ex;
      const dz = enemyTarget.z - ez;
      const dist = Math.sqrt(dx*dx + dz*dz);

      const push = getLitJizoRepulsion(hachishaku.position);
      if(push.x !== 0 || push.z !== 0){
        hachishaku.position.x -= push.x;
        hachishaku.position.z -= push.z;
        setEnemyTargetAvoidingSafeZone();
      }

      if(dist < 0.9){
        setEnemyTargetAvoidingSafeZone();
      } else {
        const nx = dx / Math.max(dist, 0.0001);
        const nz = dz / Math.max(dist, 0.0001);
        const nextX = ex + nx * ENEMY_WANDER_SPEED;
        const nextZ = ez + nz * ENEMY_WANDER_SPEED;

        if(!isPointInsideAnySafeZone(nextX, nextZ)){
          hachishaku.position.x = nextX;
          hachishaku.position.z = nextZ;
          hachishaku.rotation.y = Math.atan2(nx, nz);
        } else {
          setEnemyTargetAvoidingSafeZone();
        }
      }
    }

    // モデルを揺らして不気味さを演出
    const sway = Math.sin(performance.now() * 0.004) * 0.015;
    hachishaku.position.y = sway; // 地面にめり込まないよう微小な値のみ
    if(hachishakuModelRoot){
      hachishakuModelRoot.rotation.z = Math.sin(performance.now() * 0.0025) * 0.025;
    }

    // ★ 即死ゲームオーバー判定（距離1.8m以内）
    if(distToPlayer < 1.8){
      triggerGameOver();
      return;
    }
  }

  // --- 地蔵プロンプト更新 ---
  updateJizoPrompt();

  // --- カメラ位置・向き更新 ---
  camera.position.copy(playerPos);
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw;
  camera.rotation.x=pitch;

  // --- 蝋燭ライト位置 ---
  const dir = new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  candleLight.position.copy(camera.position);
  const tgt = camera.position.clone().addScaledVector(dir,6);
  candleLight.target.position.copy(tgt);
  candleLight.target.updateMatrixWorld();
  footLight.position.copy(camera.position);

  // --- 蝋燭のゆらぎ ---
  const flicker = 0.9 + Math.sin(frame*0.23)*0.06 + Math.sin(frame*0.71)*0.04 + (Math.random()-0.5)*0.08;
  if(candlePercent>0){
    const base = 8.5*(candlePercent/100);
    candleLight.intensity = base*flicker;
    candleLight.distance  = 12 + 8*(candlePercent/100) + Math.random()*0.8;
    footLight.intensity   = 2.2*(candlePercent/100)*flicker;
  } else {
    candleLight.intensity = 0;
    footLight.intensity   = 0;
  }

  // --- 蝋燭残量タイマー ---
  const now = Date.now();
  if(!gameOver && now-lastTick>TICK_MS && candlePercent>0){
    candlePercent -= 1;
    lastTick = now;
    updateCandleUI();
    if(candlePercent<=0){
      candlePercent=0;
      darkOverlay.style.background='rgba(0,0,0,0.95)';
    } else if(candlePercent<=20){
      const a = 0.35*(1-candlePercent/20);
      darkOverlay.style.background=`rgba(0,0,0,${a})`;
    }
  }

  if(redCube.visible) redCube.rotation.y += 0.012;

  renderer.render(scene, camera);
}

animate();
updateCandleUI();

})();
</script>
