<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Three.js FPS Horror Village Base</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      touch-action: none;
    }
    #candleText {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 245, 220, 0.96);
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 0 10px rgba(255, 214, 120, 0.55), 0 0 24px rgba(255, 214, 120, 0.2);
      white-space: nowrap;
    }
    #joystickBase {
      position: absolute;
      left: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(24vw, 170px);
      height: min(24vw, 170px);
      border-radius: 50%;
      background: rgba(180, 180, 180, 0.10);
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(2px);
    }
    #joystickThumb {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 42%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(220, 220, 220, 0.16);
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.08);
    }
    #status {
      position: absolute;
      left: 50%;
      top: calc(max(12px, env(safe-area-inset-top)) + 34px);
      transform: translateX(-50%);
      color: rgba(220, 220, 220, 0.72);
      font-size: 12px;
      text-align: center;
      letter-spacing: 0.02em;
      white-space: nowrap;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.55);
    }
    #help {
      position: absolute;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      text-align: right;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui">
    <div id="candleText">蝋燭の残り火：100%</div>
    <div id="status">ie.glb 読み込み中…</div>
    <div id="joystickBase"><div id="joystickThumb"></div></div>
    <div id="help">左：移動<br>右：視点回転</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/loaders/GLTFLoader.js';

    const container = document.getElementById('game');
    const candleText = document.getElementById('candleText');
    const statusText = document.getElementById('status');
    const joystickBase = document.getElementById('joystickBase');
    const joystickThumb = document.getElementById('joystickThumb');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 3, 40);

    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 250);
    camera.position.set(0, 1.65, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // ---------- textures ----------
    function makeNoiseTexture(size, base, variance) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      const img = ctx.createImageData(size, size);
      for (let i = 0; i < img.data.length; i += 4) {
        const n = Math.floor((Math.random() * 2 - 1) * variance);
        const v = Math.max(0, Math.min(255, base + n));
        img.data[i] = v;
        img.data[i + 1] = v;
        img.data[i + 2] = v;
        img.data[i + 3] = 255;
      }
      ctx.putImageData(img, 0, 0);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(8, 8);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const groundTex = makeNoiseTexture(64, 25, 18);
    const roadTex = makeNoiseTexture(64, 90, 14);

    // ---------- ground ----------
    const worldSize = 200;
    const half = worldSize / 2;
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(worldSize, worldSize, 1, 1),
      new THREE.MeshStandardMaterial({
        color: 0x181818,
        roughness: 1,
        metalness: 0,
        map: groundTex
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ---------- road system ----------
    const roadGroup = new THREE.Group();
    scene.add(roadGroup);

    const roadW = 8;
    const roadMat = new THREE.MeshStandardMaterial({
      color: 0x3d3d3d,
      roughness: 1,
      metalness: 0,
      map: roadTex
    });

    // Grid roads: visible block layout
    const roadLines = [-80, -40, 0, 40, 80];
    for (const x of roadLines) {
      const strip = new THREE.Mesh(new THREE.PlaneGeometry(roadW, worldSize, 1, 1), roadMat);
      strip.rotation.x = -Math.PI / 2;
      strip.position.set(x, 0.01, 0);
      strip.receiveShadow = true;
      roadGroup.add(strip);
    }
    for (const z of roadLines) {
      const strip = new THREE.Mesh(new THREE.PlaneGeometry(worldSize, roadW, 1, 1), roadMat);
      strip.rotation.x = -Math.PI / 2;
      strip.position.set(0, 0.01, z);
      strip.receiveShadow = true;
      roadGroup.add(strip);
    }

    // Slightly brighter intersections to make roads readable in darkness
    const crossMat = new THREE.MeshStandardMaterial({
      color: 0x4a4a4a,
      roughness: 1,
      metalness: 0,
      map: roadTex
    });
    for (const x of roadLines) {
      for (const z of roadLines) {
        const tile = new THREE.Mesh(new THREE.PlaneGeometry(roadW + 1.5, roadW + 1.5), crossMat);
        tile.rotation.x = -Math.PI / 2;
        tile.position.set(x, 0.012, z);
        tile.receiveShadow = true;
        roadGroup.add(tile);
      }
    }

    // ---------- lighting ----------
    const ambient = new THREE.AmbientLight(0x202020, 0.22);
    scene.add(ambient);
    const hemi = new THREE.HemisphereLight(0x1b2030, 0x050505, 0.18);
    scene.add(hemi);

    const candleLight = new THREE.SpotLight(0xfff0cc, 12, 32, Math.PI / 7, 0.45, 1.2);
    candleLight.position.set(0, 0, 0);
    candleLight.castShadow = true;
    candleLight.shadow.mapSize.set(1024, 1024);
    candleLight.shadow.camera.near = 0.5;
    candleLight.shadow.camera.far = 40;
    camera.add(candleLight);
    camera.add(candleLight.target);
    scene.add(camera);

    // ---------- player / controls ----------
    const player = {
      radius: 0.45,
      height: 1.65,
      x: 0,
      z: 8
    };

    camera.position.set(player.x, player.height, player.z);

    const input = {
      moveX: 0,
      moveY: 0
    };

    let yaw = 0;
    let pitch = 0;
    const pitchMin = THREE.MathUtils.degToRad(-70);
    const pitchMax = THREE.MathUtils.degToRad(70);

    const move = {
      active: false,
      pointerId: null,
      startX: 0,
      startY: 0,
      dx: 0,
      dy: 0
    };

    const look = {
      active: false,
      pointerId: null,
      lastX: 0,
      lastY: 0
    };

    const joystickRadius = () => Math.min(window.innerWidth * 0.12, 85);

    function setThumb(dx, dy) {
      const maxD = joystickRadius();
      const len = Math.hypot(dx, dy);
      const scale = len > maxD ? maxD / len : 1;
      const x = dx * scale;
      const y = dy * scale;
      joystickThumb.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    }

    function resetThumb() {
      joystickThumb.style.transform = 'translate(-50%, -50%)';
    }

    function isInsideJoystick(x, y) {
      const rect = joystickBase.getBoundingClientRect();
      const pad = 28;
      return x >= rect.left - pad && x <= rect.right + pad && y >= rect.top - pad && y <= rect.bottom + pad;
    }

    function updateJoystickVector() {
      const maxD = joystickRadius();
      input.moveX = THREE.MathUtils.clamp(move.dx / maxD, -1, 1);
      input.moveY = THREE.MathUtils.clamp(-move.dy / maxD, -1, 1);
      if (Math.abs(input.moveX) < 0.05) input.moveX = 0;
      if (Math.abs(input.moveY) < 0.05) input.moveY = 0;
      setThumb(move.dx, move.dy);
    }

    document.addEventListener('pointerdown', (e) => {
      if (e.clientX < window.innerWidth / 2 && isInsideJoystick(e.clientX, e.clientY) && move.pointerId === null) {
        move.active = true;
        move.pointerId = e.pointerId;
        move.startX = e.clientX;
        move.startY = e.clientY;
        move.dx = 0;
        move.dy = 0;
        updateJoystickVector();
        e.preventDefault();
        return;
      }

      if (e.clientX >= window.innerWidth / 2 && look.pointerId === null) {
        look.active = true;
        look.pointerId = e.pointerId;
        look.lastX = e.clientX;
        look.lastY = e.clientY;
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('pointermove', (e) => {
      if (move.active && e.pointerId === move.pointerId) {
        move.dx = e.clientX - move.startX;
        move.dy = e.clientY - move.startY;
        updateJoystickVector();
        e.preventDefault();
      }

      if (look.active && e.pointerId === look.pointerId) {
        const dx = e.clientX - look.lastX;
        const dy = e.clientY - look.lastY;
        look.lastX = e.clientX;
        look.lastY = e.clientY;

        yaw -= dx * 0.0045;
        pitch -= dy * 0.0045;
        pitch = THREE.MathUtils.clamp(pitch, pitchMin, pitchMax);
        e.preventDefault();
      }
    }, { passive: false });

    function endPointer(e) {
      if (move.active && e.pointerId === move.pointerId) {
        move.active = false;
        move.pointerId = null;
        move.dx = 0;
        move.dy = 0;
        input.moveX = 0;
        input.moveY = 0;
        resetThumb();
      }
      if (look.active && e.pointerId === look.pointerId) {
        look.active = false;
        look.pointerId = null;
      }
    }

    document.addEventListener('pointerup', endPointer, { passive: false });
    document.addEventListener('pointercancel', endPointer, { passive: false });
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // ---------- village houses ----------
    const colliders = []; // approximate circle colliders
    const houseInstances = [];
    const houseGroup = new THREE.Group();
    scene.add(houseGroup);

    const spawnClearRadius = 18;
    const houseCountTarget = 42;
    const plotCenters = [];

    // One or two houses per block, along road sides
    const blockCenters = [-60, -20, 20, 60];
    for (const x of blockCenters) {
      for (const z of blockCenters) {
        plotCenters.push({ x, z });
      }
    }

    function addColliderForObject(obj, radius) {
      colliders.push({
        object: obj,
        radius
      });
    }

    function createFallbackHouse() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.6, 2.0, 2.6),
        new THREE.MeshStandardMaterial({
          color: 0x6d5a46,
          roughness: 1,
          metalness: 0
        })
      );
      body.position.y = 1.0;
      body.castShadow = true;
      body.receiveShadow = true;
      g.add(body);

      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(2.1, 1.2, 4),
        new THREE.MeshStandardMaterial({
          color: 0x2b1d15,
          roughness: 1,
          metalness: 0
        })
      );
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 2.2;
      roof.castShadow = true;
      roof.receiveShadow = true;
      g.add(roof);

      return g;
    }

    let houseTemplate = null;
    let houseBaseRadius = 1.5;
    const loader = new GLTFLoader();
    loader.load(
      './ie.glb',
      (gltf) => {
        houseTemplate = gltf.scene;
        houseTemplate.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              child.material.roughness = Math.min(child.material.roughness ?? 1, 1);
            }
          }
        });

        // Measure approximate bounds for collision and placement
        const box = new THREE.Box3().setFromObject(houseTemplate);
        const size = new THREE.Vector3();
        box.getSize(size);
        houseBaseRadius = Math.max(size.x, size.z) * 0.45;

        statusText.textContent = 'ie.glb 読み込み完了。村を生成中…';
        buildVillage();
      },
      undefined,
      () => {
        houseTemplate = createFallbackHouse();
        houseBaseRadius = 1.6;
        statusText.textContent = 'ie.glb を読み込めなかったため、仮の家で村を生成中…';
        buildVillage();
      }
    );

    function buildVillage() {
      const occupied = [];
      let tries = 0;

      function isTooCloseToSpawn(x, z) {
        return Math.hypot(x - player.x, z - player.z) < spawnClearRadius;
      }

      function isFarEnoughFromOthers(x, z, minDist) {
        for (const p of occupied) {
          if (Math.hypot(x - p.x, z - p.z) < minDist) return false;
        }
        return true;
      }

      function isOnRoad(x, z) {
        const roadHalf = roadW / 2;
        const nearLine = (v) => roadLines.some((r) => Math.abs(v - r) < roadHalf + 4);
        return nearLine(x) || nearLine(z);
      }

      function randomInBlock(c) {
        const margin = 10;
        const wobble = 10;
        const x = THREE.MathUtils.clamp(c.x + (Math.random() * 2 - 1) * wobble, -half + margin, half - margin);
        const z = THREE.MathUtils.clamp(c.z + (Math.random() * 2 - 1) * wobble, -half + margin, half - margin);
        return { x, z };
      }

      while (houseInstances.length < houseCountTarget && tries < 5000) {
        tries++;

        const block = plotCenters[Math.floor(Math.random() * plotCenters.length)];
        const pos = randomInBlock(block);

        if (isOnRoad(pos.x, pos.z)) continue;
        if (isTooCloseToSpawn(pos.x, pos.z)) continue;
        if (!isFarEnoughFromOthers(pos.x, pos.z, 6.5)) continue;

        occupied.push(pos);

        const house = houseTemplate.clone(true);
        const scale = THREE.MathUtils.lerp(0.9, 1.4, Math.random());
        house.scale.setScalar(scale);
        house.position.set(pos.x, 0, pos.z);
        house.rotation.y = Math.random() * Math.PI * 2;

        // Align on ground
        const box = new THREE.Box3().setFromObject(house);
        const minY = box.min.y;
        house.position.y += -minY;

        // A slight random drift for organic placement
        house.position.x += (Math.random() * 2 - 1) * 1.2;
        house.position.z += (Math.random() * 2 - 1) * 1.2;

        // Shadows / colliders
        houseGroup.add(house);
        houseInstances.push(house);

        const radius = houseBaseRadius * scale * 1.1;
        addColliderForObject(house, radius);
      }

      statusText.textContent = `${houseInstances.length}軒の家を配置しました。`;
      setTimeout(() => {
        if (statusText.textContent.includes('配置しました')) {
          statusText.style.display = 'none';
        }
      }, 2000);
    }

    // ---------- collision ----------
    function resolveHouseCollisions(nextX, nextZ) {
      let x = nextX;
      let z = nextZ;
      const playerRadius = player.radius;

      for (const c of colliders) {
        const obj = c.object;
        const dx = x - obj.position.x;
        const dz = z - obj.position.z;
        const dist = Math.hypot(dx, dz);
        const minDist = c.radius + playerRadius;

        if (dist > 0 && dist < minDist) {
          const push = (minDist - dist) + 0.001;
          x += (dx / dist) * push;
          z += (dz / dist) * push;
        }
      }

      // Keep within world bounds
      x = THREE.MathUtils.clamp(x, -half + 2, half - 2);
      z = THREE.MathUtils.clamp(z, -half + 2, half - 2);
      return { x, z };
    }

    // ---------- candles / motion ----------
    const clock = new THREE.Clock();
    let candleRemaining = 100;
    const drainPerSecond = 2.5;

    function updateCandle(dt) {
      candleRemaining = Math.max(0, candleRemaining - drainPerSecond * dt);
      candleText.textContent = `蝋燭の残り火：${Math.round(candleRemaining)}%`;

      const flicker = (Math.random() - 0.5) * 0.8 + Math.sin(performance.now() * 0.04) * 0.12;
      candleLight.intensity = 12 + flicker;
      candleLight.distance = 20 + Math.random() * 4;

      const t = candleRemaining / 100;
      candleLight.color.setHSL(0.12, 1.0, 0.2 + 0.6 * t);

      if (candleRemaining <= 0) {
        candleLight.intensity = 0.35;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);

      // Move relative to view direction
      const speed = 2.8;
      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(forward.z, 0, -forward.x);

      const moveVec = new THREE.Vector3();
      moveVec.addScaledVector(forward, input.moveY);
      moveVec.addScaledVector(right, input.moveX);

      if (moveVec.lengthSq() > 0) moveVec.normalize().multiplyScalar(speed * dt);

      let nextX = player.x + moveVec.x;
      let nextZ = player.z + moveVec.z;
      const resolved = resolveHouseCollisions(nextX, nextZ);
      player.x = resolved.x;
      player.z = resolved.z;

      camera.position.set(player.x, player.height, player.z);

      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      const camForward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion).normalize();
      candleLight.position.copy(camera.position);
      candleLight.target.position.copy(camera.position).addScaledVector(camForward, 12);

      updateCandle(dt);

      // subtle life for houses
      for (let i = 0; i < houseInstances.length; i++) {
        const h = houseInstances[i];
        h.rotation.y += Math.sin((performance.now() + i * 91) * 0.00003) * 0.0002;
      }

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }

    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);

    animate();
  </script>
</body>
</html>
