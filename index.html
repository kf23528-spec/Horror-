<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>夜の村 - 和風ホラー</title>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- fflate（FBXLoaderの依存） -->
<script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.js"></script>
<!-- FBXLoader for Three.js r128 -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    overflow:hidden; background:#050507;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  #gameCanvas { display:block; width:100%; height:100%; touch-action:none; }

  /* ── 蝋燭UI ── */
  #candleUI {
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    font-family:'Georgia','Hiragino Mincho ProN',serif;
    font-size:20px; color:#ffe18b; letter-spacing:2px; white-space:nowrap;
    text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 14px rgba(255,180,0,0.8);
    z-index:20; pointer-events:none;
  }
  #candleBar {
    position:fixed; top:48px; left:50%; transform:translateX(-50%);
    width:200px; height:7px; background:rgba(0,0,0,0.42);
    border:1px solid rgba(255,190,110,0.45); border-radius:4px;
    z-index:20; pointer-events:none; overflow:hidden;
  }
  #candleBarFill {
    height:100%; width:100%;
    background:linear-gradient(90deg,#ff6a00,#ffd65a);
    border-radius:4px; transition:width 0.5s ease;
    box-shadow:0 0 6px rgba(255,180,0,0.7);
  }

  /* ── スタミナUI ── */
  #staminaUI {
    position:fixed; top:64px; left:50%; transform:translateX(-50%);
    font-family:'Georgia','Hiragino Mincho ProN',serif;
    font-size:16px; color:#a0e8ff; letter-spacing:2px; white-space:nowrap;
    text-shadow:-1px -1px 0 #000,1px -1px 0 #000,-1px 1px 0 #000,1px 1px 0 #000,0 0 10px rgba(80,200,255,0.7);
    z-index:20; pointer-events:none;
  }
  #staminaBar {
    position:fixed; top:86px; left:50%; transform:translateX(-50%);
    width:200px; height:6px; background:rgba(0,0,0,0.42);
    border:1px solid rgba(80,200,255,0.35); border-radius:4px;
    z-index:20; pointer-events:none; overflow:hidden;
  }
  #staminaBarFill {
    height:100%; width:100%;
    background:linear-gradient(90deg,#0077cc,#00e5ff);
    border-radius:4px; transition:width 0.1s ease;
    box-shadow:0 0 5px rgba(0,200,255,0.6);
  }

  /* ── 走るボタン ── */
  #dashBtn {
    position:fixed; bottom:60px; right:60px;
    width:80px; height:80px; border-radius:50%;
    background:rgba(0,160,255,0.22);
    border:2px solid rgba(80,200,255,0.55);
    box-shadow:0 0 14px rgba(0,180,255,0.3);
    z-index:15; pointer-events:auto;
    display:flex; align-items:center; justify-content:center;
    transition:background 0.1s, opacity 0.3s;
    touch-action:none;
  }
  #dashBtn .dashLabel {
    font-family:'Hiragino Mincho ProN',serif;
    font-size:15px; color:#aaeeff;
    text-shadow:0 0 6px #000,0 0 10px #000;
    letter-spacing:1px; pointer-events:none;
    line-height:1.25; text-align:center;
  }
  #dashBtn.pressing {
    background:rgba(0,200,255,0.42);
    box-shadow:0 0 22px rgba(0,220,255,0.65);
  }
  #dashBtn.exhausted {
    background:rgba(60,60,80,0.3);
    border-color:rgba(120,120,160,0.3);
    opacity:0.55;
  }

  /* ── 八尺様警告インジケーター ── */
  #alertIndicator {
    position:fixed; top:110px; left:50%; transform:translateX(-50%);
    font-family:'Hiragino Mincho ProN',serif;
    font-size:14px; color:#ff4444; letter-spacing:3px;
    text-shadow:0 0 10px #ff0000, 0 0 4px #000;
    z-index:20; pointer-events:none;
    display:none; white-space:nowrap;
    animation:alertPulse 0.6s ease-in-out infinite;
  }
  @keyframes alertPulse { 0%,100%{opacity:0.6;} 50%{opacity:1.0;} }

  /* ── その他UI ── */
  #statusMsg {
    position:fixed; top:130px; left:50%; transform:translateX(-50%);
    font-family:monospace; font-size:12px; color:#c8ffd0;
    text-shadow:0 0 6px #000,0 0 10px #000;
    z-index:20; pointer-events:none; text-align:center; white-space:pre-wrap;
  }
  #promptMsg {
    position:fixed; bottom:160px; left:50%; transform:translateX(-50%);
    font-family:'Hiragino Mincho ProN',serif;
    font-size:18px; color:#ffffff;
    padding:8px 14px; border-radius:999px;
    background:rgba(0,0,0,0.38);
    border:1px solid rgba(255,255,255,0.25);
    text-shadow:0 0 8px #000;
    z-index:21; pointer-events:none; display:none;
  }
  #errorMsg {
    position:fixed; top:148px; left:50%; transform:translateX(-50%);
    font-family:monospace; font-size:12px; color:#ff6666;
    text-shadow:0 0 6px #000;
    z-index:20; pointer-events:none; display:none;
    text-align:center; white-space:pre-wrap;
  }

  /* ── ゲームオーバー ── */
  #gameOverScreen {
    position:fixed; inset:0; display:none;
    z-index:100; align-items:center; justify-content:center;
    text-align:center; background:rgba(255,0,0,0);
    pointer-events:none;
  }
  #gameOverScreen.active {
    display:flex;
    animation:gameOverFlash 0.5s forwards;
  }
  @keyframes gameOverFlash {
    0%   { background:rgba(255,0,0,0); }
    15%  { background:rgba(255,0,0,0.92); }
    35%  { background:rgba(255,0,0,0.85); }
    60%  { background:rgba(160,0,0,0.78); }
    100% { background:rgba(100,0,0,0.88); }
  }
  #gameOverInner {
    display:flex; flex-direction:column; align-items:center; gap:18px;
    animation:gameOverTextIn 0.6s 0.25s both;
  }
  @keyframes gameOverTextIn {
    0%   { opacity:0; transform:scale(1.4); }
    100% { opacity:1; transform:scale(1.0); }
  }
  #gameOverTitle {
    font-family:'Hiragino Mincho ProN','Georgia',serif;
    font-size:clamp(36px,10vw,68px); color:#fff0f0;
    font-weight:900; letter-spacing:4px; line-height:1.3;
    text-shadow:0 0 10px #ff0000,0 0 25px #ff0000,0 0 50px rgba(255,0,0,0.7),3px 3px 0 #330000,-3px -3px 0 #220000;
  }
  #gameOverSub {
    font-family:'Hiragino Mincho ProN','Georgia',serif;
    font-size:clamp(18px,4vw,28px); color:#ffaaaa; letter-spacing:6px;
    text-shadow:0 0 12px rgba(255,0,0,0.8),0 0 4px #000;
    animation:pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.7;} 50%{opacity:1.0;} }

  /* ── ジョイスティック ── */
  #joystickBase {
    position:fixed; bottom:60px; left:60px;
    width:120px; height:120px; border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:2px solid rgba(255,210,140,0.28);
    z-index:15; pointer-events:none; transition:opacity 0.3s;
  }
  #joystickStick {
    position:fixed; bottom:95px; left:95px;
    width:50px; height:50px; border-radius:50%;
    background:rgba(245,200,66,0.45);
    border:2px solid rgba(245,200,66,0.7);
    box-shadow:0 0 10px rgba(255,180,0,0.42);
    z-index:16; pointer-events:none;
    transition:transform 0.03s, opacity 0.3s;
  }
  #vignette {
    position:fixed; inset:0;
    background:radial-gradient(ellipse at center,transparent 24%,rgba(0,0,0,0.62) 100%);
    pointer-events:none; z-index:5;
  }
  #darknessOverlay {
    position:fixed; inset:0; background:rgba(0,0,0,0);
    pointer-events:none; z-index:8; transition:background 3s ease;
  }
  /* 赤いベール（追跡中警告） */
  #dangerVeil {
    position:fixed; inset:0; background:rgba(180,0,0,0);
    pointer-events:none; z-index:9; transition:background 0.4s ease;
  }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="vignette"></div>
<div id="darknessOverlay"></div>
<div id="dangerVeil"></div>

<div id="candleUI">🕯 和蝋燭の残り火：<span id="candlePercent">100</span>%</div>
<div id="candleBar"><div id="candleBarFill"></div></div>

<div id="staminaUI">🏃 スタミナ：<span id="staminaPct">100</span>%</div>
<div id="staminaBar"><div id="staminaBarFill"></div></div>

<div id="alertIndicator">⚠ 八尺様に発見された…</div>
<div id="statusMsg"></div>
<div id="promptMsg">【画面をタップ】して地蔵に火を灯す</div>
<div id="errorMsg"></div>

<div id="gameOverScreen">
  <div id="gameOverInner">
    <div id="gameOverTitle">八尺様に捕まった…</div>
    <div id="gameOverSub">GAME OVER</div>
  </div>
</div>

<div id="joystickBase"></div>
<div id="joystickStick"></div>
<div id="dashBtn"><div class="dashLabel">走る</div></div>

<script>
(function(){
'use strict';

// ===================================================================
// 基本セットアップ
// ===================================================================
const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.setClearColor(0x0b0b10,1);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0d12);
scene.fog = new THREE.FogExp2(0x111218, 0.019);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.1, 220);
camera.position.set(0, 1.65, 0);

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ===================================================================
// ユーティリティ
// ===================================================================
function dist2D(ax,az,bx,bz){ const d=ax-bx,e=az-bz; return Math.sqrt(d*d+e*e); }
function randRange(a,b){ return a+Math.random()*(b-a); }
function randomPointInRange(r){ return {x:(Math.random()-0.5)*r, z:(Math.random()-0.5)*r}; }

// ===================================================================
// 地面
// ===================================================================
const groundMat = new THREE.MeshLambertMaterial({color:0x16161a});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// ===================================================================
// ライト
// ===================================================================
const ambLight = new THREE.AmbientLight(0x7a7a86, 0.65);
scene.add(ambLight);
const hemi = new THREE.HemisphereLight(0x8d8fa7, 0x35353d, 0.45);
scene.add(hemi);

const candleLight = new THREE.SpotLight(0xffb15a, 8.5, 20, Math.PI/6, 0.45, 1.8);
candleLight.castShadow = true;
candleLight.shadow.mapSize.set(512,512);
candleLight.shadow.camera.near = 0.1;
candleLight.shadow.camera.far = 20;
scene.add(candleLight, candleLight.target);

const footLight = new THREE.PointLight(0xff7a18, 2.2, 5.5);
scene.add(footLight);

// ===================================================================
// UI要素
// ===================================================================
let candlePercent = 100;
let lastTick = Date.now();
const TICK_MS = 4000;
const pctEl          = document.getElementById('candlePercent');
const barFill        = document.getElementById('candleBarFill');
const staminaPctEl   = document.getElementById('staminaPct');
const staminaFill    = document.getElementById('staminaBarFill');
const darkOverlay    = document.getElementById('darknessOverlay');
const dangerVeil     = document.getElementById('dangerVeil');
const alertIndicator = document.getElementById('alertIndicator');
const statusMsg      = document.getElementById('statusMsg');
const errorMsg       = document.getElementById('errorMsg');
const promptMsg      = document.getElementById('promptMsg');
const gameOverScreen = document.getElementById('gameOverScreen');
const joystickBase   = document.getElementById('joystickBase');
const joystickStick  = document.getElementById('joystickStick');
const dashBtnEl      = document.getElementById('dashBtn');

function updateCandleUI(){
  const v = Math.max(0,Math.ceil(candlePercent));
  pctEl.textContent = v;
  barFill.style.width = v+'%';
  const r=Math.floor(180+75*(1-v/100)), g=Math.floor(190*(v/100));
  barFill.style.background=`linear-gradient(90deg,rgb(${r},40,0),rgb(${r},${g},30))`;
}

// ===================================================================
// スタミナシステム
// ===================================================================
let stamina       = 100;
let isDashing     = false;
let dashExhausted = false;
const STAMINA_DRAIN   = 0.55;
const STAMINA_RECOVER = 0.22;
const SPEED_WALK  = 0.055;
const SPEED_DASH  = 0.110;

function updateStaminaUI(){
  const v = Math.max(0,Math.round(stamina));
  staminaPctEl.textContent = v;
  staminaFill.style.width  = v+'%';
  const g1=Math.floor(160*(v/100));
  staminaFill.style.background=`linear-gradient(90deg,rgb(0,${g1},200),rgb(0,220,255))`;
  if(dashExhausted){
    dashBtnEl.classList.add('exhausted');
    dashBtnEl.classList.remove('pressing');
  } else if(isDashing){
    dashBtnEl.classList.add('pressing');
    dashBtnEl.classList.remove('exhausted');
  } else {
    dashBtnEl.classList.remove('pressing','exhausted');
  }
}

// ===================================================================
// ゲームオーバー
// ===================================================================
let gameOver = false;
let animationRunning = true;

function triggerGameOver(){
  if(gameOver) return;
  gameOver = true;
  animationRunning = false;
  joystickBase.style.opacity  = '0';
  joystickStick.style.opacity = '0';
  dashBtnEl.style.opacity     = '0';
  alertIndicator.style.display = 'none';
  gameOverScreen.classList.add('active');
  joyId=null; lookId=null; joyActive=false; joyDx=0; joyDy=0;
  promptMsg.style.display='none';
  statusMsg.textContent='';
  errorMsg.textContent='';
  dangerVeil.style.background='rgba(0,0,0,0)';
}

// ===================================================================
// ═══════════════════════════════════════════════════
//  障害物トラッキング（視線判定用）
// ═══════════════════════════════════════════════════
// ===================================================================

// 視線判定に使う「障害物メッシュ」のリスト
// 家・柵のメッシュをここに登録する
const obstacleMeshes = [];

// ===================================================================
// 村マップ構築
// ===================================================================

// ── 道路 ──
const roadMat = new THREE.MeshLambertMaterial({color:0x252526});
function addRoad(x,z,w,d){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,d), roadMat);
  m.rotation.x=-Math.PI/2; m.position.set(x,0.008,z); m.receiveShadow=true;
  scene.add(m);
}
addRoad(0, 0, 7, 180);
addRoad(0, 0, 180, 7);
addRoad(0, -45, 120, 5);
addRoad(0,  45, 120, 5);
const RING_R = 32;
for(let i=0;i<8;i++){
  const a=i*Math.PI/4, a2=(i+1)*Math.PI/4;
  const cx=(Math.cos(a)+Math.cos(a2))/2*RING_R;
  const cz=(Math.sin(a)+Math.sin(a2))/2*RING_R;
  const len=RING_R*Math.tan(Math.PI/8)*2+1;
  const seg=new THREE.Mesh(new THREE.PlaneGeometry(len,4.5), roadMat);
  seg.rotation.x=-Math.PI/2;
  seg.rotation.z=-a-Math.PI/8;
  seg.position.set(cx,0.007,cz);
  scene.add(seg);
}

// ── 1. 木造の柵・塀（障害物登録あり） ──
const fenceMat = new THREE.MeshLambertMaterial({color:0x3a2010});
function addFence(x,z,w,d){
  const geo = new THREE.BoxGeometry(w,0.9,d);
  const m = new THREE.Mesh(geo, fenceMat);
  m.position.set(x,0.45,z); m.castShadow=true; scene.add(m);
  // 障害物リストに登録（視線判定用）
  obstacleMeshes.push(m);
}
for(let z=-80;z<80;z+=6){
  addFence( 5.5+randRange(0,0.4), z, 0.18, 4.5+randRange(0,1));
  addFence(-5.5-randRange(0,0.4), z, 0.18, 4.5+randRange(0,1));
}
for(let x=-80;x<80;x+=6){
  addFence(x, 5.5+randRange(0,0.4), 4.5+randRange(0,1), 0.18);
  addFence(x,-5.5-randRange(0,0.4), 4.5+randRange(0,1), 0.18);
}

// ── 2. 道の灯籠（街灯） ──
function addStreetLantern(x,z){
  const grp=new THREE.Group();
  const pole=new THREE.Mesh(
    new THREE.CylinderGeometry(0.06,0.08,3.2,6),
    new THREE.MeshLambertMaterial({color:0x1a0e00})
  );
  pole.position.y=1.6; pole.castShadow=true; grp.add(pole);
  const headGeo=new THREE.BoxGeometry(0.52,0.42,0.52);
  const headMat=new THREE.MeshBasicMaterial({color:0xffcc66});
  const head=new THREE.Mesh(headGeo,headMat);
  head.position.y=3.35; grp.add(head);
  const pl=new THREE.PointLight(0xff8800,1.3,9,2);
  pl.position.y=3.35; grp.add(pl);
  grp.position.set(x,0,z); scene.add(grp);
}
const lanternPositions=[
  [8,-8],[8,8],[-8,-8],[-8,8],
  [8,-45],[8,45],[-8,-45],[-8,45],
  [34,0],[-34,0]
];
lanternPositions.forEach(p=>addStreetLantern(p[0],p[1]));

// ── 3. 井戸・荷車 ──
const stoneMat=new THREE.MeshLambertMaterial({color:0x3c3c3c});
const woodMat2=new THREE.MeshLambertMaterial({color:0x4a2c10});
function addWell(x,z){
  const grp=new THREE.Group();
  const base=new THREE.Mesh(new THREE.CylinderGeometry(0.7,0.78,0.85,12),stoneMat);
  base.position.y=0.425; grp.add(base);
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(0.82,0.82,0.12,12,1,true),stoneMat);
  rim.position.y=0.91; grp.add(rim);
  const roofL=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.8,5),woodMat2);
  roofL.position.set(-0.6,1.4,0); grp.add(roofL);
  const roofR=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,1.8,5),woodMat2);
  roofR.position.set(0.6,1.4,0); grp.add(roofR);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.25,5),woodMat2);
  bar.rotation.z=Math.PI/2; bar.position.set(0,2.2,0); grp.add(bar);
  grp.position.set(x,0,z); scene.add(grp);
}
function addCart(x,z,ry){
  const grp=new THREE.Group();
  const bed=new THREE.Mesh(new THREE.BoxGeometry(1.8,0.22,0.9),woodMat2);
  bed.position.y=0.55; grp.add(bed);
  const wh1=new THREE.Mesh(new THREE.CylinderGeometry(0.36,0.36,0.1,12),stoneMat);
  wh1.rotation.x=Math.PI/2; wh1.position.set(-0.72,0.36,0.52); grp.add(wh1);
  const wh2=wh1.clone(); wh2.position.set(0.72,0.36,0.52); grp.add(wh2);
  const wh3=wh1.clone(); wh3.position.set(-0.72,0.36,-0.52); grp.add(wh3);
  const wh4=wh1.clone(); wh4.position.set(0.72,0.36,-0.52); grp.add(wh4);
  grp.position.set(x,0,z); grp.rotation.y=ry||0; scene.add(grp);
}
addWell(12,-12); addWell(-15,18); addWell(22,38); addWell(-20,-38); addWell(35,-10);
addCart(10,12,0.3); addCart(-12,-16,-0.2); addCart(18,-20,1.1);

// ── 4. 竹林・生け垣 ──
const bambooMat=new THREE.MeshLambertMaterial({color:0x1a2a0d});
const hedgeMat =new THREE.MeshLambertMaterial({color:0x182210});
function addBambooCluster(cx,cz,count){
  for(let i=0;i<count;i++){
    const h=randRange(5,9);
    const b=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.09,h,6),bambooMat);
    b.position.set(cx+randRange(-1.4,1.4),h/2,cz+randRange(-1.4,1.4));
    b.castShadow=true; scene.add(b);
    obstacleMeshes.push(b); // 竹も障害物
  }
}
function addHedgeWall(x,z,w,d){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,2.8,d),hedgeMat);
  m.position.set(x,1.4,z); m.castShadow=true; m.receiveShadow=true; scene.add(m);
  obstacleMeshes.push(m);
}
const BORDER=82, STEP=7;
for(let v=-BORDER;v<=BORDER;v+=STEP){
  addBambooCluster( BORDER, v, 6);
  addBambooCluster(-BORDER, v, 6);
  addBambooCluster(v,  BORDER, 6);
  addBambooCluster(v, -BORDER, 6);
}
for(let v=-BORDER;v<BORDER;v+=14){
  addHedgeWall( BORDER+1, v+7, 1.2, 14);
  addHedgeWall(-BORDER-1, v+7, 1.2, 14);
  addHedgeWall(v+7,  BORDER+1, 14, 1.2);
  addHedgeWall(v+7, -BORDER-1, 14, 1.2);
}

// ── 5. 不気味な祭壇 ──
function buildAltar(){
  const grp=new THREE.Group();
  const bMat=new THREE.MeshLambertMaterial({color:0x111114,emissive:0x050005,emissiveIntensity:0.3});

const jizoList=[];
const JIZO_COUNT=3, JIZO_SAFE_RADIUS=4.0, JIZO_PROMPT_RADIUS=3.0;

function createJizo(x,z){
  const grp=new THREE.Group();
  const bMat=new THREE.MeshLambertMaterial({color:0xf0f0f0,emissive:0x101010,emissiveIntensity:0.18});
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.8,1.5,0.8),bMat);
  body.position.y=0.75; body.castShadow=true; body.receiveShadow=true; grp.add(body);
  const halo=new THREE.Mesh(new THREE.SphereGeometry(0.24,12,12),
    new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:0.12}));
  halo.position.y=1.45; grp.add(halo);
  const light=new THREE.PointLight(0xff9800,0,7,2);
  light.position.y=1.55; grp.add(light);
  grp.position.set(x,0,z); scene.add(grp);
  const j={group:grp,light,lit:false,x,z};
  jizoList.push(j); return j;
}
function placeJizoRandomly(){
  for(let i=0;i<JIZO_COUNT;i++){
    let p,tries=0;
    do{ p=randomPointInRange(70); tries++; }
    while((Math.abs(p.x)<8&&Math.abs(p.z)<8)&&tries<200);
    createJizo(p.x,p.z);
  }
}

const playerPos=new THREE.Vector3(0,1.65,0);

function getNearestJizoInPromptRange(){
  let best=null,bestDist=Infinity;
  for(const j of jizoList){
    if(j.lit) continue;
    const d=dist2D(playerPos.x,playerPos.z,j.x,j.z);
    if(d<=JIZO_PROMPT_RADIUS&&d<bestDist){best=j;bestDist=d;}
  }
  return best;
}
function igniteJizo(jizo){
  if(!jizo||jizo.lit) return;
  jizo.lit=true; jizo.light.intensity=1.8; jizo.light.color.setHex(0xffa040);
  const hm=jizo.group.children.find(c=>c.isMesh&&c.geometry&&c.geometry.type==='SphereGeometry');
  if(hm&&hm.material) hm.material.opacity=0.26;
}
function updateJizoPrompt(){
  const n=getNearestJizoInPromptRange();
  if(n&&!gameOver){ promptMsg.style.display='block'; }
  else { promptMsg.style.display='none'; }
}
function getLitJizoRepulsion(pos){
  let px=0,pz=0;
  for(const j of jizoList){
    if(!j.lit) continue;
    const dx=pos.x-j.x, dz=pos.z-j.z;
    const d=Math.sqrt(dx*dx+dz*dz);
    if(d<JIZO_SAFE_RADIUS){
      const sd=Math.max(d,0.0001), ov=JIZO_SAFE_RADIUS-sd+0.15;
      px+=(dx/sd)*ov; pz+=(dz/sd)*ov;
    }
  }
  return {x:px,z:pz};
}
function isPointInsideAnySafeZone(x,z){
  for(const j of jizoList){
    if(!j.lit) continue;
    if(dist2D(x,z,j.x,j.z)<=JIZO_SAFE_RADIUS) return true;
  }
  return false;
}

let hachishaku = null;

// 速度定数（1.2倍強化済み）
const ENEMY_SPEED        = 0.05 * 1.2;
const ENEMY_WANDER_SPEED = 0.016 * 1.2;

// ── ステルスAI用変数 ──
// AIの状態: 'wander'（徘徊）, 'chase'（追跡）
let enemyState = 'wander';

// 「視線が切れてからの経過時間（ms）」
// 追跡中に3秒間視線が切れ続けたら見失う
let losTimer = 0;
const LOS_LOSE_TIME = 3000; // 3秒

// 最後にプレイヤーを目撃した位置（視線が切れた後はここへ向かう）
let lastKnownPlayerPos = null;

// Raycaster（視線判定用）
const raycaster = new THREE.Raycaster();

// ── フォールバック（立方体）で敵を構築 ──
function buildFallbackEnemy(){
  const grp=new THREE.Group();
  const mat=new THREE.MeshLambertMaterial({color:0x1a1111,emissive:0x050000,emissiveIntensity:0.2});
  const torso=new THREE.Mesh(new THREE.CapsuleGeometry(0.55,2.6,6,10),mat);

  const aL=new THREE.Mesh(aGeo,mat); aL.position.set(-0.95,2.6,0); aL.rotation.z=0.7;
  const aR=new THREE.Mesh(aGeo,mat); aR.position.set(0.95,2.6,0); aR.rotation.z=-0.7;
  grp.add(aL,aR);

  const lR=new THREE.Mesh(lGeo,mat); lR.position.set(0.26,0.9,0);

function setEnemyTargetAvoidingSafeZone(){
  let p,tries=0;
  do{ p=randomPointInRange(130); tries++; }
  while(isPointInsideAnySafeZone(p.x,p.z)&&tries<120);
  enemyTarget=p;
}

// ===================================================================
// ★ 視線（LOS: Line of Sight）判定コア関数
// ===================================================================
/**
 * 敵の位置からプレイヤーへの視線が通っているかチェック。
 * obstacleMeshes（家・柵・竹など）に当たれば視線遮断→false
 * @param {THREE.Vector3} enemyPos - 敵の世界座標（目線の高さ補正済み）
 * @param {THREE.Vector3} playerPos3D - プレイヤーの世界座標
 * @returns {boolean} true=視線通過（発見）, false=視線遮断（隠れている）
 */
function hasLineOfSight(enemyPos, playerPos3D){
  if(obstacleMeshes.length === 0) return true; // 障害物なければ常に発見

  const eyePos = enemyPos.clone();
  eyePos.y += 2.2; // 八尺様の目の高さ（約4m+視点）

  const targetPos = playerPos3D.clone();
  targetPos.y += 1.0; // プレイヤーの胸の高さ

  const direction = new THREE.Vector3().subVectors(targetPos, eyePos).normalize();
  const distance  = eyePos.distanceTo(targetPos);

  raycaster.set(eyePos, direction);
  raycaster.far = distance - 0.3; // プレイヤー自体には当たらないよう少し短く

  // 障害物との交差チェック（再帰的にchildrenも調べる）
  const intersects = raycaster.intersectObjects(obstacleMeshes, true);

  return intersects.length === 0; // 何も当たらなければ視線通過
}

// ===================================================================
// ★ 敵AIのメイン更新（視線ステルス統合版）
// ===================================================================
const DETECT_RADIUS = 30; // 索敵半径 30m

function updateEnemyAI(deltaMs){
  if(!hachishaku || gameOver) return;

  const ex = hachishaku.position.x;
  const ez = hachishaku.position.z;
  const enemyPos3D = new THREE.Vector3(ex, 0, ez);

  const distToPlayer = hachishaku.position.distanceTo(camera.position);
  const canSee = (distToPlayer < DETECT_RADIUS) && hasLineOfSight(enemyPos3D, playerPos);

  // ── ステートマシン遷移 ──
  if(enemyState === 'wander'){
    // 徘徊中：視線が通れば追跡開始
    if(canSee){
      enemyState = 'chase';
      losTimer = 0;
      lastKnownPlayerPos = playerPos.clone();
    }
  } else if(enemyState === 'chase'){
    // 追跡中：視線の有無を確認
    if(canSee){
      // 視線通過 → 目撃位置更新、タイマーリセット
      losTimer = 0;
      lastKnownPlayerPos = playerPos.clone();
    } else {
      // 視線遮断 → ロスタイマー加算
      losTimer += deltaMs;
      if(losTimer >= LOS_LOSE_TIME){
        // 3秒間見失った → 徘徊に戻る
        enemyState = 'wander';
        losTimer = 0;
        lastKnownPlayerPos = null;
        setEnemyTargetAvoidingSafeZone();
      }
    }
  }

  // ── UI更新（警告インジケーター + 赤いベール） ──
  if(enemyState === 'chase'){
    alertIndicator.style.display = 'block';
    // 距離に応じてベールの強度を変える
    const veilAlpha = Math.max(0, Math.min(0.22, (DETECT_RADIUS - distToPlayer) / DETECT_RADIUS * 0.3));
    dangerVeil.style.background = `rgba(180,0,0,${veilAlpha})`;
  } else {
    alertIndicator.style.display = 'none';
    dangerVeil.style.background = 'rgba(0,0,0,0)';
  }

  // ── 移動処理 ──
  const push = getLitJizoRepulsion(hachishaku.position);

  if(enemyState === 'chase'){
    // ■ 追跡モード：プレイヤー（または最終目撃地点）へ向かう
    const chaseTarget = canSee ? new THREE.Vector3(playerPos.x, 0, playerPos.z)
                                : (lastKnownPlayerPos ? new THREE.Vector3(lastKnownPlayerPos.x, 0, lastKnownPlayerPos.z) : null);

    if(chaseTarget){
      hachishaku.lookAt(new THREE.Vector3(chaseTarget.x, hachishaku.position.y, chaseTarget.z));
      const dir = new THREE.Vector3().subVectors(chaseTarget, new THREE.Vector3(ex, 0, ez)).normalize();
      const nextX = ex + dir.x * ENEMY_SPEED - push.x;
      const nextZ = ez + dir.z * ENEMY_SPEED - push.z;

      if(!isPointInsideAnySafeZone(nextX, nextZ)){
        hachishaku.position.x = nextX;
        hachishaku.position.z = nextZ;
      } else {
        setEnemyTargetAvoidingSafeZone();
        enemyState = 'wander';
        losTimer = 0;
      }

      // 最終目撃地点に到達してもまだ見失っている場合 → 徘徊へ
      if(!canSee && lastKnownPlayerPos){
        const dToLKP = dist2D(ex, ez, lastKnownPlayerPos.x, lastKnownPlayerPos.z);
        if(dToLKP < 1.2){
          setEnemyTargetAvoidingSafeZone();
          // stateはchase継続（まだlosTimerが0になっていないので保持）
        }
      }
    }

  } else {
    // ■ 徘徊モード：ランダムな目標へ移動
    if(!enemyTarget) setEnemyTargetAvoidingSafeZone();
    const dx = enemyTarget.x - ex, dz = enemyTarget.z - ez;
    const dist = Math.sqrt(dx*dx+dz*dz);

    if(push.x!==0||push.z!==0){
      hachishaku.position.x -= push.x;
      hachishaku.position.z -= push.z;
      setEnemyTargetAvoidingSafeZone();
    }
    if(dist < 0.9){
      setEnemyTargetAvoidingSafeZone();
    } else {
      const nx=dx/Math.max(dist,0.0001), nz=dz/Math.max(dist,0.0001);
      const nextX=ex+nx*ENEMY_WANDER_SPEED, nextZ=ez+nz*ENEMY_WANDER_SPEED;
      if(!isPointInsideAnySafeZone(nextX,nextZ)){
        hachishaku.position.x = nextX; hachishaku.position.z = nextZ;
        hachishaku.rotation.y = Math.atan2(nx,nz);
      } else {
        setEnemyTargetAvoidingSafeZone();
      }
    }
  }

  // 地面揺れ（微小）
  hachishaku.position.y = Math.sin(performance.now()*0.004)*0.015;

  // 即死判定
  if(distToPlayer < 1.8){ triggerGameOver(); }
}

function loadScript(url, cb){

// 道路沿い家配置ロジック
function placeHousesAlongRoads(template){
  const AUTOS=35, MIN_DIST=8;
  const slots=[];
  for(let z=-75;z<75;z+=10){
    if(Math.abs(z)<12) continue;
    slots.push({ x: 10+randRange(1,4), z: z+randRange(-2,2), ry: Math.PI/2*(Math.random()>0.5?1:-1) });
    slots.push({ x:-10-randRange(1,4), z: z+randRange(-2,2), ry: Math.PI/2*(Math.random()>0.5?1:-1) });
  }
  for(let x=-75;x<75;x+=10){
    if(Math.abs(x)<12) continue;
    slots.push({ x: x+randRange(-2,2), z: 10+randRange(1,4), ry: 0 });
    slots.push({ x: x+randRange(-2,2), z:-10-randRange(1,4), ry: Math.PI });
  }
  for(let i=0;i<16;i++){
    const a=i*Math.PI/8;
    const r=RING_R+randRange(7,13);
    slots.push({ x:Math.cos(a)*r, z:Math.sin(a)*r, ry:a+Math.PI/2 });
  }

  let placed=0;
  const bbox=new THREE.Box3().setFromObject(template);
  const size=new THREE.Vector3(); bbox.getSize(size);
  const targetH=5.0;
  const autoScale=(size.y>0.01)?targetH/size.y:1.0;
  const bottomY=bbox.min.y*autoScale;

  for(const slot of slots){
    if(placed>=AUTOS) break;
    const {x,z,ry}=slot;
    if(Math.sqrt(x*x+z*z)<MIN_DIST) continue;
    const house=template.clone(true);
    const sc = autoScale*(0.85+Math.random()*0.35);
    house.scale.setScalar(sc);
    house.rotation.y=ry+randRange(-0.2,0.2);
    house.position.set(x,-bottomY,z);
    house.traverse(child=>{
      if(child.isMesh){
        child.castShadow=true; child.receiveShadow=true;
        if(child.material){
          const mats=Array.isArray(child.material)?child.material:[child.material];
          mats.forEach(m=>{ if(m.color) m.color.multiplyScalar(0.62); });
        }
        // ★ 家のメッシュを障害物リストに登録（視線判定に使用）
        obstacleMeshes.push(child);
      }
    });
    scene.add(house);
    placed++;
  }
  return placed;
}

loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js', function(err){

    errorMsg.textContent = 'GLTFLoaderの読み込みに失敗しました';

        setTimeout(()=>{ if(!gameOver) statusMsg.textContent=''; }, 6000);

    function(prog){

    },
    function(e){
      errorMsg.textContent = 'ie.glb 読み込み失敗：'+(e&&e.message?e.message:String(e));
      errorMsg.style.display = 'block'; statusMsg.textContent = '';
      tryLoadFBX();
    }
  );
});

// ── popopo.fbx（八尺様）のロード ──
function tryLoadFBX(){
  // FBXLoaderが存在するか確認
  if(typeof THREE.FBXLoader === 'undefined'){
    console.warn('FBXLoader未定義 → フォールバック使用');
    ensureHachishaku();
    errorMsg.textContent = 'FBXLoader未定義→フォールバック使用';
    errorMsg.style.display = 'block';
    setTimeout(()=>{ if(!gameOver) errorMsg.style.display='none'; }, 5000);
    return;
  }

  const fbxLoader = new THREE.FBXLoader();

  fbxLoader.load(
    './popopo.fbx',

    // ── onLoad ──
    function(fbx){
      // ★ サイズ自動補正（指示通り）
      // MeshyAIモデルは極端に大きい場合が多いため 0.02 スケールを基準に自動調整
      const tempScale = 0.02;
      fbx.scale.set(tempScale, tempScale, tempScale);

      // 底面がぴったり地面(Y=0)に接地するように自動補正
      const box = new THREE.Box3().setFromObject(fbx);
      const size = new THREE.Vector3();
      box.getSize(size);

      // 目標の身長：約 4.5m
      const TARGET_HEIGHT = 4.5;
      let finalScale = tempScale;
      if(size.y > 0.01){
        finalScale = (TARGET_HEIGHT / size.y) * tempScale;
        fbx.scale.set(finalScale, finalScale, finalScale);
      }

      // スケール確定後に再度バウンディングボックスを取得して底面補正
      const box2 = new THREE.Box3().setFromObject(fbx);
      const bottomY = box2.min.y;

      // 敵グループに格納
      hachishaku = new THREE.Group();
      fbx.position.y = -bottomY; // 地面に接地
      fbx.rotation.y = Math.PI;  // プレイヤー方向を正面に

      // 暗色化処理
      fbx.traverse(child=>{
        if(child.isMesh){
          child.castShadow=true; child.receiveShadow=true;
          if(child.material){
            const mats=Array.isArray(child.material)?child.material:[child.material];
            mats.forEach(m=>{
              if(m.color) m.color.multiplyScalar(0.28);
              if('emissive' in m && m.emissive) m.emissive.multiplyScalar(0.12);
            });
          }
        }
      });

      hachishaku.add(fbx);
      hachishaku.position.set(18, 0, 18);
      scene.add(hachishaku);
      setEnemyTargetAvoidingSafeZone();

      const msg = (statusMsg.textContent ? statusMsg.textContent+'\n':'');
      statusMsg.textContent = msg + '✅ popopo.fbx 八尺様 読み込み成功';
      setTimeout(()=>{ if(!gameOver) statusMsg.textContent=''; }, 5000);
    },

    // ── onProgress ──
    function(prog){
      if(prog.total > 0){
        const pct = Math.round(prog.loaded / prog.total * 100);
        const base = statusMsg.textContent.replace(/\npopopo.fbx.*/,'');
        statusMsg.textContent = base + `\npopopo.fbx 読み込み中... ${pct}%`;
      }
    },

    // ── onError ──
    function(e){
      console.warn('popopo.fbx load error:', e);
      ensureHachishaku();
      errorMsg.textContent = 'popopo.fbx失敗→フォールバック使用\n'+
        (e&&e.message?e.message:String(e));
      errorMsg.style.display = 'block';
      setTimeout(()=>{ if(!gameOver) errorMsg.style.display='none'; }, 7000);
    }
  );
}

// ===================================================================
// タッチ操作（左:ジョイスティック / 右:視点 + ダッシュボタン）
// ===================================================================
const JOY_R=60;
let joyId=null, joyActive=false, joyDx=0, joyDy=0, joyStartX=0, joyStartY=0;
let lookId=null, lookPrevX=0, lookPrevY=0;
let yaw=0, pitch=0;
const touchStartMeta=new Map();

let dashBtnActive=false;
dashBtnEl.addEventListener('touchstart',e=>{
  e.stopPropagation();
  if(gameOver||dashExhausted) return;
  dashBtnActive=true; isDashing=true;
},{passive:true});
dashBtnEl.addEventListener('touchend',e=>{
  e.stopPropagation();
  dashBtnActive=false; isDashing=false;
},{passive:true});
dashBtnEl.addEventListener('touchcancel',e=>{
  e.stopPropagation();
  dashBtnActive=false; isDashing=false;
},{passive:true});

canvas.addEventListener('touchstart',onTS,{passive:false});
canvas.addEventListener('touchmove', onTM,{passive:false});
canvas.addEventListener('touchend',  onTE,{passive:false});
canvas.addEventListener('touchcancel',onTE,{passive:false});

function onTS(e){
  e.preventDefault();
  if(gameOver) return;
  for(const t of e.changedTouches){
    touchStartMeta.set(t.identifier,{x:t.clientX,y:t.clientY,time:Date.now()});
    const isLeft=t.clientX<window.innerWidth/2;
    if(isLeft&&joyId===null){
      joyId=t.identifier; joyActive=true;
      joyStartX=t.clientX; joyStartY=t.clientY; joyDx=0; joyDy=0;
    } else if(!isLeft&&lookId===null){
      lookId=t.identifier; lookPrevX=t.clientX; lookPrevY=t.clientY;
    }
  }
}
function onTM(e){
  e.preventDefault();
  if(gameOver) return;
  for(const t of e.changedTouches){
    if(t.identifier===joyId){
      const dx=t.clientX-joyStartX, dy=t.clientY-joyStartY;
      const len=Math.sqrt(dx*dx+dy*dy), cl=Math.min(len,JOY_R), a=Math.atan2(dy,dx);
      joyDx=Math.cos(a)*cl/JOY_R; joyDy=Math.sin(a)*cl/JOY_R;
      joystickStick.style.transform=`translate(${Math.cos(a)*cl}px,${Math.sin(a)*cl}px)`;
    }
    if(t.identifier===lookId){
      const dx=t.clientX-lookPrevX, dy=t.clientY-lookPrevY;
      yaw  -=dx*0.0030; pitch-=dy*0.0028;
      pitch=Math.max(-Math.PI/2.2,Math.min(Math.PI/2.2,pitch));
      lookPrevX=t.clientX; lookPrevY=t.clientY;
    }
  }
}
function tryIgniteJizoByTap(t){
  if(gameOver) return;
  const meta=touchStartMeta.get(t.identifier);
  if(!meta) return;
  if(Date.now()-meta.time>350||Math.hypot(t.clientX-meta.x,t.clientY-meta.y)>24) return;
  const n=getNearestJizoInPromptRange();
  if(n){igniteJizo(n);promptMsg.style.display='none';}
}
function onTE(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){joyId=null;joyActive=false;joyDx=0;joyDy=0;joystickStick.style.transform='translate(0,0)';}
    if(t.identifier===lookId) lookId=null;
    tryIgniteJizoByTap(t);
    touchStartMeta.delete(t.identifier);
  }
}

// ===================================================================
// プレイヤー移動（スタミナ付きダッシュ）
// ===================================================================
function updateMove(){
  if(gameOver) return;

  if(isDashing && !dashExhausted){
    stamina=Math.max(0,stamina-STAMINA_DRAIN);
    if(stamina<=0){ stamina=0; dashExhausted=true; isDashing=false; }
  } else {
    if(dashExhausted){
      stamina=Math.min(100,stamina+STAMINA_RECOVER*0.6);
      if(stamina>=30) dashExhausted=false;
    } else {
      stamina=Math.min(100,stamina+STAMINA_RECOVER);
    }
  }
  updateStaminaUI();

  if(!joyActive) return;
  const currentSpeed=(isDashing&&!dashExhausted)?SPEED_DASH:SPEED_WALK;
  const fwd=new THREE.Vector3(-Math.sin(yaw),0,-Math.cos(yaw));
  const rgt=new THREE.Vector3( Math.cos(yaw),0,-Math.sin(yaw));
  playerPos.addScaledVector(fwd,-joyDy*currentSpeed);
  playerPos.addScaledVector(rgt, joyDx*currentSpeed);
  playerPos.x=Math.max(-82,Math.min(82,playerPos.x));
  playerPos.z=Math.max(-82,Math.min(82,playerPos.z));
}

// ===================================================================
// アニメーションループ
// ===================================================================
let frame=0;
let prevTimestamp=0;

function animate(timestamp){
  if(!animationRunning) return;
  requestAnimationFrame(animate);
  frame++;

  const deltaMs = timestamp - prevTimestamp;
  prevTimestamp = timestamp;
  const safeDelta = Math.min(deltaMs, 100); // スパイク防止（最大100ms）

  // プレイヤー移動
  updateMove();

  // ── 八尺様 AI（視線ステルス統合） ──
  updateEnemyAI(safeDelta);

  // 地蔵プロンプト
  updateJizoPrompt();

  // カメラ
  camera.position.copy(playerPos);
  camera.rotation.order='YXZ';
  camera.rotation.y=yaw; camera.rotation.x=pitch;

  // 蝋燭ライト（フリッカー付き）
  const dir=new THREE.Vector3(0,0,-1).applyEuler(camera.rotation);
  candleLight.position.copy(camera.position);
  candleLight.target.position.copy(camera.position.clone().addScaledVector(dir,6));
  candleLight.target.updateMatrixWorld();
  footLight.position.copy(camera.position);

  const flicker=0.9+Math.sin(frame*0.23)*0.06+Math.sin(frame*0.71)*0.04+(Math.random()-0.5)*0.08;
  if(candlePercent>0){
    candleLight.intensity=8.5*(candlePercent/100)*flicker;
    candleLight.distance=12+8*(candlePercent/100)+Math.random()*0.8;
    footLight.intensity=2.2*(candlePercent/100)*flicker;
  } else {
    candleLight.intensity=0; footLight.intensity=0;
  }

  // 蝋燭残量タイマー
  const now=Date.now();
  if(!gameOver&&now-lastTick>TICK_MS&&candlePercent>0){
    candlePercent--; lastTick=now; updateCandleUI();
    if(candlePercent<=0){
      candlePercent=0; darkOverlay.style.background='rgba(0,0,0,0.95)';
    } else if(candlePercent<=20){
      darkOverlay.style.background=`rgba(0,0,0,${0.35*(1-candlePercent/20)})`;
    }
  }

  if(redCube.visible) redCube.rotation.y+=0.012;
  renderer.render(scene,camera);
}

animate(0);
updateCandleUI();
updateStaminaUI();

})();
</script>
