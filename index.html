<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Three.js FPS Horror Village Base</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans JP", sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    #ui {
      position: fixed;
      inset: 0;
      pointer-events: none;
      touch-action: none;
    }

    #candleText {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 245, 220, 0.96);
      font-size: clamp(18px, 2.2vw, 28px);
      font-weight: 700;
      letter-spacing: 0.04em;
      text-shadow: 0 0 10px rgba(255, 214, 120, 0.55), 0 0 24px rgba(255, 214, 120, 0.2);
      white-space: nowrap;
    }

    #joystickBase {
      position: absolute;
      left: 18px;
      bottom: max(18px, env(safe-area-inset-bottom));
      width: min(24vw, 170px);
      height: min(24vw, 170px);
      border-radius: 50%;
      background: rgba(180, 180, 180, 0.10);
      border: 2px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 0 18px rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(2px);
    }

    #joystickThumb {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 42%;
      height: 42%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: rgba(220, 220, 220, 0.16);
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.08);
    }

    #help {
      position: absolute;
      right: 12px;
      bottom: max(12px, env(safe-area-inset-bottom));
      color: rgba(255,255,255,0.25);
      font-size: 12px;
      text-align: right;
      line-height: 1.4;
    }

    #loading {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      letter-spacing: 0.04em;
      text-align: center;
      text-shadow: 0 0 12px rgba(255,255,255,0.12);
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    #loading.hide {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="ui">
    <div id="candleText">蝋燭の残り火：100%</div>
    <div id="joystickBase">
      <div id="joystickThumb"></div>
    </div>
    <div id="help">左：移動<br>右：視点回転</div>
    <div id="loading">村を読み込み中…</div>
  </div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.159.0/build/three.module.js';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.159.0/examples/jsm/loaders/GLTFLoader.js';

    const container = document.getElementById('game');
    const candleText = document.getElementById('candleText');
    const joystickBase = document.getElementById('joystickBase');
    const joystickThumb = document.getElementById('joystickThumb');
    const loading = document.getElementById('loading');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000000);
    scene.fog = new THREE.Fog(0x000000, 4, 30);

    const camera = new THREE.PerspectiveCamera(
      70,
      window.innerWidth / window.innerHeight,
      0.1,
      220
    );
    camera.position.set(0, 1.65, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.domElement.style.touchAction = 'none';
    container.appendChild(renderer.domElement);

    // ---------- Utilities ----------
    const clamp = THREE.MathUtils.clamp;
    const rand = (min, max) => min + Math.random() * (max - min);
    const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

    function makeNoiseTexture(size = 128) {
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');
      const image = ctx.createImageData(size, size);
      for (let i = 0; i < image.data.length; i += 4) {
        const base = 78 + Math.floor(Math.random() * 26);
        image.data[i + 0] = base;
        image.data[i + 1] = base;
        image.data[i + 2] = base;
        image.data[i + 3] = 255;
      }
      ctx.putImageData(image, 0, 0);

      // add a few rough streaks so the road reads clearly
      ctx.globalAlpha = 0.14;
      ctx.fillStyle = '#ffffff';
      for (let i = 0; i < 18; i++) {
        const y = Math.random() * size;
        ctx.fillRect(0, y, size, Math.random() * 2 + 0.5);
      }
      ctx.globalAlpha = 1;

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.needsUpdate = true;
      return tex;
    }

    // ---------- Base world ----------
    const groundTex = makeNoiseTexture(128);
    groundTex.repeat.set(28, 28);

    const roadTex = makeNoiseTexture(128);
    roadTex.repeat.set(16, 16);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(220, 220, 1, 1),
      new THREE.MeshStandardMaterial({
        color: 0x141414,
        map: groundTex,
        roughness: 1,
        metalness: 0
      })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const ambient = new THREE.AmbientLight(0x1a1a1a, 0.22);
    scene.add(ambient);

    const hemi = new THREE.HemisphereLight(0x222233, 0x050505, 0.18);
    scene.add(hemi);

    // ---------- Candle / spotlight ----------
    const candleLight = new THREE.SpotLight(0xfff0cc, 18, 40, Math.PI / 6, 0.42, 1.15);
    candleLight.castShadow = true;
    candleLight.shadow.mapSize.set(1024, 1024);
    candleLight.shadow.camera.near = 0.5;
    candleLight.shadow.camera.far = 60;
    camera.add(candleLight);
    camera.add(candleLight.target);
    scene.add(camera);

    // ---------- Test cube ----------
    const cube = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({
        color: 0xaa0000,
        roughness: 0.82,
        metalness: 0.04,
        emissive: 0x330000,
        emissiveIntensity: 0.42
      })
    );
    cube.position.set(0, 0.5, -6);
    cube.castShadow = true;
    cube.receiveShadow = true;
    scene.add(cube);

    // ---------- Road network ----------
    const MAP_HALF = 95;
    const ROAD_WIDTH = 4.2;
    const GRID_LINES = [-MAP_HALF, -57, -19, 19, 57, MAP_HALF];
    const ROAD_COLOR = 0x4a4a4a;

    const roadMaterial = new THREE.MeshStandardMaterial({
      color: ROAD_COLOR,
      map: roadTex,
      roughness: 1,
      metalness: 0
    });

    const roads = new THREE.Group();
    scene.add(roads);

    function addRoadStrip(length, width, x, z, rotY) {
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(length, width), roadMaterial);
      mesh.rotation.x = -Math.PI / 2;
      mesh.rotation.z = rotY || 0;
      mesh.position.set(x, 0.018, z);
      mesh.receiveShadow = true;
      roads.add(mesh);
      return mesh;
    }

    // Vertical roads
    for (const x of GRID_LINES) {
      addRoadStrip(220, ROAD_WIDTH, x, 0, Math.PI / 2);
    }
    // Horizontal roads
    for (const z of GRID_LINES) {
      addRoadStrip(220, ROAD_WIDTH, 0, z, 0);
    }

    // Slightly brighter central road square so the intersection is readable
    const centerJunction = new THREE.Mesh(
      new THREE.PlaneGeometry(ROAD_WIDTH * 2.2, ROAD_WIDTH * 2.2),
      new THREE.MeshStandardMaterial({
        color: 0x5b5b5b,
        map: roadTex,
        roughness: 1,
        metalness: 0
      })
    );
    centerJunction.rotation.x = -Math.PI / 2;
    centerJunction.position.y = 0.019;
    roads.add(centerJunction);

    // ---------- Village houses ----------
    const loader = new GLTFLoader();
    const houseInstances = [];
    let houseTemplate = null;

    function buildFallbackHouseTemplate() {
      const g = new THREE.Group();
      const body = new THREE.Mesh(
        new THREE.BoxGeometry(2.5, 1.8, 2.6),
        new THREE.MeshStandardMaterial({ color: 0x6f5a46, roughness: 1, metalness: 0 })
      );
      body.position.y = 0.9;
      body.castShadow = true;
      body.receiveShadow = true;
      g.add(body);

      const roof = new THREE.Mesh(
        new THREE.ConeGeometry(2.0, 1.2, 4),
        new THREE.MeshStandardMaterial({ color: 0x2a221c, roughness: 1, metalness: 0 })
      );
      roof.rotation.y = Math.PI / 4;
      roof.position.y = 2.05;
      roof.castShadow = true;
      roof.receiveShadow = true;
      g.add(roof);

      const porch = new THREE.Mesh(
        new THREE.BoxGeometry(1.2, 0.25, 0.8),
        new THREE.MeshStandardMaterial({ color: 0x3b2f27, roughness: 1, metalness: 0 })
      );
      porch.position.set(0, 0.18, 1.35);
      porch.castShadow = true;
      porch.receiveShadow = true;
      g.add(porch);

      g.userData = { isFallbackHouse: true };
      return g;
    }

    function normalizeHouseTemplate(source) {
      const model = source.clone(true);
      model.traverse((obj) => {
        if (obj.isMesh) {
          obj.castShadow = true;
          obj.receiveShadow = true;
          if (obj.material && obj.material.map) {
            obj.material.map.colorSpace = THREE.SRGBColorSpace;
          }
        }
      });

      // Scale to a sensible village footprint
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const maxHorizontal = Math.max(size.x, size.z, 0.001);
      const targetWidth = 6.0;
      const scale = targetWidth / maxHorizontal;
      model.scale.setScalar(scale);

      // Recompute after scaling and center the model so group rotation looks sane
      const scaledBox = new THREE.Box3().setFromObject(model);
      const center = scaledBox.getCenter(new THREE.Vector3());
      const scaledSize = scaledBox.getSize(new THREE.Vector3());

      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= scaledBox.min.y;

      const radius = Math.max(scaledSize.x, scaledSize.z) * 0.46;

      return {
        model,
        radius,
        width: scaledSize.x,
        depth: scaledSize.z,
        height: scaledSize.y
      };
    }

    function addHouseAt(position, rotationY, scaleJitter = 1) {
      const group = new THREE.Group();
      const template = houseTemplate || normalizeHouseTemplate(buildFallbackHouseTemplate());

      const model = template.model.clone(true);
      model.scale.multiplyScalar(scaleJitter);

      // Small random tilt is kept very subtle to preserve collision sanity
      group.add(model);
      group.position.copy(position);
      group.rotation.y = rotationY;

      scene.add(group);

      const worldRadius = template.radius * scaleJitter;
      houseInstances.push({
        group,
        radius: worldRadius,
        position: group.position
      });

      return group;
    }

    function isNearSpawn(x, z, safeRadius = 18) {
      return Math.hypot(x - 0, z - 12) < safeRadius;
    }

    function populateVillage() {
      const cellMin = -MAP_HALF + ROAD_WIDTH * 0.65;
      const cellMax = MAP_HALF - ROAD_WIDTH * 0.65;
      const cellStep = 38;
      const innerPad = 4.5;

      const cells = [];
      for (let x0 = cellMin; x0 < cellMax; x0 += cellStep) {
        for (let z0 = cellMin; z0 < cellMax; z0 += cellStep) {
          const x1 = Math.min(x0 + cellStep - ROAD_WIDTH * 0.4, cellMax);
          const z1 = Math.min(z0 + cellStep - ROAD_WIDTH * 0.4, cellMax);
          cells.push({ x0, x1, z0, z1 });
        }
      }

      // Build a village feel by concentrating houses on road-facing edges
      const desiredCount = 42;
      let placed = 0;
      let attempts = 0;

      while (placed < desiredCount && attempts < 300) {
        attempts++;
        const cell = pick(cells);
        const cx = (cell.x0 + cell.x1) * 0.5;
        const cz = (cell.z0 + cell.z1) * 0.5;

        // Avoid the spawn lane and keep the center intersection open
        if (Math.hypot(cx, cz - 12) < 18 && Math.abs(cx) < 20 && Math.abs(cz) < 20) {
          continue;
        }

        const onEdgeBias = Math.random();
        let x = cx;
        let z = cz;

        const side = pick(['n', 's', 'e', 'w']);
        const jitterX = rand(-3.2, 3.2);
        const jitterZ = rand(-3.2, 3.2);

        if (side === 'n') {
          x = clamp(rand(cell.x0 + innerPad, cell.x1 - innerPad), cell.x0 + innerPad, cell.x1 - innerPad);
          z = cell.z1 - 6.0 + jitterZ * 0.18;
        } else if (side === 's') {
          x = clamp(rand(cell.x0 + innerPad, cell.x1 - innerPad), cell.x0 + innerPad, cell.x1 - innerPad);
          z = cell.z0 + 6.0 + jitterZ * 0.18;
        } else if (side === 'e') {
          x = cell.x1 - 6.0 + jitterX * 0.18;
          z = clamp(rand(cell.z0 + innerPad, cell.z1 - innerPad), cell.z0 + innerPad, cell.z1 - innerPad);
        } else {
          x = cell.x0 + 6.0 + jitterX * 0.18;
          z = clamp(rand(cell.z0 + innerPad, cell.z1 - innerPad), cell.z0 + innerPad, cell.z1 - innerPad);
        }

        if (isNearSpawn(x, z, 15)) continue;

        const sideFacingRotation = {
          n: Math.PI,
          s: 0,
          e: -Math.PI / 2,
          w: Math.PI / 2
        };

        // Tiny random deviation for an uneven village look
        const rot = sideFacingRotation[side] + rand(-0.28, 0.28) + (onEdgeBias > 0.7 ? rand(-0.5, 0.5) : 0);
        const scaleJitter = rand(0.82, 1.22);

        addHouseAt(new THREE.Vector3(x, 0, z), rot, scaleJitter);
        placed++;

        // Occasionally add a second house in the same block, but never overload the center
        if (placed < desiredCount && Math.random() > 0.62 && Math.abs(cx) > 18 && Math.abs(cz) > 18) {
          const side2 = pick(['n', 's', 'e', 'w']);
          let x2 = x, z2 = z;
          if (side2 === 'n') {
            x2 = clamp(rand(cell.x0 + innerPad, cell.x1 - innerPad), cell.x0 + innerPad, cell.x1 - innerPad);
            z2 = cell.z1 - 10.5;
          } else if (side2 === 's') {
            x2 = clamp(rand(cell.x0 + innerPad, cell.x1 - innerPad), cell.x0 + innerPad, cell.x1 - innerPad);
            z2 = cell.z0 + 10.5;
          } else if (side2 === 'e') {
            x2 = cell.x1 - 10.5;
            z2 = clamp(rand(cell.z0 + innerPad, cell.z1 - innerPad), cell.z0 + innerPad, cell.z1 - innerPad);
          } else {
            x2 = cell.x0 + 10.5;
            z2 = clamp(rand(cell.z0 + innerPad, cell.z1 - innerPad), cell.z0 + innerPad, cell.z1 - innerPad);
          }
          if (!isNearSpawn(x2, z2, 15)) {
            const rot2 = sideFacingRotation[side2] + rand(-0.28, 0.28);
            addHouseAt(new THREE.Vector3(x2, 0, z2), rot2, rand(0.8, 1.16));
            placed++;
          }
        }
      }
    }

    function finalizeVillage(template) {
      houseTemplate = template || normalizeHouseTemplate(buildFallbackHouseTemplate());
      populateVillage();
      loading.classList.add('hide');
      setTimeout(() => loading.remove(), 650);
    }

    loader.load(
      'ie.glb',
      (gltf) => {
        const template = normalizeHouseTemplate(gltf.scene);
        finalizeVillage(template);
      },
      undefined,
      () => {
        // Fallback if the external model cannot be found
        finalizeVillage(normalizeHouseTemplate(buildFallbackHouseTemplate()));
      }
    );

    // ---------- Touch controls ----------
    const keys = { forward: 0, right: 0 };

    let yaw = 0;
    let pitch = 0;
    const pitchMin = THREE.MathUtils.degToRad(-70);
    const pitchMax = THREE.MathUtils.degToRad(70);

    const move = {
      active: false,
      pointerId: null,
      startX: 0,
      startY: 0,
      dx: 0,
      dy: 0
    };

    const look = {
      active: false,
      pointerId: null,
      lastX: 0,
      lastY: 0
    };

    const playerRadius = 0.38;
    const playerHeight = 1.65;

    function joystickRadius() {
      return Math.min(window.innerWidth * 0.12, 85);
    }

    function setThumb(dx, dy) {
      const maxD = joystickRadius();
      const len = Math.hypot(dx, dy);
      const clamped = len > maxD ? maxD / len : 1;
      const x = dx * clamped;
      const y = dy * clamped;
      joystickThumb.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
    }

    function resetThumb() {
      joystickThumb.style.transform = 'translate(-50%, -50%)';
    }

    function updateJoystickVector() {
      const maxD = joystickRadius();
      const len = Math.hypot(move.dx, move.dy);

      const nx = len > 0 ? move.dx / maxD : 0;
      const ny = len > 0 ? move.dy / maxD : 0;

      keys.right = Math.abs(nx) < 0.05 ? 0 : clamp(nx, -1, 1);
      keys.forward = Math.abs(ny) < 0.05 ? 0 : clamp(-ny, -1, 1);
      setThumb(move.dx, move.dy);
    }

    function isInsideJoystick(x, y) {
      const rect = joystickBase.getBoundingClientRect();
      const pad = 28;
      return x >= rect.left - pad && x <= rect.right + pad && y >= rect.top - pad && y <= rect.bottom + pad;
    }

    document.addEventListener('pointerdown', (e) => {
      if (e.clientX < window.innerWidth / 2 && isInsideJoystick(e.clientX, e.clientY) && move.pointerId === null) {
        move.active = true;
        move.pointerId = e.pointerId;
        move.startX = e.clientX;
        move.startY = e.clientY;
        move.dx = 0;
        move.dy = 0;
        updateJoystickVector();
        e.preventDefault();
        return;
      }

      if (e.clientX >= window.innerWidth / 2 && look.pointerId === null) {
        look.active = true;
        look.pointerId = e.pointerId;
        look.lastX = e.clientX;
        look.lastY = e.clientY;
        e.preventDefault();
      }
    }, { passive: false });

    document.addEventListener('pointermove', (e) => {
      if (move.active && e.pointerId === move.pointerId) {
        move.dx = e.clientX - move.startX;
        move.dy = e.clientY - move.startY;
        updateJoystickVector();
        e.preventDefault();
      }

      if (look.active && e.pointerId === look.pointerId) {
        const dx = e.clientX - look.lastX;
        const dy = e.clientY - look.lastY;
        look.lastX = e.clientX;
        look.lastY = e.clientY;

        yaw -= dx * 0.0045;
        pitch -= dy * 0.0045;
        pitch = clamp(pitch, pitchMin, pitchMax);

        e.preventDefault();
      }
    }, { passive: false });

    function endPointer(e) {
      if (move.active && e.pointerId === move.pointerId) {
        move.active = false;
        move.pointerId = null;
        move.dx = 0;
        move.dy = 0;
        keys.forward = 0;
        keys.right = 0;
        resetThumb();
      }
      if (look.active && e.pointerId === look.pointerId) {
        look.active = false;
        look.pointerId = null;
      }
    }

    document.addEventListener('pointerup', endPointer, { passive: false });
    document.addEventListener('pointercancel', endPointer, { passive: false });
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // ---------- Collision ----------
    function resolveHouseCollisions(pos) {
      for (const h of houseInstances) {
        const dx = pos.x - h.position.x;
        const dz = pos.z - h.position.z;
        const dist = Math.hypot(dx, dz);
        const minDist = h.radius + playerRadius;

        if (dist > 0.0001 && dist < minDist) {
          const push = minDist - dist;
          pos.x += (dx / dist) * push;
          pos.z += (dz / dist) * push;
        } else if (dist <= 0.0001) {
          pos.x += minDist;
        }
      }
    }

    // ---------- Animation ----------
    const clock = new THREE.Clock();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const forward = new THREE.Vector3();

    let candleRemaining = 100;
    let candleDrainPerSecond = 2.35;

    function updateCandle(dt) {
      candleRemaining = Math.max(0, candleRemaining - candleDrainPerSecond * dt);
      candleText.textContent = `蝋燭の残り火：${Math.round(candleRemaining)}%`;

      const flicker = (Math.random() - 0.5) * 0.9 + Math.sin(performance.now() * 0.04) * 0.14;
      candleLight.intensity = 18 + flicker;

      candleLight.distance = 40;
      if (candleRemaining > 0) {
        const t = candleRemaining / 100;
        candleLight.color.setHSL(0.12, 1.0, 0.16 + 0.65 * t);
      } else {
        candleLight.intensity = 0.35;
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.033);

      // movement relative to yaw
      const speed = 2.8;
      direction.set(keys.right, 0, keys.forward);
      if (direction.lengthSq() > 1) direction.normalize();

      const sin = Math.sin(yaw);
      const cos = Math.cos(yaw);

      velocity.x = (direction.x * cos - direction.z * sin) * speed;
      velocity.z = (direction.z * cos + direction.x * sin) * speed;

      const nextPos = camera.position.clone();
      nextPos.x += velocity.x * dt;
      nextPos.z += velocity.z * dt;

      // map boundary
      nextPos.x = clamp(nextPos.x, -MAP_HALF + 2.2, MAP_HALF - 2.2);
      nextPos.z = clamp(nextPos.z, -MAP_HALF + 2.2, MAP_HALF - 2.2);

      resolveHouseCollisions(nextPos);

      camera.position.copy(nextPos);
      camera.position.y = playerHeight;

      camera.rotation.order = 'YXZ';
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;

      // Spotlight stays in sync with gaze
      forward.set(0, 0, -1).applyQuaternion(camera.quaternion);
      candleLight.position.copy(camera.position);
      candleLight.target.position.copy(camera.position).add(forward.multiplyScalar(10));

      updateCandle(dt);

      cube.rotation.y += dt * 0.6;
      cube.rotation.x += dt * 0.25;

      renderer.render(scene, camera);
    }

    function onResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    }

    window.addEventListener('resize', onResize);
    window.addEventListener('orientationchange', onResize);

    animate();
  </script>
</body>
</html>
