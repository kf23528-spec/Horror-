<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>【生配信】事故物件の街でストーカーに待ち伏せされた結果【閲覧注意】</title>
<style>
  :root{
    --bg:#050505;
    --panel:rgba(0,0,0,.72);
    --panel2:rgba(10,10,10,.82);
    --text:#f2f2f2;
    --muted:#c8c8c8;
    --accent:#ff3b3b;
    --good:#61ff7a;
    --warn:#ffd86a;
    --shadow:0 12px 40px rgba(0,0,0,.45);
    --radius:18px;
  }
  html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#000;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none;}
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;}
  #app{position:fixed;inset:0;overflow:hidden;}

  #introScreen{
    position:fixed;inset:0;background:#000;color:#f4f4f4;z-index:30;display:flex;align-items:center;justify-content:center;
    padding:24px;box-sizing:border-box;
  }
  #introCard{
    width:min(920px,100%);height:min(86vh,860px);display:flex;flex-direction:column;justify-content:center;align-items:center;
    background:linear-gradient(180deg, rgba(15,15,15,.95), rgba(0,0,0,.96)); border:1px solid rgba(255,255,255,.08); border-radius:24px;
    box-shadow:var(--shadow); padding:24px; box-sizing:border-box; position:relative;
  }
  #introText{
    width:min(760px,100%); white-space:pre-wrap; line-height:1.9; font-size:clamp(16px,2.1vw,21px); letter-spacing:.02em;
    text-shadow:0 0 10px rgba(255,255,255,.04);
  }
  #introHint{margin-top:18px;color:#fff;opacity:.8;font-size:14px;letter-spacing:.08em}
  #introCta{margin-top:12px;color:var(--accent);font-weight:700;font-size:15px;opacity:0;transition:opacity .25s ease}
  #introCard.ready #introCta{opacity:1}

  #gameUI{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #topLeftObjective{
    position:absolute;top:12px;left:12px;max-width:min(86vw,640px);background:rgba(0,0,0,.45);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:10px 14px; color:#fff; font-size:14px; line-height:1.4;
    box-shadow:0 8px 26px rgba(0,0,0,.25);
  }
  #topLeftObjective b{color:#fff}
  #liveBox{
    position:absolute;top:12px;right:12px;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:10px 12px;color:#fff; font-size:14px; box-shadow:0 8px 26px rgba(0,0,0,.25); text-align:right; min-width:132px;
  }
  #liveBox .live{color:var(--accent);font-weight:900;letter-spacing:.06em}
  #viewerCount{font-weight:700;margin-top:2px}
  #commentFeed{
    position:absolute;left:10px;bottom:12px;width:min(92vw,480px);height:min(32vh,260px);overflow:hidden;display:flex;align-items:flex-end;
    mask-image:linear-gradient(to top, rgba(0,0,0,1) 62%, rgba(0,0,0,0));
  }
  .comment{
    position:absolute;left:0;right:0;padding:8px 12px;margin:8px 0;color:#fff;font-size:14px;line-height:1.45;background:rgba(0,0,0,.52);
    border-left:3px solid rgba(255,255,255,.25); border-radius:10px; box-shadow:0 8px 20px rgba(0,0,0,.22); transform:translateY(40px); opacity:0;
    will-change:transform,opacity; backdrop-filter: blur(6px);
  }
  .comment .name{font-weight:800;color:#b7d7ff;margin-right:6px}
  .comment.show{opacity:1}

  #controlsWrap{position:absolute;inset:0;pointer-events:none;z-index:12;}
  #joystickBase{
    position:absolute;left:18px;bottom:24px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.03), 0 12px 30px rgba(0,0,0,.18);
    pointer-events:auto; touch-action:none;
  }
  #joystickStick{
    position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.14);
    border:1px solid rgba(255,255,255,.2); box-shadow:0 8px 20px rgba(0,0,0,.25);
  }
  #dashBtn{
    position:absolute;right:16px;bottom:24px;width:92px;height:92px;border-radius:24px;background:linear-gradient(180deg, rgba(255,255,255,.1), rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.12); color:#fff; font-weight:800; font-size:16px; letter-spacing:.05em; display:flex;align-items:center;justify-content:center;
    pointer-events:auto; touch-action:none; box-shadow:0 10px 24px rgba(0,0,0,.3);
  }
  #dashBtn.on{background:linear-gradient(180deg, rgba(255,90,90,.24), rgba(255,90,90,.08)); border-color:rgba(255,120,120,.4);}
  #lookHint{position:absolute;right:18px;top:56px;color:rgba(255,255,255,.46);font-size:12px;text-align:right;max-width:160px;line-height:1.4}

  #storyPanel{
    position:absolute;left:0;right:0;bottom:0;z-index:20;display:none;align-items:flex-end;justify-content:center; pointer-events:auto;
  }
  #storyPanel.show{display:flex;}
  #storyBar{
    width:min(100%,980px);background:linear-gradient(180deg, rgba(0,0,0,.2), rgba(0,0,0,.9) 20%, rgba(0,0,0,.96));color:#fff;
    border-top:1px solid rgba(255,255,255,.1); box-shadow:0 -12px 36px rgba(0,0,0,.55); padding:18px 16px 20px; box-sizing:border-box;
  }
  #storyText{font-size:16px;line-height:1.9;white-space:pre-wrap;min-height:88px}
  #storyMeta{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:rgba(255,255,255,.65)}
  #storyMeta .accent{color:var(--accent);font-weight:800}

  #fadeMask{
    position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:25;transition:opacity .35s ease;
  }
  #fadeMask.on{opacity:1}

  #loadingNotice{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;opacity:.75;font-size:14px;display:none;
  }

  @media (max-width: 900px){
    #commentFeed{width:min(94vw,420px);height:min(30vh,240px)}
    #topLeftObjective,#liveBox{font-size:13px}
    #storyText{font-size:15px}
    #joystickBase{width:120px;height:120px}
    #joystickStick{width:52px;height:52px}
    #dashBtn{width:84px;height:84px;border-radius:22px;font-size:15px}
  }
</style>
</head>
<body>
<div id="app"></div>

<div id="introScreen">
  <div id="introCard">
    <div id="introText"></div>
    <div id="introHint">画面をタップして開始</div>
    <div id="introCta">▶ 画面をタップして、生配信を開始する</div>
  </div>
</div>

<div id="gameUI" aria-hidden="true">
  <div id="topLeftObjective"><b>目的：</b>再生数のために、赤いスマホが落ちている不気味な一軒家を探せ</div>
  <div id="liveBox">
    <div class="live">● LIVE</div>
    <div id="viewerCount">👁️ 312人</div>
  </div>
  <div id="commentFeed"></div>
</div>

<div id="controlsWrap" aria-hidden="true">
  <div id="joystickBase"><div id="joystickStick"></div></div>
  <div id="lookHint">右半分をスワイプで視点移動</div>
  <div id="dashBtn">DASH</div>
</div>

<div id="storyPanel" aria-hidden="true">
  <div id="storyBar">
    <div id="storyText"></div>
    <div id="storyMeta"><span>タップで次へ</span><span class="accent" id="storyProgress">1 / 4</span></div>
  </div>
</div>
<div id="fadeMask"></div>
<div id="loadingNotice">Loading...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const PROLOGUE = `【プロローグ】
チャンネル登録者数、わずか302人。
オカルト系底辺配信者である私のチャンネルは、完全に限界を迎えていた。

「一発逆転するなら、ガチでヤバい場所に行くしかない」

ネットの裏掲示板で見つけた『首吊りニュータウン』。
全ての家が全く同じ形をしており、住んだ者が全員1ヶ月以内に不可解な自殺を遂げ、
今は地図から消されたという狂気の新興住宅街。

深夜2時。私はスマホ1台を片手に、この街へ生配信をしながら足を踏み入れた。
視聴者のコメントだけが、この暗闇の中の唯一の救いだ。
だが、この時の私はまだ知らなかった。
配信のコメント欄が、この後「本当の絶望」で埋め尽くされることを……。

▶ 画面をタップして、生配信を開始する`;
  const STORY = [
    `あ、あったわ！みんな見て、机の上に前の配信者のものらしきスマホが落ちてる。画面バキバキだけど、電源が入るな……どれどれ、保存されてる動画データを見てみよう……`,
    `動画内の前の配信者『ハァハァ……おい嘘だろ、出口が見つからない！どの角を曲がっても同じ家ばかりだ！それに……後ろからアイツが追ってくる！関節をパキパキ鳴らしながら、四つん這いで、あり得ないスピードで這いつくばって……！』`,
    `動画内の前の配信者『いやだ、来ないでくれ！ストーカーみたいにずっと私の後ろを……ッ！窓から覗いてる！ポ、ポ、ポ、って声が頭から離れないんだよおぉぉぉ！』……ここで動画が途切れてる。これ、ガチのやつじゃん……`,
    `（コメント欄：『おい主、後ろ』『ガチでヤバいって』『窓の外に誰かいる』『四つん這いの女映ったぞ！！』）……え？みんな何言って……。その時、遠くの道路から『パキッ、パキパキ……』と、骨が折れるような音が響き渡った。`
  ];

  const ui = {
    introScreen: document.getElementById('introScreen'),
    introCard: document.getElementById('introCard'),
    introText: document.getElementById('introText'),
    introCta: document.getElementById('introCta'),
    objective: document.getElementById('topLeftObjective'),
    viewerCount: document.getElementById('viewerCount'),
    commentFeed: document.getElementById('commentFeed'),
    joystickBase: document.getElementById('joystickBase'),
    joystickStick: document.getElementById('joystickStick'),
    dashBtn: document.getElementById('dashBtn'),
    storyPanel: document.getElementById('storyPanel'),
    storyText: document.getElementById('storyText'),
    storyProgress: document.getElementById('storyProgress'),
    fadeMask: document.getElementById('fadeMask'),
    loadingNotice: document.getElementById('loadingNotice'),
  };

  let renderer, scene, camera, clock;
  let world = [];
  let houses = [];
  let colliders = [];
  let player, playerRadius = 0.42;
  let look = { yaw: 0, pitch: 0.06 };
  let keys = { forward:false, back:false, left:false, right:false };
  let state = {
    introDone:false,
    moving:false,
    storyOpen:false,
    storyIndex:0,
    chapterCleared:false,
    redPhoneTaken:false,
    prologueDone:false,
    nearPhone:false,
    canOpenStory:false,
    dash:false,
    viewerPulse:312,
    introTyped:false,
  };
  let playerVel = new THREE.Vector3();
  let moveVec = new THREE.Vector3();
  let tmpVec = new THREE.Vector3();
  let tmpVec2 = new THREE.Vector3();
  let tmpBox = new THREE.Box3();
  let playerBox = new THREE.Box3();
  let phoneBox = new THREE.Box3();
  let houseBoxes = [];
  let phoneObject = null;
  let started = false;
  let pointerState = {
    active:false,
    id:null,
    startX:0,
    startY:0,
    lastX:0,
    lastY:0,
    mode:null,
  };
  let joystick = {
    active:false,
    id:null,
    x:0,
    y:0,
    valueX:0,
    valueY:0,
  };
  const comments = [
    'おいこれガチの場所じゃん',
    '奥に何か映ってね？',
    '釣り乙',
    '早く進めよ',
    '窓のとこ見た？',
    '今の音やばい',
    'うしろ気をつけて',
    'コメント欄も空気重い',
    'ここ、マジで嫌な感じする',
    'え、家の数多すぎない？',
    'なんで電波切れないの？',
  ];

  initIntro();
  createThree();
  bindEvents();
  startUIStreams();
  animate();

  function initIntro(){
    ui.introText.textContent = '';
    let i = 0;
    const speed = 22;
    const timer = setInterval(() => {
      ui.introText.textContent = PROLOGUE.slice(0, i++);
      if (i > PROLOGUE.length){
        clearInterval(timer);
        ui.introCard.classList.add('ready');
        state.introTyped = true;
      }
    }, speed);
  }

  function createThree(){
    renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.shadowMap.enabled = false;
    document.getElementById('app').appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    scene.fog = new THREE.Fog(0x050505, 10, 110);

    camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 220);
    camera.position.set(0, 1.72, 5.5);
    camera.rotation.order = 'YXZ';
    clock = new THREE.Clock();

    const hemi = new THREE.HemisphereLight(0x667788, 0x080808, 0.95);
    scene.add(hemi);
    const dir = new THREE.DirectionalLight(0xffffff, 0.55);
    dir.position.set(-3, 8, 5);
    scene.add(dir);

    buildWorld();
    player = new THREE.Object3D();
    player.position.set(0, 0, 22);
    scene.add(player);
  }

  function buildWorld(){
    const groundMat = new THREE.MeshStandardMaterial({ color:0x111111, roughness:1, metalness:0 });
    const roadMat = new THREE.MeshStandardMaterial({ color:0x1a1a1a, roughness:1, metalness:0 });
    const curbMat = new THREE.MeshStandardMaterial({ color:0x090909, roughness:1 });
    const propMat = new THREE.MeshStandardMaterial({ color:0x2a1c1c, roughness:1 });
    const phoneMat = new THREE.MeshStandardMaterial({ color:0xd61f2a, roughness:.65, metalness:.05, emissive:0x220000, emissiveIntensity:.25 });

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(240, 240, 1, 1), groundMat);
    ground.rotation.x = -Math.PI/2;
    ground.position.y = 0;
    scene.add(ground);

    const road = new THREE.Mesh(new THREE.BoxGeometry(14, 0.05, 170), roadMat);
    road.position.set(0, 0.025, -36);
    scene.add(road);

    const road2 = new THREE.Mesh(new THREE.BoxGeometry(14, 0.04, 28), roadMat);
    road2.position.set(0, 0.02, 18);
    scene.add(road2);

    const sideStripL = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.05, 170), curbMat);
    sideStripL.position.set(-8.1, 0.03, -36);
    scene.add(sideStripL);
    const sideStripR = sideStripL.clone();
    sideStripR.position.x = 8.1;
    scene.add(sideStripR);

    // simple roadside props to keep the street feeling dense but lightweight
    for (let i = 0; i < 24; i++){
      const z = -70 + i * 6.6;
      const postL = new THREE.Mesh(new THREE.BoxGeometry(.16, 2.6, .16), propMat);
      postL.position.set(-11.1, 1.3, z + (i % 2) * 0.5);
      scene.add(postL);
      const postR = postL.clone();
      postR.position.x = 11.1;
      scene.add(postR);
    }

    // Build houses in aligned rows
    const rows = [ -9.2, 9.2 ];
    const baseZ = -80;
    const housesPerSide = 18;
    for (let side = 0; side < 2; side++){
      const x = rows[side];
      const flip = side === 0 ? 1 : -1;
      for (let i = 0; i < housesPerSide; i++){
        const z = baseZ + i * 9.4;
        const h = createHouse({
          color: i % 3 === 0 ? 0x2a2a2e : i % 3 === 1 ? 0x252425 : 0x2b2626,
          x,
          z,
          side: flip,
          withPhone: side === 0 && i === 11,
        });
        houses.push(h.group);
        scene.add(h.group);
        colliders.push(h.collider);
        houseBoxes.push(h.colliderBox);
        if (h.phone){ phoneObject = h.phone; phoneBox = h.phoneBox; }
      }
    }

    // set initial objective house deeper in street if needed
    if (!phoneObject){
      const fallback = createRedPhone();
      fallback.position.set(-9.2, 1.02, baseZ + 11 * 9.4 + 0.35);
      scene.add(fallback);
      phoneObject = fallback;
      phoneBox = new THREE.Box3().setFromObject(fallback);
    }
  }

  function createHouse({ color, x, z, side, withPhone }){
    const g = new THREE.Group();
    g.position.set(x, 0, z);
    g.rotation.y = side > 0 ? 0.02 : -0.02;

    const bodyMat = new THREE.MeshStandardMaterial({ color, roughness:1, metalness:0 });
    const roofMat = new THREE.MeshStandardMaterial({ color:0x171717, roughness:1 });
    const doorMat = new THREE.MeshStandardMaterial({ color:0x0d0d0d, roughness:1 });
    const windowMat = new THREE.MeshStandardMaterial({ color:0x0a0a10, roughness:1, emissive:0x111133, emissiveIntensity:.18 });
    const wall = new THREE.Mesh(new THREE.BoxGeometry(5.1, 3.2, 4.8), bodyMat);
    wall.position.y = 1.6;
    g.add(wall);

    const roof = new THREE.Mesh(new THREE.ConeGeometry(3.6, 1.55, 4), roofMat);
    roof.position.y = 4.05;
    roof.rotation.y = Math.PI / 4;
    g.add(roof);

    const door = new THREE.Mesh(new THREE.BoxGeometry(.82, 1.45, .12), doorMat);
    door.position.set(0, .72, 2.46);
    g.add(door);

    const w1 = new THREE.Mesh(new THREE.BoxGeometry(.72, .78, .08), windowMat);
    w1.position.set(-1.45, 1.95, 2.45);
    g.add(w1);
    const w2 = w1.clone(); w2.position.x = 1.45; g.add(w2);
    const w3 = w1.clone(); w3.position.set(-1.45, 1.95, -2.4); w3.rotation.y = Math.PI; g.add(w3);
    const w4 = w2.clone(); w4.position.set(1.45, 1.95, -2.4); w4.rotation.y = Math.PI; g.add(w4);

    const base = new THREE.Mesh(new THREE.BoxGeometry(5.5, .18, 5.2), new THREE.MeshStandardMaterial({ color:0x090909, roughness:1 }));
    base.position.y = .09;
    g.add(base);

    // Simple debris so all houses share the same style but remain lightweight.
    const vent = new THREE.Mesh(new THREE.BoxGeometry(.18, .18, .18), new THREE.MeshStandardMaterial({ color:0x343434, roughness:1 }));
    vent.position.set(1.8, 3.1, -1.2);
    g.add(vent);

    let phone = null;
    let phoneBoxLocal = null;
    if (withPhone){
      phone = createRedPhone();
      phone.position.set(-0.15, 1.02, -0.25);
      phone.rotation.set(0.1, 0.45, -0.05);
      g.add(phone);
      phoneBoxLocal = new THREE.Box3().setFromObject(phone);
    }

    const colliderBox = new THREE.Box3().setFromObject(g);
    return { group:g, collider:new THREE.Box3(), colliderBox, phone, phoneBox: phoneBoxLocal };
  }

  function createRedPhone(){
    const g = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(.28,.06,.52),
      new THREE.MeshStandardMaterial({ color:0xef202f, roughness:.55, metalness:.08, emissive:0x380000, emissiveIntensity:.28 })
    );
    const screen = new THREE.Mesh(
      new THREE.BoxGeometry(.22,.012,.38),
      new THREE.MeshStandardMaterial({ color:0x0b0b0b, roughness:0.7, metalness:0, emissive:0x330000, emissiveIntensity:.08 })
    );
    screen.position.y = .037;
    const glow = new THREE.Mesh(
      new THREE.SphereGeometry(.18, 10, 10),
      new THREE.MeshBasicMaterial({ color:0xff4c4c, transparent:true, opacity:.06 })
    );
    glow.position.y = .02;
    g.add(body, screen, glow);
    return g;
  }

  function bindEvents(){
    window.addEventListener('resize', onResize);

    // Intro tap begins game
    ui.introScreen.addEventListener('pointerdown', beginGame, { passive:true });
    ui.introScreen.addEventListener('touchstart', beginGame, { passive:true });

    // global tap / click handling for story progression
    const onInteract = (e) => {
      if (!state.introDone) return;
      if (state.storyOpen){
        e.preventDefault();
        advanceStory();
        return;
      }
      if (state.canOpenStory && state.nearPhone && isRightSideTap(e)){
        e.preventDefault();
        openStory();
      }
    };
    window.addEventListener('pointerdown', onInteract, { passive:false });
    window.addEventListener('touchstart', onInteract, { passive:false });
    window.addEventListener('click', onInteract, { passive:false });

    // Movement keys for desktop testing.
    window.addEventListener('keydown', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.forward = true;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.back = true;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = true;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = true;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') setDash(true);
      if (e.code === 'Space' && state.storyOpen) advanceStory();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'KeyW' || e.code === 'ArrowUp') keys.forward = false;
      if (e.code === 'KeyS' || e.code === 'ArrowDown') keys.back = false;
      if (e.code === 'KeyA' || e.code === 'ArrowLeft') keys.left = false;
      if (e.code === 'KeyD' || e.code === 'ArrowRight') keys.right = false;
      if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') setDash(false);
    });

    // Left joystick
    ui.joystickBase.addEventListener('pointerdown', (e) => {
      if (!state.introDone || state.storyOpen) return;
      joystick.active = true;
      joystick.id = e.pointerId;
      ui.joystickBase.setPointerCapture(e.pointerId);
      const rect = ui.joystickBase.getBoundingClientRect();
      joystick.x = rect.left + rect.width / 2;
      joystick.y = rect.top + rect.height / 2;
      moveJoystick(e.clientX, e.clientY, rect);
    });
    ui.joystickBase.addEventListener('pointermove', (e) => {
      if (!joystick.active || e.pointerId !== joystick.id) return;
      const rect = ui.joystickBase.getBoundingClientRect();
      moveJoystick(e.clientX, e.clientY, rect);
    });
    const endJoy = (e) => {
      if (e.pointerId !== joystick.id) return;
      joystick.active = false;
      joystick.id = null;
      joystick.valueX = 0;
      joystick.valueY = 0;
      ui.joystickStick.style.transform = 'translate(-50%, -50%)';
    };
    ui.joystickBase.addEventListener('pointerup', endJoy);
    ui.joystickBase.addEventListener('pointercancel', endJoy);
    ui.joystickBase.addEventListener('pointerleave', (e) => { if (joystick.active) endJoy(e); });

    // Dash button
    ui.dashBtn.addEventListener('pointerdown', (e) => { e.preventDefault(); setDash(true); });
    ui.dashBtn.addEventListener('pointerup', (e) => { e.preventDefault(); setDash(false); });
    ui.dashBtn.addEventListener('pointercancel', (e) => { e.preventDefault(); setDash(false); });

    // Right side swipe camera control
    window.addEventListener('pointerdown', (e) => {
      if (!state.introDone || state.storyOpen) return;
      if (e.clientX > window.innerWidth * 0.48 && e.target !== ui.joystickBase && e.target !== ui.dashBtn){
        pointerState.active = true;
        pointerState.id = e.pointerId;
        pointerState.startX = pointerState.lastX = e.clientX;
        pointerState.startY = pointerState.lastY = e.clientY;
        pointerState.mode = 'look';
      }
    }, { passive:true });
    window.addEventListener('pointermove', (e) => {
      if (!pointerState.active || e.pointerId !== pointerState.id || pointerState.mode !== 'look') return;
      const dx = e.clientX - pointerState.lastX;
      const dy = e.clientY - pointerState.lastY;
      pointerState.lastX = e.clientX;
      pointerState.lastY = e.clientY;
      look.yaw -= dx * 0.0048;
      look.pitch -= dy * 0.0038;
      look.pitch = clamp(look.pitch, -0.65, 0.75);
    }, { passive:true });
    const endLook = (e) => {
      if (e.pointerId !== pointerState.id) return;
      pointerState.active = false;
      pointerState.id = null;
      pointerState.mode = null;
    };
    window.addEventListener('pointerup', endLook);
    window.addEventListener('pointercancel', endLook);
  }

  function moveJoystick(clientX, clientY, rect){
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    const max = rect.width * 0.34;
    let dx = clientX - cx;
    let dy = clientY - cy;
    const len = Math.hypot(dx, dy) || 1;
    if (len > max){ dx = dx / len * max; dy = dy / len * max; }
    ui.joystickStick.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    joystick.valueX = dx / max;
    joystick.valueY = dy / max;
  }

  function setDash(on){
    if (state.storyOpen) on = false;
    state.dash = on;
    ui.dashBtn.classList.toggle('on', on);
  }

  function beginGame(){
    if (!state.introTyped || started) return;
    started = true;
    state.introDone = true;
    ui.introScreen.style.display = 'none';
  }

  function isRightSideTap(e){
    const x = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
    return x >= window.innerWidth * 0.48;
  }

  function openStory(){
    state.storyOpen = true;
    state.storyIndex = 0;
    ui.storyProgress.textContent = `1 / ${STORY.length}`;
    ui.storyText.textContent = STORY[0];
    ui.storyPanel.classList.add('show');
  }

  function advanceStory(){
    state.storyIndex++;
    if (state.storyIndex < STORY.length){
      ui.storyProgress.textContent = `${state.storyIndex + 1} / ${STORY.length}`;
      ui.storyText.textContent = STORY[state.storyIndex];
      return;
    }
    closeStory();
  }

  function closeStory(){
    state.storyOpen = false;
    state.chapterCleared = true;
    state.canOpenStory = false;
    ui.storyPanel.classList.remove('show');
    ui.objective.innerHTML = '<b>目的：</b>何かが来る。家や柵の裏に隠れて視線を切り、お地蔵様の結界へ逃げろ！';
    // Chapter 2 flag placeholder retained in state for next chapter.
    state.nextEnemyFlag = true;
  }

  function startUIStreams(){
    // viewer count fluctuation
    setInterval(() => {
      if (!state.introDone) return;
      const delta = Math.round((Math.random() - 0.5) * 3);
      state.viewerPulse = clamp(state.viewerPulse + delta, 297, 338);
      ui.viewerCount.textContent = `👁️ ${state.viewerPulse}人`;
    }, 1100);

    // comments stream
    setInterval(() => {
      if (!state.introDone) return;
      spawnComment();
    }, 1300);
  }

  function spawnComment(){
    const el = document.createElement('div');
    el.className = 'comment';
    const name = ['匿名','視聴者','古参','初見','通りすがり'][Math.floor(Math.random() * 5)];
    const txt = comments[Math.floor(Math.random() * comments.length)];
    el.innerHTML = `<span class="name">${name}</span>${txt}`;
    const h = ui.commentFeed.clientHeight || 220;
    const top = Math.max(0, h - 54 - (Math.random() * 10));
    el.style.top = `${top}px`;
    el.style.opacity = '0';
    el.style.transform = 'translateY(30px)';
    ui.commentFeed.appendChild(el);
    requestAnimationFrame(() => {
      el.classList.add('show');
      el.animate([
        { transform:'translateY(30px)', opacity:0 },
        { transform:'translateY(0px)', opacity:1 },
        { transform:'translateY(-140px)', opacity:0 }
      ], { duration: 7600 + Math.random() * 2200, easing:'linear', fill:'forwards' });
    });
    setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 9800);
  }

  function updatePlayer(dt){
    if (!state.introDone || state.storyOpen) return;

    const up = camera.up;
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();
    const right = new THREE.Vector3().crossVectors(forward, up).multiplyScalar(-1).normalize();

    const moveX = (joystick.valueX || 0) + (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    const moveY = (joystick.valueY || 0) + (keys.back ? 1 : 0) - (keys.forward ? 1 : 0);

    moveVec.set(0,0,0);
    moveVec.addScaledVector(forward, -moveY);
    moveVec.addScaledVector(right, moveX);

    const inputLen = moveVec.length();
    if (inputLen > 1) moveVec.multiplyScalar(1 / inputLen);

    const walkSpeed = state.dash ? 5.0 : 2.7;
    const accel = 14.0;
    const friction = 10.5;

    if (inputLen > 0.001){
      state.moving = true;
      playerVel.x += moveVec.x * accel * dt;
      playerVel.z += moveVec.z * accel * dt;
    } else {
      state.moving = false;
      playerVel.x = approach(playerVel.x, 0, friction * dt);
      playerVel.z = approach(playerVel.z, 0, friction * dt);
    }

    const maxSpeed = walkSpeed;
    const speed = Math.hypot(playerVel.x, playerVel.z);
    if (speed > maxSpeed){
      const scale = maxSpeed / speed;
      playerVel.x *= scale; playerVel.z *= scale;
    }

    const oldPos = player.position.clone();
    player.position.x += playerVel.x * dt;
    player.position.z += playerVel.z * dt;
    player.position.y = 0;

    // Flat ground only, no floating. Collision using Box3 only.
    resolveCollisions(oldPos);

    // camera target follow
    const targetY = 1.72;
    camera.position.set(player.position.x, targetY, player.position.z);
    camera.rotation.set(look.pitch, look.yaw, 0, 'YXZ');

    // phone proximity
    if (phoneObject){
      const d = player.position.distanceTo(phoneObject.getWorldPosition(tmpVec));
      state.nearPhone = d <= 3.5;
      if (state.nearPhone){
        state.canOpenStory = true;
      }
    }

    // Chapter 1 clear state can open story only near phone
    if (state.nearPhone && !state.storyOpen){
      ui.objective.innerHTML = '<b>目的：</b>赤いスマホを見つけた。右半分をタップして調べる';
    }

    // subtle environment ambience
    scene.fog.near = 9;
    scene.fog.far = 95 + Math.sin(performance.now() * 0.0002) * 2;
  }

  function resolveCollisions(oldPos){
    playerBox.setFromCenterAndSize(
      player.position.clone().add(new THREE.Vector3(0, 0.9, 0)),
      new THREE.Vector3(playerRadius * 2, 1.8, playerRadius * 2)
    );

    for (let i = 0; i < houses.length; i++){
      const house = houses[i];
      const collider = colliders[i];
      collider.setFromObject(house);
      if (!collider.intersectsBox(playerBox)) continue;

      // lightweight axis separation by testing the moved position against current house box
      const dx = player.position.x - oldPos.x;
      const dz = player.position.z - oldPos.z;
      const hb = houseBoxes[i] || collider;
      const center = hb.getCenter(tmpVec2);
      const overlapX = (playerRadius + 2.6) - Math.abs(player.position.x - center.x);
      const overlapZ = (playerRadius + 2.4) - Math.abs(player.position.z - center.z);

      if (overlapX < overlapZ){
        player.position.x = oldPos.x;
        playerVel.x *= -0.08;
      } else {
        player.position.z = oldPos.z;
        playerVel.z *= -0.08;
      }
      playerBox.setFromCenterAndSize(
        player.position.clone().add(new THREE.Vector3(0, 0.9, 0)),
        new THREE.Vector3(playerRadius * 2, 1.8, playerRadius * 2)
      );
    }

    // keep player within general map bounds
    player.position.x = clamp(player.position.x, -12.5, 12.5);
    player.position.z = clamp(player.position.z, -84, 80);
  }

  function animate(){
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.033);
    if (state.introDone) updatePlayer(dt);
    updatePhoneGlow();
    renderer.render(scene, camera);
  }

  function updatePhoneGlow(){
    if (!phoneObject) return;
    const t = performance.now() * 0.001;
    phoneObject.rotation.z += Math.sin(t * 1.8) * 0.0005;
    phoneObject.scale.setScalar(1 + Math.sin(t * 4.2) * 0.01);
  }

  function onResize(){
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
  function approach(v, target, delta){
    if (v < target) return Math.min(v + delta, target);
    return Math.max(v - delta, target);
  }
})();
</script>
